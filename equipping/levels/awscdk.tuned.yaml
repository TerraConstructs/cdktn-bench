# awscdk, equipping level `tuned` (prereg §2.2: "AWS MCP + AWSCDK agent-tool
# plugins / Kiro Powers + AWS Docs MCP"). The Kiro power's prose is not
# redistributable, so the skill here is bench-written and cites it --
# equipping/bench/cdk-authoring/UPSTREAM.md.
skills:
  - source: bench/cdk-authoring
    as: cdk-authoring
mcp_servers:
  # The MCP the Kiro power itself declares (kirodotdev/powers/
  # aws-infrastructure-as-code/mcp.json), pinned. Its CDK documentation,
  # samples and best-practice tools need no AWS credentials.
  - name: aws-iac
    transport: stdio
    command: awslabs.aws-iac-mcp-server
    args: []
  - name: aws-documentation
    transport: stdio
    command: awslabs.aws-documentation-mcp-server
    args: []

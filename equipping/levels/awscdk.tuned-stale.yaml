# awscdk, equipping level `tuned-stale` (ROADMAP M2 H2, the staleness cost).
# Identical to `tuned` in every channel except the skill body: same MCP servers,
# same skill directory name and frontmatter, so the level is not discoverable
# from inside the container. What is stale is recorded in
# scripts/vendor_equipping.pins.json.
skills:
  - source: bench/cdk-authoring-stale
    as: cdk-authoring
mcp_servers:
  # awslabs' CDK-specific server (CDK guidance, cdk-nag rules, Solutions
  # Constructs), pinned in equipping/MANIFEST.json. It stands in for the
  # aws-iac server the Kiro power declares, which has no linux/aarch64 build.
  - name: aws-cdk
    transport: stdio
    command: awslabs.cdk-mcp-server
    args: []
  - name: aws-documentation
    transport: stdio
    command: awslabs.aws-documentation-mcp-server
    args: []

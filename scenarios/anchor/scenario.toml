schema_version = "1.0"

[scenario]
name = "anchor"
description = "Near-empty anchor scenario (build plan Phase 0, mismatch M1): one trivial, zero-cost SSM parameter plus the three standard QA roles. Its only job is to satisfy aws-bench's real-AWS-account precondition (env init / env setup / env cleanup) cheaply and once; every cdktn-bench task grades offline inside its own agent container."
account_tags = ["PRIMARY"]
regions = ["us-east-1"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048

[deploy]
timeout_sec = 900.0

[verify]
timeout_sec = 120.0

[cleanup]
timeout_sec = 600.0

[reset]
timeout_sec = 300.0

# No [[quotas]] entries: an SSM String parameter and three IAM roles need no
# service-quota increase.

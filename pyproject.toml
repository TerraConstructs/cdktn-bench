[project]
name = "cdktn-bench"
version = "0.1.0"
description = "IaC-abstraction benchmark (AWS CDK L2 vs raw HCL vs terraconstructs) built on the aws-bench runner."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "aws-bench",
]

[project.scripts]
# The extended CLI (task #14 / docs/design/multistep-trial-investigation.md
# Seam A). A superset of `aws-bench`: identical flags, plus multi-step tasks
# instead of `NotImplementedError`. `aws-bench` stays installed and its own CLI
# unchanged; scripts/run-bench.sh execs cdktn-bench (DECISIONS.md Amendment 27 §7).
cdktn-bench = "cdktn_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "jsonata-python>=0.5.0",
    "jsonpath-ng>=1.8.0",
]

[tool.uv.sources]
aws-bench = { git = "https://github.com/aws-bench/aws-bench.git", rev = "6450cb56c4552934a37feff492a6fd4eb84d1108" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ONLY cdktn_bench/ is an installable package. gates/, generator/, metrics/,
# oracles/ and test/ stay repo-relative scripts reached via their own sys.path
# shims (gates/tests/conftest.py, generator/tests/conftest.py) — flipping the
# project to a package must not quietly start shipping them.
packages = ["cdktn_bench"]
# The test suite + its toy task fixtures are development material, not part of
# the distributed package. They stay importable locally because uv installs
# this project editable.
exclude = ["cdktn_bench/tests"]

[tool.uv]
# Flipped 2026-08-20 (task #14): cdktn_bench/ is a real importable package
# providing the `cdktn-bench` console script. `uv sync` installs it editable,
# so an edit under cdktn_bench/ takes effect without a re-sync.
package = true

# SOURCE-VERIFIED (this authoring session, 2026-08-21):
#
#   aws-cdk-lib (local clone, packages/aws-cdk-lib/aws-dynamodb/lib/table.ts):
#     - `registerAttribute()` (private, :1802-1813) is the ONLY place that
#       pushes into `this.attributeDefinitions`, called exclusively from
#       the table's own partition/sort-key wiring and from
#       `addGlobalSecondaryIndex()`/`addLocalSecondaryIndex()`. There is no
#       public API that adds an attribute definition without it being a
#       key -- confirmed by reading the whole class, not assumed.
#     - `addGlobalSecondaryIndex()`'s projection validation (:1760-1767)
#       throws `ValidationError` synchronously ("non-key attributes should
#       be specified when using INCLUDE projection type" / the converse)
#       when `projectionType: INCLUDE` is set without `nonKeyAttributes`,
#       or vice versa.
#     - Rendered at :1365 (`attributeDefinitions: this.attributeDefinitions`).
#
#   terraconstructs 0.2.13 (local pnpm store,
#   lib/aws/storage/table.js -- byte-identical mechanism):
#     - `registerAttribute()` (:1085-1096), same de-dup-by-name shape,
#       called only from `addKey()` (table keys) and
#       `addGlobalSecondaryIndex()` (:776-808, itself calling
#       `registerAttribute(props.partitionKey)` /
#       `registerAttribute(props.sortKey)`). No other caller exists in the
#       file. Rendered at :685 (`attribute: this.attributeDefinitionsInternal`).
#     - `buildIndexProjection()` (:1047-1055) throws the same-shaped
#       `ValidationError` ("Non-key attributes should be specified when
#       using INCLUDE projection type") for the identical INCLUDE-without-
#       nonKeyAttributes mistake.
#     - `GlobalSecondaryIndexProps extends SecondaryIndexProps, SchemaOptions`
#       (lib/aws/storage/table.d.ts:341) exposes exactly
#       `indexName`/`partitionKey`/`sortKey`/`projectionType`/
#       `nonKeyAttributes` -- no escape hatch to add a bare attribute
#       definition either.
#   CONCLUSION: on both typed arms, catch 1 (over-declared attribute
#   definitions) and catch 3 (undeclared GSI key attribute) are
#   structurally unreachable through the public L2 API on both arms --
#   `registerAttribute` is the only writer of the attribute-definition set
#   on both, and it is never called except from a key-defining path.
#
#   hashicorp/aws 6.58.0, LIVE-VERIFIED with a real, fully offline
#   `terraform init` (filesystem-cached provider binary,
#   `skip_credentials_validation`/`skip_requesting_account_id`/
#   `skip_metadata_api_check` = true, dummy `access_key`/`secret_key` --
#   no AWS API is ever contacted) + `terraform validate` + `terraform plan`
#   against three minimal `aws_dynamodb_table` fixtures, run directly at
#   authoring time (not assumed from the blueprint's own citation):
#
#     (a) extra `attribute` blocks for shippingAddress/lineItems/
#         paymentReference (catch 1): `terraform validate` PASSES (only a
#         deprecation warning for `hash_key`); `terraform plan` FAILS --
#         "Error: all attributes must be indexed. Unused attributes:
#         [\"lineItems\" \"paymentReference\" \"shippingAddress\"]" -- a
#         LOCAL provider-side check with no network/AWS call involved
#         (confirmed by the offline provider flags above). This is a
#         REFINEMENT of the blueprint's own citation (tfp-aws#46322 quotes
#         the mirror-image "Unmatched indexes" error, not this one) --
#         same mechanism, the complementary message, both real and both
#         reproduced directly here.
#     (b) `customerId`/`createdAt` used as a GSI key but never declared as
#         `attribute` blocks (catch 3): `terraform validate` PASSES;
#         `terraform plan` FAILS -- "Error: all indexes must match a
#         defined attribute. Unmatched indexes: [\"createdAt\"
#         \"customerId\"]" -- byte-identical to tfp-aws#46322's own quoted
#         text. LOCAL check, same offline guarantee as (a).
#     (c) `projection_type = "INCLUDE"` with `non_key_attributes` omitted
#         (catch 2): `terraform validate` PASSES *and* `terraform plan`
#         ALSO SUCCEEDS -- `non_key_attributes` resolves to `[]` in
#         `planned_values` rather than being rejected by either toolchain
#         step. THIS CONTRADICTS THE BLUEPRINT'S IMPLIED MECHANISM (its own
#         "0 / 0" tier prediction did not specify HOW hcl_raw reaches tier
#         0 for this catch, and the s3-lambda-log-retention precedent this
#         batch leans on is a toolchain-rejection precedent, which does NOT
#         hold here). The tier prediction ("0") is UNCHANGED, but the
#         mechanism is: hcl_raw is caught by the
#         `gsi-projects-exactly-status-and-total` structural_assert alone
#         (empty resolved set != {status, totalAmount}), same as it would
#         catch a solution that used ALL/KEYS_ONLY projection instead. See
#         that catch's own description for the corrected mechanism.
#     A fourth fixture (all keys declared correctly, INCLUDE +
#     non_key_attributes = [status, totalAmount]) was also run and plans
#     clean, confirming the structural_asserts below resolve against real
#     `terraform show -json` output byte-for-byte (paths re-verified with
#     `jq` directly against that plan's JSON, not assumed from memory).
#
#   Every `cfn_jsonpath`/`tf_jsonpath` below was independently re-verified
#   by compiling it through `generator/jsonpath_jq.py` and running the
#   resulting `jq` filter against (i) the real `terraform show -json`
#   output from the fixtures above and (ii) a synthetic
#   `AWS::DynamoDB::Table` CFN fragment built from the standard, decade-
#   stable CFN resource shape (AttributeDefinitions/KeySchema/
#   GlobalSecondaryIndexes/Projection) -- both resolve to the expected

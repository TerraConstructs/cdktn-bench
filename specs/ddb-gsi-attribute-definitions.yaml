# DEVIATION FROM THE BLUEPRINT'S LITERAL PROMPT TEXT (recorded here, not
# silently reproduced): the blueprint's own shared_body never spells out
# `customerId`/`createdAt`/`totalAmount` as literal field names -- it says
# "list one customer's orders newest-first" and "shows the order's status
# and total". But oracle.structural_asserts below (copied from the
# blueprint's own oracle-tier table) check those EXACT literal strings via
# `eq`/`set_eq`. An oracle that hardcodes identifier strings the ticket
# never states is unsound -- it would fail an agent who wrote a completely
# correct table using, say, `customer_id`/`orderDate`/`total`. The fix
# applied here is NOT a new prompt constraint (it adds no mechanism/shape
# requirement -- no GSI, index, or projection vocabulary is named); it
# extends the SAME "items also carry ..." data-model sentence already in
# the blueprint's own prompt to name every field by its real identifier,
# exactly as `orderId` already is. This is the same move
# s3-lambda-log-retention's own prompt makes ("items carry these
# attributes" is data, not an implementation hint) -- see
# instruction.shared_body below.
#
# ALTERNATIVE-SHAPE FIX (awscdk arm, found by a verifier, fixed this
# session): `aws-cdk-lib` 2.263.0's `dynamodb.TableV2` -- the construct the
# library's own `aws-dynamodb/README.md` calls "the preferred construct for
# all use cases, including creating a single table" -- synthesizes
# `AWS::DynamoDB::GlobalTable`, never `AWS::DynamoDB::Table`. Every
# `cfn_jsonpath` below originally hard-filtered on
# `@.Type=='AWS::DynamoDB::Table'` alone, so a property-for-property
# CORRECT `TableV2` solution resolved ZERO nodes on every assert and
# scored 0.0 for a reason that has nothing to do with this scenario's
# actual pitfall -- exactly the `apigw-openapi` "each route is its own
# resource" failure mode `docs/adding-scenarios.md` §1 item 3a warns
# against, except this instance was oracle-side (a jsonpath too narrow),
# not prompt-side. REPRODUCED directly this session: synthesized a minimal
# `TableV2` stack (`aws-cdk-lib` 2.263.0, this arm's own pinned version)
# with `partitionKey: orderId` and one `globalSecondaryIndexes` entry
# (`customerId`/`createdAt`, `INCLUDE`, `[status, totalAmount]`) --
# semantically identical to the reference solution. Its synthesized
# `Properties` are BYTE-IDENTICAL in shape to `AWS::DynamoDB::Table`'s:
# `AttributeDefinitions`/`KeySchema`/`GlobalSecondaryIndexes[*].KeySchema`/
# `.Projection.{ProjectionType,NonKeyAttributes}` all present at the exact
# same paths (the only additions are a top-level `Replicas` array and a
# per-GSI-replica stanza, neither of which any assert below touches).
# FIXED by widening the `Type` filter on all six `cfn_jsonpath` entries to
# `@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable'`
# (jq disjunction, compiled and verified directly through
# `generator/jsonpath_jq.py`, then run with `jq` against the real
# synthesized `TableV2` template above -- all six now resolve correctly).
# `solution/reference-alt-tablev2/` under the awscdk task dir is a second,
# hand-authored `TableV2` reference fixture proving this tolerance for
# real (not auto-discovered by `gates/oracle_falsifiability.py` --
# `solution/solve.sh` stays the canonical `Table`-shaped reference the
# gate walks; this is a manually-run, additional proof, since the harness
# has no "second correct shape" slot -- see that fixture's own solve.sh
# header for the transcript).

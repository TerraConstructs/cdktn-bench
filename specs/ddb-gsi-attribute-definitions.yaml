# in `oracles/rego/ddb-gsi-attribute-definitions/policy.rego` (own header
# comment, matching section names below, has the full argument and live,
# offline reproduction of each):
#
#   (1) TABLE-ASSOCIATION FIX: `table_gsis`'s standalone-resource fallback
#   (added by the STANDALONE-GSI fix) matched EVERY
#   `aws_dynamodb_global_secondary_index` resource in the plan to EVERY
#   table, with no check on that resource's own `table_name` -- an
#   ORPHAN standalone GSI resource (one whose `table_name` names some
#   unrelated table, or a table not present in the plan) made the
#   REPAIR-ROUND-2 existence check pass vacuously for a table with NO
#   real index of its own. Fixed by associating a standalone GSI with a
#   table only when its `table_name` resolves to that table's own
#   `.values.name`, or is genuinely absent/null (the `.id`-reference
#   construction, still plan-time-unknown and so still permissively
#   matched -- this fix narrows a false unconditional match, it does not
#   reintroduce the strict-match regression the STANDALONE-GSI fix's
#   original reasoning was written to avoid).
#   `solution/broken/gsi-missing-entirely/solve.sh` (hcl_raw task dir) now
#   additionally carries an orphan standalone GSI resource, so
#   `gates/oracle_falsifiability.py` exercises this fix through the real
#   toolchain, not just a manual `opa eval`.
#
#   (2) TERRACONSTRUCTS TOLERANCE FIX: the STANDALONE-GSI fix narrowed
#   `gsi-hash-key-is-customerId`/`gsi-range-key-is-createdAt`/
#   `gsi-projection-is-include`/`gsi-projects-exactly-status-and-total`
#   off hcl_raw's `applies_to` but left terraconstructs on them, reasoning
#   (this file's arms.terraconstructs.reason, and the catches below) that
#   terraconstructs's own `storage.Table` L2 construct can only ever
#   synthesize the inline `global_secondary_index` block. True of
#   `storage.Table` itself, but incomplete for the arm: the
#   terraconstructs task's own `environment/app/package.json` also ships
#   `@cdktn/provider-aws`, whose L1 `DynamodbGlobalSecondaryIndex` binding
#   synthesizes the SAME standalone-resource shape hcl_raw already
#   tolerates -- reachable in the same workspace, not a hypothetical. The
#   adversarial-verification finding that surfaced this REPRODUCED it end
#   to end (a `storage.Table` partition key plus a sibling L1
#   `DynamodbGlobalSecondaryIndex` plans clean and is
#   semantically-identical to the reference shape, but scored 0.0 on four
#   `jq` errors before this fix); this repair round INDEPENDENTLY
#   RE-CONFIRMED reachability by inspecting a local install of the arm's
#   own exact pinned `@cdktn/provider-aws@24.8.0` directly (`static
#   readonly tfResourceType = "aws_dynamodb_global_secondary_index"` on
#   `DynamodbGlobalSecondaryIndex`) and mechanically confirmed the fix
#   composes correctly (the regenerated terraconstructs
#   `tests/static_tiers.sh` now declares only 1 tier-0 assert, matching
#   hcl_raw; its `tests/policy.rego` is byte-identical to the file this
#   round edited) without re-running the arm's own `npm ci`/`cdktn synth`
#   a second time. Fixed the same way the STANDALONE-GSI fix
#   handled hcl_raw: those four asserts now `applies_to: [awscdk]` only;
#   terraconstructs is graded on all four facts at tier 1 instead, by the
#   SAME already-shape-tolerant `policy.rego` rules (no rule-body change
#   needed -- that file already runs against terraconstructs's own
#   `terraform show -json` plan output via
#   `attribute-definitions-are-exactly-the-key-attributes`'s own
#   `applies_to`). `predicted_tier_caught.terraconstructs_override` is
#   updated below, on the three catches this changes, from `"0"` to `"1"`
#   (matching `hcl`'s value -- terraconstructs no longer diverges from the
#   `.hcl` collapsing convention for these facts, since it no longer has
#   its own, narrower tier-0 mechanism catching them): `include-
#   projection-without-non-key-attributes`,
#   `gsi-projection-type-is-keys-only-not-include`, `gsi-missing-entirely`.
#   `arms.terraconstructs.reason` below is corrected to no longer imply
#   `storage.Table` is the arm's only DynamoDB-GSI-producing surface.

id: ddb-gsi-attribute-definitions
workspace_id: orders-table
title: "Orders table with a per-customer query index"
difficulty: 2
services: [dynamodb]

arms:
  awscdk: true
  hcl_raw: true
  terraconstructs:
    enabled: true
    reason: >
      terraconstructs 0.2.13, lib/aws/storage/table.js (local pnpm-store
      clone, read in full at authoring time): `storage.Table` is a real L2
      with genuine GSI support -- `addGlobalSecondaryIndex()` (:776-808)
      takes typed `partitionKey`/`sortKey`/`projectionType`/
      `nonKeyAttributes` props (lib/aws/storage/table.d.ts:341,
      `GlobalSecondaryIndexProps extends SecondaryIndexProps,
      SchemaOptions`), calls the SAME private `registerAttribute()`
      (:1085-1096) aws-cdk-lib's Table class calls, and synthesizes a
      genuine `aws_dynamodb_table` resource (`attribute`/
      `globalSecondaryIndex` rendered at :685-687 via
      `@cdktn/provider-aws`'s `dynamodbTable` binding) -- no custom
      resource, no L1 escape hatch needed. `buildIndexProjection()`
      (:1047-1055) throws the same INCLUDE-without-nonKeyAttributes
      `ValidationError` aws-cdk-lib throws, at the same synth-time layer.
      `storage.AttributeType`/`storage.ProjectionType` are real TS enums
      (lib/aws/storage/shared.d.ts:108/:169) re-exported through the
      `storage` namespace (lib/aws/storage/index.d.ts,
      lib/aws/index.d.ts:13 `export * as storage from "./storage"`).
      NOTE (REPAIR ROUND 3, 2026-08-22): `storage.Table` is not this arm's
      ONLY DynamoDB-GSI-producing surface -- this task's own
      `environment/app/package.json` also ships `@cdktn/provider-aws`,
      whose L1 `DynamodbGlobalSecondaryIndex` binding synthesizes a
      standalone `aws_dynamodb_global_secondary_index` resource,
      reachable alongside `storage.Table` in the same workspace. See this
      file's header comment, "TERRACONSTRUCTS TOLERANCE FIX", for how the
      oracle now tolerates that shape too.

instruction:
  shared_body: |
    Create the DynamoDB table for the orders service.

    Each order is identified by orderId, belongs to a customerId, and
    records when it was placed as createdAt. The support tooling needs to
    list one customer's orders newest-first, and for that listing it only
    ever shows the order's status and totalAmount -- nothing else should be
    read from the index.

    Items also carry shippingAddress, lineItems and a paymentReference.
  placeholders: []
  per_arm:
    awscdk:
      language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdk.out/ScenarioStack.template.json
        build_command: "npm run build"
        synth_command: "npx cdk synth --no-lookups --quiet -o cdk.out"
        json_fields: []
    hcl_raw:
      language_line: "Author this as hand-written Terraform HCL (no modules)."
      output_contract:
        entry_file: main.tf
        artifact_path: plan.json
        plan_command: >-
          terraform init && terraform validate && terraform plan -out=plan.tfplan
          && terraform show -json plan.tfplan > plan.json
        json_fields: []
    terraconstructs:
      language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdktf.out/stacks/orders-table/plan.json
        synth_command: "npx cdktn synth"
        json_fields: []

catches:
  - name: attribute-definitions-include-non-key-attributes
    taxonomy: typed-value-trap
    description: >
      Declares `attribute` blocks for shippingAddress, lineItems AND
      paymentReference in addition to the three real key attributes --
      the PLAUSIBLE-WRONG solution: "declare your schema" is what
      `attribute` blocks mean in every relational-adjacent tool, and the
      prompt's own item-shape sentence (data, not an implementation hint --
      see this file's header comment) is what invites it. LIVE-VERIFIED at
      authoring time (hashicorp/aws 6.58.0, fully offline -- see header):
      `terraform validate` PASSES (only a deprecation warning), but
      `terraform plan` itself FAILS -- "Error: all attributes must be
      indexed. Unused attributes: [\"lineItems\" \"paymentReference\"
      \"shippingAddress\"]" -- a local provider-side check, no AWS API
      call, no apply needed. Structurally unreachable on awscdk and
      terraconstructs through ordinary use: `registerAttribute()` is the
      only writer of the attribute-definition set on both, and on both it
      is called exclusively from a key-defining path (table partition/sort
      key, or `addGlobalSecondaryIndex`) -- confirmed by reading each
      class in full, not assumed. No dedicated structural_assert exists
      for this catch: the generated `tests/static_tiers.sh` writes
      reward=0.0 unconditionally the moment `plan_command` fails, before
      any structural_assert or policy ever runs (same convention
      specs/s3-lambda-log-retention.yaml's own
      log-retention-not-a-valid-enum-value catch documents).
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: include-projection-without-non-key-attributes
    taxonomy: typed-value-trap
    description: >
      Sets the GSI's projection to INCLUDE but omits the projected
      attribute list. On awscdk/terraconstructs this is a synth-time
      `ValidationError`, thrown from the SAME private validation method on
      both (`buildIndexProjection`/the inline check inside
      `addGlobalSecondaryIndex` -- see this file's header comment for the
      exact lines on each arm) -- structurally unreachable to leave
      unhandled: the L2 call throws before synth output exists.
      On hcl_raw this is NOT a toolchain-tier rejection -- LIVE-VERIFIED
      directly (correcting an unstated assumption in the design blueprint,
      which predicted tier "0" for hcl_raw without specifying the
      mechanism): `terraform validate` AND `terraform plan` both SUCCEED
      with `projection_type = "INCLUDE"` and `non_key_attributes` omitted;
      the plan's `planned_values` shows `non_key_attributes: []` rather
      than an error. hcl_raw is caught here by the fact
      `gsi-projects-exactly-status-and-total` encodes: an empty resolved
      set can never equal `{status, totalAmount}` under set-equality, so
      this remains a genuine catch on every arm, just via a different
      mechanism/tier on hcl_raw than on the two typed arms. As of the
      STANDALONE-GSI SHAPE-TOLERANCE FIX (this file's header comment),
      `gsi-projects-exactly-status-and-total` itself is tier 0 on
      awscdk/terraconstructs only; on hcl_raw the identical fact is
      graded at TIER 1 instead, by
      `oracles/rego/ddb-gsi-attribute-definitions/policy.rego` (the same
      jsonpath-grammar limit the KEY_SCHEMA SHAPE-TOLERANCE FIX already
      hit for the two GSI-key facts applies here too: a standalone
      `aws_dynamodb_global_secondary_index` resource's projection lives
      at a different path than the inline block's, which one jsonpath
      cannot express). TERRACONSTRUCTS TOLERANCE FIX (REPAIR ROUND 3, this
      file's header comment) narrowed `gsi-projects-exactly-status-and-
      total`'s own `applies_to` to `[awscdk]` only -- but THIS catch's
      terraconstructs mechanism is UNCHANGED by that, and stays
      `terraconstructs_override: "0"`: unlike `gsi-projection-type-is-
      keys-only-not-include` (which plans/synths clean and so genuinely
      depended on which tier graded it), this fixture's own
      `table.addGlobalSecondaryIndex()` call throws the synth-time
      `ValidationError` this description's own first sentence documents
      UNCONDITIONALLY, before `cdktf.out/.../plan.json` is ever produced
      -- LIVE-VERIFIED directly in the local `terraconstructs` clone,
      `lib/aws/storage/table.js:995-999`. No structural_assert (tier 0 or
      tier 1) is ever reached to grade this fixture on terraconstructs,
      so narrowing `gsi-projects-exactly-status-and-total`'s `applies_to`
      changes nothing here -- `terraconstructs_override: "0"` denotes the
      SAME toolchain-failure bucket it always did, still accurate.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "1"
      terraconstructs_override: "0"

  - name: gsi-key-attribute-not-declared
    taxonomy: graph-dependency
    description: >
      Adds the GSI on customerId (hash) / createdAt (range) but leaves
      both out of the table's `attribute` set -- the mirror image of
      attribute-definitions-include-non-key-attributes. tfp-aws#46322's
      quoted error text is byte-identical to what this exact mistake
      produces (see header comment's honest re-characterization of that
      issue -- it is a provider regression/false-positive, not a report of
      anyone actually making this mistake, but the validator it documents
      is the same one that fires here). LIVE-VERIFIED at authoring time
      (hashicorp/aws 6.58.0, fully
      offline): `terraform validate` PASSES; `terraform plan` FAILS --
      "Error: all indexes must match a defined attribute. Unmatched
      indexes: [\"createdAt\" \"customerId\"]" -- byte-identical to
      tfp-aws#46322's own quoted error text, a local provider-side check,
      no AWS API call. Structurally unreachable on awscdk/terraconstructs
      through ordinary use: `addGlobalSecondaryIndex()` calls
      `registerAttribute()` on its own `partitionKey`/`sortKey` props as a
      side effect on both arms (aws-cdk-lib :1749/:1789;
      terraconstructs.js :783-784), so an agent using the idiomatic API
      cannot add a GSI key without its attribute definition being added
      alongside it automatically. No dedicated structural_assert exists
      for this catch either, for the same reason as the first catch: the
      toolchain step itself fails before any structural_assert runs.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: attribute-definitions-include-an-unrequested-key
    taxonomy: typed-value-trap
    description: >
      Gives the table itself a sort key on status (hash_key=orderId,
      range_key=status), in addition to the requested byCustomer GSI --
      a real, always-available primary-key shape no ticket text asks for
      ("each order is identified by orderId" names the table's own key as
      orderId alone; nothing asks for a composite table key). Unlike
      attribute-definitions-include-non-key-attributes (a DANGLING
      attribute block, rejected by the provider) and
      gsi-key-attribute-not-declared (a MISSING one, also rejected), this
      attribute genuinely IS used as a real key -- so nothing in any
      toolchain has grounds to reject it. LIVE-VERIFIED at authoring time
      on every arm: hcl_raw (hashicorp/aws 6.58.0, fully offline) --
      `terraform validate` and `terraform plan` both SUCCEED, `status`
      lands in `values.attribute` as a fourth entry; awscdk (aws-cdk-lib
      2.263.0) -- `new dynamodb.Table(this, "OrdersTable", {
      partitionKey: orderId, sortKey: status })` synths clean, no
      `ValidationError`, `AttributeDefinitions` gets a fourth entry;
      terraconstructs 0.2.13 -- `storage.Table`'s `TableOptions` exposes
      the identical `sortKey?: Attribute` prop (`table.d.ts:26`) rendered
      through the SAME `registerAttribute()` this scenario's header
      comment already documents, so the same fourth-entry widening
      reproduces there too. Every OTHER structural_assert in this scenario
      stays single-valued and passes (the table's own HASH key is still
      orderId; there is still exactly one GSI, still customerId/createdAt/
      INCLUDE/[status,totalAmount]) -- only the attribute-definition SET
      is wrong, which is exactly what
      attribute-definitions-are-exactly-the-key-attributes (tier 1, see
      its own description) exists to catch, and the only catch in this
      scenario that fact actually catches.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null

  - name: gsi-projection-type-is-keys-only-not-include
    taxonomy: typed-value-trap
    description: >
      Sets the GSI's projection to KEYS_ONLY (omitting non_key_attributes
      entirely, which KEYS_ONLY neither needs nor accepts an error for) --
      the blueprint's own named competing shape
      (`docs/design/batch-a-greenfield-blueprints.md` §6(b) "Oracle must
      tolerate / defend": "Two shapes satisfy the listing requirement... The
      oracle accepts INCLUDE only... KEYS_ONLY forces a second read of the
      whole item"), and a genuinely plausible choice -- KEYS_ONLY is often
      cited as the storage-minimal/best-practice default. LIVE-VERIFIED at
      authoring time on every arm: this plans/synths CLEAN everywhere (no
      validation error anywhere -- KEYS_ONLY is a complete, valid
      projection on its own), so nothing here is toolchain-caught. Caught
      instead by the two facts `gsi-projection-is-include` and
      `gsi-projects-exactly-status-and-total` encode (expected "INCLUDE",
      resolved "KEYS_ONLY"; expected {status, totalAmount}, resolved [] --
      KEYS_ONLY has no NonKeyAttributes to project at all) -- tier 0 on
      awscdk/terraconstructs, tier 1 (via
      `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`) on hcl_raw
      as of the STANDALONE-GSI SHAPE-TOLERANCE FIX (this file's header
      comment) -- either tier, this fixture is caught the same way (the
      resolved values are wrong regardless of which shape declared the
      GSI). ALL projection is the same shape for this catch's purposes
      (also plans/synths clean, also caught the same way -- ALL's
      NonKeyAttributes is likewise absent/empty) and is not given its own
      fixture, since it fails the identical two facts the identical way;
      KEYS_ONLY is used because it is the shape the blueprint names by
      name. TERRACONSTRUCTS TOLERANCE FIX (REPAIR ROUND 3, this file's
      header comment): terraconstructs no longer stays tier 0 for this
      catch -- see `include-projection-without-non-key-attributes`'s own
      description immediately above for why (the arm's own L1 escape
      hatch) -- it is graded at tier 1 too, by the same shape-tolerant
      `policy.rego`, hence `terraconstructs_override: "1"` below, now
      matching `hcl`'s "1" per specs/SCHEMA.md §3's `.hcl` collapsing
      convention.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "1"
      terraconstructs_override: "1"

  - name: gsi-missing-entirely
    taxonomy: graph-dependency
    description: >
      Declares the table with its own orderId primary key and NEVER adds
      the byCustomer index at all -- no `global_secondary_index` block, no
      standalone `aws_dynamodb_global_secondary_index` resource, no
      `addGlobalSecondaryIndex()` call. Added in the adversarial-
      verification repair round that followed the STANDALONE-GSI
      SHAPE-TOLERANCE FIX (this file's header comment, same section
      "EXISTENCE + TOTAL-PROJECTION FIX" in
      `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`): moving
      `gsi-hash-key-is-customerId`/`gsi-range-key-is-createdAt`/
      `gsi-projection-is-include`/`gsi-projects-exactly-status-and-total`
      out of hcl_raw's tier-0 `applies_to` (necessary for the
      STANDALONE-GSI fix -- see those asserts' own descriptions) left
      NOTHING in hcl_raw's toolchain rejecting a plan with no GSI
      whatsoever, since every existing tier-1 `deny` rule that grades a
      GSI fact is existentially quantified over the resolved GSI list --
      an empty list satisfies each of them vacuously. LIVE-VERIFIED at
      authoring time: `terraform plan` for a table with only its own
      hash_key and a single `attribute` block succeeds cleanly ("Plan: 1
      to add"), and pre-this-round's `policy.rego` produced zero denies
      against that plan. On awscdk this is UNAFFECTED -- it was always
      caught at tier 0 by `gsi-hash-key-is-customerId` et al. (still
      `applies_to: [awscdk]`, unchanged): zero resolved nodes against
      `op: eq` is a hard tier-0 failure by this whole toolchain's own
      convention, not something this catch's fixture newly relies on.
      Caught, for hcl_raw, by the new existence `deny` rule this repair
      round added to `policy.rego` -- see that file's own header comment
      for the full argument and the live, offline reproduction.
      TERRACONSTRUCTS TOLERANCE FIX (REPAIR ROUND 3, this file's header
      comment): terraconstructs is NO LONGER caught at tier 0 for this
      catch either, now that `gsi-hash-key-is-customerId` et al. are
      `applies_to: [awscdk]` only -- it is caught the SAME way hcl_raw is,
      by the same tier-1 existence `deny` rule (already wired to run
      against terraconstructs's own `terraform show -json` plan output),
      hence `terraconstructs_override: "1"` below, now matching `hcl`'s
      value. `solution/broken/gsi-missing-entirely/solve.sh` under the
      terraconstructs task dir has its header comment corrected to
      describe this tier-1 mechanism rather than the superseded tier-0
      one.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "1"
      terraconstructs_override: "1"

oracle:
  intent: >
    A DynamoDB table exists whose primary (hash) key is orderId. A global
    secondary index exists, keyed on customerId as its partition key and
    createdAt as its sort key, so that one customer's orders can be listed
    newest-first. The index's projection type is INCLUDE, and it projects
    exactly status and totalAmount -- nothing more, nothing less: KEYS_ONLY
    would force a second read of the whole item for data the listing
    needs on every row, and ALL would expose shippingAddress, lineItems
    and paymentReference, none of which the listing reads.

    No attribute definition, anywhere in the DynamoDB resource graph this
    table participates in, may name anything other than a key attribute of
    the table itself or of one of its indexes -- orderId, customerId and
    createdAt are the only three attributes ever used as a key across this
    scenario, so no attribute-definition declaration may name anything
    else. DynamoDB requires every declared attribute definition to be used
    by some key (the table's own key or a secondary index's key), and
    every key attribute must have a matching definition somewhere in that
    graph. shippingAddress, lineItems and paymentReference are real item
    attributes the prompt names, but DynamoDB is schemaless for non-key
    data -- they must never appear in any attribute-definition set.
    This is stated shape-invariantly on purpose: which specific resource's
    attribute-definition set carries which key attribute's definition is
    an implementation detail of how the index itself is declared (e.g. an
    index declared as a field on the table object needs its own key
    attributes defined there; an index declared as its own, separate,
    externally-managed resource carries them there instead) -- not a fact
    the ticket has any opinion about.

    Billing mode is not specified by the ticket and is not graded.

  structural_asserts:
    - name: table-hash-key-is-orderId
      description: "The table's own (non-index) primary key is orderId."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.KeySchema[?(@.KeyType=='HASH')].AttributeName"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.hash_key"
      op: eq
      expected: "orderId"

    - name: attribute-definitions-are-exactly-the-key-attributes
      description: >
        No attribute definition, anywhere in the DynamoDB resource graph
        this table participates in, names anything other than orderId,
        customerId or createdAt -- the three attributes used as a table or
        index key. The actually-enforced rego rule is an ALLOWLIST (see
        below), not a full `set_eq` -- this is the "and nothing else" fact
        that catches attribute-definitions-include-an-unrequested-key (an
        extra, unintended value would pass a subset-only op) -- NOT
        attribute-definitions-include-non-key-attributes or
        gsi-key-attribute-not-declared, both of which are caught earlier,
        by the toolchain itself failing before any structural_assert runs
        (see each catch's own description).

        `op`/`expected` below (`set_eq` / the full three-name list) reflect
        this fact's `tf_jsonpath`/`cfn_jsonpath` resolved against the
        CANONICAL reference shape only (`solution/solve.sh`'s inline
        `hash_key`/`range_key` GSI, where the table's own `attribute` set
        genuinely IS the full three-name set) -- they are what
        `generator/check_reference_paths.py` (`make check-paths`) verifies
        the declared path resolves to on that one fixture, not a claim
        that every tolerated shape produces that same set. The
        STANDALONE-GSI SHAPE-TOLERANCE FIX (this file's header comment)
        makes this assert's actual tier-1 enforcement
        (`oracles/rego/ddb-gsi-attribute-definitions/policy.rego`) an
        allowlist rather than a round-trip set-equality precisely so a
        table that legitimately declares FEWER than all three (because two
        of them live in a sibling `aws_dynamodb_global_secondary_index`
        resource's own `key_schema` instead) still passes -- see the
        SHAPE-AWARE paragraph immediately below. Treat `op`/`expected`
        here as documentation of the canonical-shape check, not an
        exhaustive spec of tier-1 behavior across every tolerated shape --
        the hand-authored `policy.rego`/`policy.guard` are the actual
        source of enforced truth for this tier-1 fact, per SCHEMA.md §4.1.

        SHAPE-AWARE as of the STANDALONE-GSI SHAPE-TOLERANCE FIX (this
        file's header comment): on the standalone-`aws_dynamodb_global_
        secondary_index`-resource hcl_raw shape, the table's OWN
        `attribute` set legitimately contains only {orderId} -- customerId
        and createdAt carry their `attribute_type` inside the standalone
        resource's own `key_schema` blocks instead, never on the table
        object (LIVE-VERIFIED directly: adding `attribute { name =
        "customerId" ... }` etc. to the table object in this shape, even
        though customerId IS a real key elsewhere, still fails
        `terraform plan` with "all attributes must be indexed. Unused
        attributes" -- the table's own attribute-usage check only ever
        looks at that SAME resource's own hash_key/range_key/inline-GSI/
        LSI keys, never a sibling resource's). This requires no rule
        change here: this Rego rule is, and always was, an ALLOWLIST
        (`not attr.name in required_attributes`), never a full
        `set_eq` -- a table that declares fewer than all three (because
        two of them live in a sibling resource instead) already passes,
        since every name it DOES declare is still a member of the
        allowlist; only a table that declares something OUTSIDE the
        allowlist is denied, which is shape-invariant. See
        `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`'s own
        header comment for the live, offline reproduction.

        Graded at TIER 1
        (Rego/cfn-guard), not tier 0's direct jsonpath check, even though
        every value read here is a static, plan-time-known echo of
        agent-supplied config (op=set_eq would be a perfectly sound tier-0
        check on that basis alone, same as every other assert in this
        file) -- this is a deliberate authoring choice, not a technical
        necessity: attribute-definitions-include-an-unrequested-key is
        REACHABLE and plans/synths CLEAN on every arm (verified directly,
        see that catch's own description), so it is the one fact in this
        scenario nothing else already catches earlier -- promoting it to
        tier 1 and hand-authoring `oracles/rego/ddb-gsi-attribute-
        definitions/policy.rego` (hcl_raw + terraconstructs) and
        `oracles/cfn-guard/ddb-gsi-attribute-definitions/policy.guard`
        (awscdk) around it gives this scenario a real, falsifiable
        tier-1 proof obligation (`gates/grading_proof.py`'s own
        `any_tier1_proof` requirement) instead of leaving every catch
        caught earlier and the Rego/cfn-guard chain permanently
        unexercised.

        This is also the ONE tier-1 structural_assert this spec declares
        by name -- but `policy.rego`'s `deny` set now additionally encodes
        FOUR more facts that are NOT their own structural_assert entries:
        the GSI's HASH key resolves to customerId, its RANGE key resolves
        to createdAt, its projection type resolves to INCLUDE, and its
        projected non-key attributes resolve to exactly {status,
        totalAmount} -- each shape-tolerant across every TF-shaped GSI
        shape on BOTH hcl_raw and terraconstructs (REPAIR ROUND 3,
        "TERRACONSTRUCTS TOLERANCE FIX", widened this from hcl_raw-only):
        the inline `global_secondary_index` block (deprecated
        `hash_key`/`range_key` OR the current `key_schema` block form --
        see this file's header comment "KEY_SCHEMA SHAPE-TOLERANCE FIX")
        and the standalone `aws_dynamodb_global_secondary_index` resource
        (see "STANDALONE-GSI SHAPE-TOLERANCE FIX" / "TERRACONSTRUCTS
        TOLERANCE FIX", same header). The first two facts are hcl_raw's
        AND terraconstructs's shared tier-1 replacement for the tier-0
        gsi-hash-key-is-customerId/gsi-range-key-is-createdAt asserts
        above (both now applies_to: [awscdk] only); the latter two are
        the shared tier-1 replacement for gsi-projection-is-include/
        gsi-projects-exactly-status-and-total (also now applies_to:
        [awscdk] only) -- all four folded into THIS assert's
        already-existing policy.rego rather than declared as four new
        tier-"1" structural_assert entries of their own, specifically to
        avoid inflating `generator/check_tier1_coverage.py`'s per-arm
        tier-1-assert count for hcl_raw/terraconstructs against an
        unchanged catch count (none of these facts has a covering
        `catches[]` entry of its own -- the catches that exercise them,
        gsi-projection-type-is-keys-only-not-include and
        include-projection-without-non-key-attributes, are already
        declared and already covered by fixtures; no NEW catch was added
        -- so a new named assert for any of the four would widen that
        shared, not-owned coverage floor with no NEW catch to cover it).
        See `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`'s own
        header comment for the live, offline reproduction proving every
        shape, on both TF-shaped arms, plans clean and every deny rule
        fires correctly.

        A FIFTH fact was added to the same `policy.rego`, in the
        adversarial-verification repair round that followed the
        STANDALONE-GSI fix (2026-08-22, same file's "EXISTENCE +
        TOTAL-PROJECTION FIX" header section): the table resolves AT LEAST
        ONE global secondary index by some shape at all (inline block or
        standalone resource) -- fires whenever `table_gsis(table)` is
        empty. Removing `gsi-hash-key-is-customerId` et al. from hcl_raw's
        tier-0 `applies_to` left NOTHING in hcl_raw's toolchain rejecting
        a table with no GSI whatsoever (the four facts above are all
        existentially quantified over the GSI list, so an empty list
        satisfies every one of them vacuously) -- this fifth fact closes
        that gap. It IS covered by its own new `catches[]` entry,
        `gsi-missing-entirely` (unlike the other four, which ride on
        existing catches) -- because it is a genuinely new failure mode
        (total absence of the index) that no prior catch's fixture
        exercises, not a shape-tolerance variant of one that already does.
        REPAIR ROUND 3 widened this fifth fact's relevance to
        terraconstructs too (the "TERRACONSTRUCTS TOLERANCE FIX", same
        header) -- once `gsi-hash-key-is-customerId` et al. are
        `applies_to: [awscdk]` only, terraconstructs relies on this SAME
        existence rule for `gsi-missing-entirely`, exactly as hcl_raw
        does; `gsi-missing-entirely`'s own `catches[]` entry was updated
        accordingly (`terraconstructs_override` now "1", matching `hcl`).

        A SIXTH fact-independent fix, `standalone_gsi_matches_table` (also
        REPAIR ROUND 3, "TABLE-ASSOCIATION FIX" in policy.rego's own
        header comment): the fifth fact's own `table_gsis(table)` fallback
        for the standalone-resource shape originally matched ANY
        `aws_dynamodb_global_secondary_index` resource in the whole plan
        to EVERY table, with no check on that resource's own `table_name`
        -- an ORPHAN standalone GSI resource (naming some unrelated table)
        made the fifth fact's own existence check pass vacuously for a
        table with no real index of its own. Fixed by associating a
        standalone GSI with a table only when its `table_name` resolves to
        that table's own `.values.name`, or is genuinely absent/null (the
        `.id`-reference construction the original, now-narrowed match was
        written to tolerate). See policy.rego's own header comment for the
        full argument and live, offline reproduction;
        `solution/broken/gsi-missing-entirely/solve.sh` (hcl_raw task dir)
        now additionally carries an orphan standalone GSI resource to
        exercise this fix end to end.
      tier: "1"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.AttributeDefinitions[*].AttributeName"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.attribute[*].name"
      op: set_eq
      expected: ["orderId", "customerId", "createdAt"]

    - name: gsi-hash-key-is-customerId
      description: >
        The global secondary index's partition (hash) key is customerId.
        Tier 0 on awscdk ONLY: hcl_raw was deliberately EXCLUDED first (see
        this file's header comment "KEY_SCHEMA SHAPE-TOLERANCE FIX")
        because `aws_dynamodb_table`'s `global_secondary_index` block
        exposes its HASH key two ways -- the deprecated `hash_key` string
        argument (what this jsonpath reads) and the current,
        non-deprecated `key_schema` block form -- and this narrow jsonpath
        grammar cannot express "read whichever one the HCL actually used"
        as one path. terraconstructs was ALSO later excluded (REPAIR ROUND
        3, "TERRACONSTRUCTS TOLERANCE FIX" in this file's header comment):
        its own workspace can produce the SAME standalone
        `aws_dynamodb_global_secondary_index` resource hcl_raw can, via
        `@cdktn/provider-aws`'s L1 binding, which this jsonpath (scoped to
        the inline block) cannot see either. Both hcl_raw and
        terraconstructs are graded on this fact at tier 1 instead, by
        `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`
        (shape-tolerant, sees every GSI shape on both arms -- inline hash_key/range_key, inline key_schema, and the standalone aws_dynamodb_global_secondary_index resource) -- see that file's own header
        comment for the full argument and the live, offline reproduction.
      tier: "0"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.GlobalSecondaryIndexes[*].KeySchema[?(@.KeyType=='HASH')].AttributeName"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.global_secondary_index[*].hash_key"
      op: eq
      expected: "customerId"

    - name: gsi-range-key-is-createdAt
      description: >
        The global secondary index's sort (range) key is createdAt, which
        is what makes a newest-first listing possible. Tier 0 on awscdk
        ONLY, for the SAME reasons and via the SAME tier-1 fallback as
        gsi-hash-key-is-customerId immediately above (see that entry's
        description and this file's header comment "KEY_SCHEMA
        SHAPE-TOLERANCE FIX" / "TERRACONSTRUCTS TOLERANCE FIX") --
        `range_key` has the identical deprecated-vs-`key_schema` two-shape
        problem `hash_key` does, on both hcl_raw and terraconstructs.
      tier: "0"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.GlobalSecondaryIndexes[*].KeySchema[?(@.KeyType=='RANGE')].AttributeName"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.global_secondary_index[*].range_key"
      op: eq
      expected: "createdAt"

    - name: gsi-projection-is-include
      description: >
        The index's projection type is INCLUDE -- never the implied
        default ALL, and never KEYS_ONLY (either of which would violate
        "nothing else should be read from the index").
        Tier 0 on awscdk ONLY: hcl_raw was deliberately EXCLUDED first (see
        this file's header comment "STANDALONE-GSI SHAPE-TOLERANCE FIX")
        because a GSI can be declared as an inline `global_secondary_index`
        block on `aws_dynamodb_table` (this jsonpath's shape) OR as a
        standalone `aws_dynamodb_global_secondary_index` resource, whose
        projection type lives at `.values.projection[0].projection_type`
        instead -- a completely different resource `type`/path this narrow
        jsonpath grammar cannot express as one filter. terraconstructs was
        ALSO later excluded (REPAIR ROUND 3, "TERRACONSTRUCTS TOLERANCE
        FIX" in this file's header comment): its own workspace can produce
        the identical standalone resource via `@cdktn/provider-aws`'s L1
        binding. Both hcl_raw and terraconstructs are graded on this fact
        at tier 1 instead, by
        `oracles/rego/ddb-gsi-attribute-definitions/policy.rego`
        (shape-tolerant, sees every GSI shape on both arms -- inline hash_key/range_key, inline key_schema, and the standalone aws_dynamodb_global_secondary_index resource) -- see that file's own header
        comment for the full argument and the live, offline reproduction.
      tier: "0"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.GlobalSecondaryIndexes[*].Projection.ProjectionType"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.global_secondary_index[*].projection_type"
      op: eq
      expected: "INCLUDE"

    - name: gsi-projects-exactly-status-and-total
      description: >
        The index's projected non-key attributes are EXACTLY {status,
        totalAmount} -- nothing more (this is what catches
        include-projection-without-non-key-attributes on hcl_raw: an
        empty resolved set fails set_eq against a non-empty expected set)
        and nothing less.
        Tier 0 on awscdk ONLY, for the SAME reasons and via the SAME
        tier-1 fallback as gsi-projection-is-include immediately above
        (see that entry's description and this file's header comment
        "STANDALONE-GSI SHAPE-TOLERANCE FIX" / "TERRACONSTRUCTS TOLERANCE
        FIX") -- a standalone `aws_dynamodb_global_secondary_index`
        resource's non_key_attributes lives at
        `.values.projection[0].non_key_attributes`, not under
        `aws_dynamodb_table.values.global_secondary_index[*]` at all, on
        either hcl_raw or terraconstructs.
      tier: "0"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::DynamoDB::Table' || @.Type=='AWS::DynamoDB::GlobalTable')].Properties.GlobalSecondaryIndexes[*].Projection.NonKeyAttributes"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_dynamodb_table')].values.global_secondary_index[*].non_key_attributes"
      op: set_eq
      expected: ["status", "totalAmount"]

  rego_hints:
    - >-
      package cdktn_bench.ddb_gsi_attribute_definitions, graded against
      `terraform show -json` PLAN output for BOTH TF-shaped arms (hcl_raw
      and terraconstructs -- identical plan JSON shape, no per-arm
      override needed, since `aws_dynamodb_table.values.attribute[*].name`
      is a static echo of agent-supplied config on both, never
      plan-time-unknown -- SCHEMA.md §4.2.1 does not apply here). `input`
      at policy-evaluation time is that plan JSON document. Encodes the
      tier-1 structural_assert `attribute-definitions-are-exactly-the-
      key-attributes`: `deny` whenever some `aws_dynamodb_table`
      resource's `values.attribute[*].name` is anything other than
      orderId/customerId/createdAt. This is a genuine ALLOWLIST check
      (every declared attribute must be one of the three), not a full
      round-trip set-equality -- the converse half ("every one of the
      three must actually be declared") is already unreachable to violate
      on a plan that reaches this policy at all: on awscdk/terraconstructs,
      `table-hash-key-is-orderId`/`gsi-hash-key-is-customerId`/
      `gsi-range-key-is-createdAt` (all tier 0 on those two arms, already
      executed before Rego ever runs) each require their own key attribute
      to resolve to a real value; on EVERY arm including hcl_raw,
      DynamoDB's own provider-side validation (this scenario's header
      comment, probe (b)) independently rejects any plan where a key
      references an undeclared attribute before `terraform show -json`
      ever produces output at all -- so a plan that reaches this policy
      already has all three required names present regardless of which of
      those two mechanisms is doing the work for a given arm; only "and
      nothing else" remains to check.
    - >-
      No graph-edge/plan-time-unknown concern applies to this rule at
      all (contrast SCHEMA.md §4.2.1's IAM-policy worked example): an
      attribute's `name` inside a `dynamic "attribute"`/literal `attribute
      { name = ... }` block is never provider-computed, so
      `.planned_values...values.attribute[*].name` is always resolved,
      for every fixture this scenario's catches produce.
    - >-
      Two further `deny` rules, `resolved_hash_key`/`resolved_range_key`
      (added in the "KEY_SCHEMA SHAPE-TOLERANCE FIX" round, widened from
      hcl_raw-only to also cover terraconstructs in the REPAIR ROUND 3
      "TERRACONSTRUCTS TOLERANCE FIX" -- see this spec's own header
      comment and policy.rego's own header comment for the full argument
      and the live, offline reproduction): hcl_raw's AND terraconstructs's
      shared replacement for the tier-0 gsi-hash-key-is-customerId/
      gsi-range-key-is-createdAt asserts, which apply to awscdk only as of
      these fixes. `aws_dynamodb_table`'s
      `global_secondary_index` block exposes its HASH/RANGE key two ways
      -- the deprecated `hash_key`/`range_key` string arguments, or the
      current, non-deprecated `key_schema` block form -- and this
      scenario's narrow `tf_jsonpath` grammar cannot express "whichever
      one the HCL actually used" as a single path, so the fact is graded
      here instead: `deny` whenever a GSI's resolved HASH key isn't
      customerId, or its resolved RANGE key isn't createdAt, reading
      `hash_key`/`range_key` when non-empty and falling back to the
      matching `key_schema` entry otherwise. `hash_key` is genuinely
      plan-time-UNKNOWN when a GSI is written in `key_schema` form
      (confirmed directly: `terraform plan`'s diff shows `hash_key =
      (known after apply)` there) -- SCHEMA.md §4.2.1's caveat does not
      bite even so, because `planned_values` (what this policy reads)
      omits unknown values entirely rather than exposing a placeholder,
      and the rule observes that omission as an undefined field reference
      and falls through to the always-plan-time-known `key_schema` block,
      never touching the unknown value itself.
  cfn_guard_hints:
    - >-
      Graded against the awscdk arm's synthesized CloudFormation template
      (`cdk.out/ScenarioStack.template.json`). Encodes the SAME tier-1
      fact as `../rego/ddb-gsi-attribute-definitions/policy.rego`, at the
      same strictness: every `AWS::DynamoDB::Table` (and, for the
      TableV2-tolerance fix this file's header comment documents, every
      `AWS::DynamoDB::GlobalTable`) resource's
      `Properties.AttributeDefinitions[*].AttributeName` must be IN
      [orderId, customerId, createdAt] -- cfn-guard's `IN` operator over a
      literal allowlist, the same idiom
      `../toy-ssm-parameter/policy.guard`'s `Action[*] IN [...]` rules
      already use in this repo, applied here to `AttributeName` instead of
      `Action`. CFN's synthesized template is always fully static (no
      "plan" concept, no provider-computed value ever appears in
      `AttributeDefinitions`), so this is a literal-value check with no
      SCHEMA.md §4.2.1 caveat to carry, unlike some other scenarios'
      tier-1 awscdk rules.
  tier05_jsonata: null


# EXISTENCE + TOTAL-PROJECTION FIX (adversarial verification, REPAIR ROUND
# 2, 2026-08-22): the STANDALONE-GSI fix above, verified in isolation,
# turned out to have widened hcl_raw's tolerance too far -- removing four
# tier-0 asserts from hcl_raw's `applies_to` left NOTHING rejecting a plan
# with NO GSI at all (every remaining tier-1 `deny` rule is existentially
# quantified over the GSI list, so an empty list satisfies all of them),
# and a second, narrower gap let a standalone GSI resource with a missing
# `projection` block silently drop out of grading entirely rather than
# being graded and correctly rejected. Both are pure oracle-completeness
# bugs in the fix itself, not new toolchain findings -- fixed in
# `oracles/rego/ddb-gsi-attribute-definitions/policy.rego` (own header
# comment, same section name, has the full argument and live, offline
# reproduction of both) plus a new `catches[]` entry, `gsi-missing-
# entirely`, covering the first gap (the second has no dedicated catch --
# see `attribute-definitions-are-exactly-the-key-attributes`'s own
# description for why). `oracle.intent` below was also reworded (not
# re-derived) to state the attribute-definition fact shape-invariantly --
# its prior wording ("customerId/createdAt must never be missing from
# [the table's own attribute-definition set]") was already-false for the
# STANDALONE-GSI shape the prior round's fix tolerates, a spec-honesty gap
# independent of the two grading regressions above (SCHEMA.md §4.1: this
# field is the single source of truth both policy.rego and policy.guard
# are checked against, so it must state what the fully-tolerant oracle
# actually requires, not a stricter fiction).

# `[?(@.F=='V')]`, OR only WITHIN one filter's equality conditions, `[*]`)
# cannot express "read `.hash_key` OR, when that's absent, read
# `.key_schema[?(@.key_type=='HASH')].attribute_name`" as a single
# JSONPath string, and this scenario's authoring agent does not own
# `generator/*.py` to widen it (other scenarios are being authored in the
# same tree concurrently -- touching shared generator code is out of
# scope for a single-scenario fix regardless). So, following this
# scenario's OWN precedent immediately below
# (`attribute-definitions-are-exactly-the-key-attributes`'s own tier-1
# promotion, whose description explains exactly this move): `hcl_raw` was
# removed from `applies_to` on both tier-0 asserts (unchanged, still tier
# 0, for `awscdk`/`terraconstructs`), and the fact is graded for hcl_raw
# by two new `deny` rules folded into the ALREADY-EXISTING
# `oracles/rego/ddb-gsi-attribute-definitions/policy.rego` -- NOT as two
# new named tier-"1" `structural_assert` entries, because neither fact has
# a covering `catches[]` entry of its own (no catch in this scenario

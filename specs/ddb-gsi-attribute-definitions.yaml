# KEY_SCHEMA SHAPE-TOLERANCE FIX (hcl_raw arm, found by a verifier, fixed
# this session, 2026-08-21): `aws_dynamodb_table`'s `global_secondary_index`
# argument reference exposes its HASH/RANGE key TWO ways -- LIVE-READ this
# session, again, from the SAME `hashicorp/terraform-provider-aws` file
# this spec already cites as primary evidence (`website/docs/r/
# dynamodb_table.html.markdown`, `main` branch): `hash_key` -- "(Optional,
# **Deprecated**) ... Mutually exclusive with `key_schema`. Use
# `key_schema` instead."; `range_key` -- the identical wording; `key_schema`
# -- "(Optional) Configuration block(s) for the key schema...", the
# NON-deprecated, provider-preferred form. This scenario's
# `gsi-hash-key-is-customerId`/`gsi-range-key-is-createdAt` structural_asserts
# originally read ONLY `global_secondary_index[*].hash_key`/`.range_key` on
# every arm, so a semantically-identical, non-deprecated `key_schema`-shaped
# hcl_raw solution scored 0.0 -- exactly the `apigw-openapi` "each route is
# its own resource and method" failure mode `docs/adding-scenarios.md` §1
# item 3a exists to prevent, here on the oracle side (a jsonpath too
# narrow), not the prompt side, and specific to hcl_raw: terraconstructs's
# `storage.Table` renders ONLY the deprecated `hashKey`/`rangeKey` shape
# internally (`node_modules/terraconstructs/lib/aws/storage/table.js:
# 787-788`, confirmed no confound there), and CFN's `KeySchema` has no
# analogous alternate shape at all, so awscdk was never affected either.
#
# REPRODUCED directly this session, fully offline (`terraform init` +
# `validate` + `plan` against the filesystem-cached hashicorp/aws 6.58.0
# provider, dummy credentials, the same offline mechanism this file's own
# earlier header probes (a)-(c) already used): a `key_schema`-shaped GSI
# (two `key_schema { attribute_name, key_type }` blocks,
# HASH=customerId/RANGE=createdAt) plans CLEAN with zero warnings, and
# `terraform show -json`'s `planned_values` for that GSI is
# `{key_schema:[{customerId,HASH},{createdAt,RANGE}], name,
# non_key_attributes, projection_type:"INCLUDE", range_key:""}` -- NO
# `hash_key` key at all (that field is genuinely plan-time-UNKNOWN in this
# shape; `terraform plan`'s own diff shows `hash_key = (known after
# apply)`, so `planned_values`, which only ever carries plan-time-KNOWN
# values, omits it). Running the reference `tests/static_tiers.sh` against
# it, before this fix: `gsi-hash-key-is-customerId` FAIL (resolved=[]),
# `gsi-range-key-is-createdAt` FAIL (resolved=[""]) -- tier0_pass=0,
# reward 0.0, on an otherwise-correct solution.
#

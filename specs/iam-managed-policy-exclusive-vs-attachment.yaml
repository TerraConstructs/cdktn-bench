# ---------------------------------------------------------------------
# ORACLE MUST TOLERATE / DEFEND (blueprint §2(b), operator-facing --
# behavioralized where the schema allows it; REVERSED for shape (2) in
# REPAIR PASS 4, 2026-08-22 -- see this file's header comment, defect 8,
# for the full evidence and why blueprint §2(b)'s pre-approval of shape
# (2) does not survive contact with the blueprint's OWN prompt sentence):
# ---------------------------------------------------------------------
# Three TF-shaped resource choices satisfy this ticket's FUNCTIONAL intent
# (both roles trust the right service, both get the S3-readonly and
# team-metrics policies) -- but functional intent is not this ticket's
# WHOLE intent. The prompt's closing sentence ("Other teams attach their
# own policies to these roles out of band; that must keep working.") is a
# SURVIVAL requirement, independent of and additional to the attachment
# facts above, and it is the one this scenario actually measures:
#   (1) aws_iam_role_policy_attachment  -- additive; never removes an
#       attachment it did not itself create, on this role or any other.
#       GRADED 1.0.
#   (2) aws_iam_role_policy_attachments_exclusive -- role-scoped exclusive,
#       declared as such by its own name. Blueprint §2(b) calls this "also
#       acceptable, and arguably the most deliberate answer" -- REJECTED
#       here despite that text, because "role-scoped" does not mean
#       "safe": this resource takes exclusive ownership of THAT ROLE's
#       entire managed-policy set and REMOVES, on every subsequent apply,
#       any policy attached to it that is not listed in its own
#       `policy_arns` -- verified verbatim against the provider's own
#       docs, website/docs/r/iam_role_policy_attachments_exclusive.
#       html.markdown: "This resource takes exclusive ownership over
#       managed IAM policies attached to a role. This includes removal of
#       managed IAM policies which are not explicitly configured." An
#       out-of-band policy some OTHER team attaches to `batch-runner` or
#       `report-writer` is exactly the kind of "managed IAM policy which
#       is not explicitly configured" this resource removes -- narrower in
#       blast radius than shape (3) below (one role instead of every
#       principal account-wide that references the policy), but identical
#       in KIND: an authoritative resource silently detaching something
#       the ticket's own prompt says must survive. GRADED 0.0 (the
#       role-scoped-exclusive-attachment catch).
#   (3) aws_iam_policy_attachment -- account-wide exclusive. REJECTED (the
#       account-exclusive-policy-attachment catch).
# The deprecated aws_iam_role.managed_policy_arns is also REJECTED
# (deprecated-exclusive-role-attribute) -- role-scoped exclusive too, same
# reasoning as (2), and additionally a deprecated argument.
#
# WHY BLUEPRINT §2(b)'S PRE-APPROVAL OF SHAPE (2) DOES NOT STAND: the
# blueprint's own prompt text (§2(b), reproduced verbatim in this spec's
# `instruction.shared_body`) is "Other teams attach their own policies to
# these roles out of band; that must keep working" -- unqualified by
# anything like "except via a role-scoped-exclusive resource". §2(b)'s
# shape-list clause then calls shape (2) acceptable without checking it
# against that sentence; the two clauses of the SAME blueprint section
# contradict each other, and citing one does not resolve a contradiction
# with the other in its own favor. REPAIR PASS 2 (defect 4, above)
# resolved the contradiction toward "accept" by reading only the
# shape-list clause; this pass resolves it toward "reject" by reading the
# prompt-sentence clause as controlling, because it is the ticket's own
# stated requirement -- what this scenario is FOR -- rather than a
# shape-list annotation, which (re-read carefully) is really a note about
# what TIER-0's flat grammar can or cannot express, not an independent
# behavioural judgement. See this file's header comment, REPAIR PASS 4,
# defect 8, for the full before/after.
#
# HOW SHAPE (2) IS REJECTED: a new tier-0 assert,
# `no-role-scoped-exclusive-attachment` (symmetric with the pre-existing
# `no-account-exclusive-policy-attachment` -- both are a bare
# resource-type-absence check, well within tier-0's flat grammar; the
# grammar limitation that forced the S3-identity fact off tier-0 in REPAIR
# PASS 2 -- specs/SCHEMA.md §4.2's jsonpath grammar has no type-
# conditional field selector -- does not apply here, since a bare
# "does this resource type exist at all" check needs no field-name
# branching), plus an explicit, accurately-worded tier-1 Rego deny rule
# (oracles/rego/.../policy.rego's own header comment has the full
# before/after) for defense in depth -- the SAME two-tier redundancy
# shape (3) already gets, not a weaker one. Tier-1's PRIOR "acceptance"
# code path (unioning `aws_iam_role_policy_attachments_exclusive` into the
# covering sets) is REMOVED, not merely bypassed, so shape (2) cannot
# score 1.0 through either oracle by any path. Adding the new tier-0
# assert does not disturb `make tier1-coverage`'s numeric floor (it is a
# tier-0 entry, not tier-1) -- confirmed by re-running `make
# tier1-coverage SPEC=specs/iam-managed-policy-exclusive-vs-attachment.yaml`
# after the change (see this repair pass's own proof log).
#
# On awscdk/terraconstructs the ticket is satisfied identically by
# `role.addManagedPolicy(policy)` on both roles for both policies -- shape
# (2)/(3)'s distinction does not exist as a typed-arm authoring choice at
# all (SCHEMA.md §3's applies_to: those two catches are N/A, not MISSING,
# on both typed arms -- see applies_to below and the immunity evidence
# above).
#
# AWSCDK'S OWN SECOND AUTHORING CHOICE (fixed in REPAIR PASS 3 -- see this
# file's own header comment, defect 6): the team-defined policy's
# roles can be declared on EITHER side of aws-cdk-lib's IAM API --
# `role.addManagedPolicy(policy)` per role (the reference solve.sh's own
# shape), or `new iam.ManagedPolicy(this, "TeamMetricsPolicy", { roles:
# [batchRunner, reportWriter], ... })` (`ManagedPolicyProps.roles`) in one
# call. Both are ordinary, idiomatic, equally-documented aws-cdk-lib API
# and both are GRADED 1.0, as is ANY MIXTURE of the two (one role named
# from each side). Since REPAIR PASS 10 that is true BY CONSTRUCTION
# rather than by a rule-level disjunction or a balanced count:
# oracles/rego-cfn/.../policy.rego's `metrics_covered_role_ids` unions the
# role-side and policy-side edges, both resolved by LOGICAL ID, before any
# cardinality is looked at. See solution/reference-alt-cdk-roles/solve.sh
# for the policy-side shape's reference proof and
# solution/reference-alt-cdk-mixed-attachment/solve.sh for the mixed
# shape's. No TF-arm analog of this specific two-sided-API choice
# exists (`aws_iam_role_policy_attachment` only ever lists one role; there
# is no "list several roles in one attachment block" HCL resource), so
# this is an awscdk-only authoring-shape fact, unrelated to shapes (1)-(3)
# above.
#
# REMAINING, HONEST SCOPE-NARROWING (recorded, not fixed, in this pass --
# a documented limitation per docs/adding-scenarios.md §1 item 3a's
# preference for an honest gap over forcing one implementation shape via
# prompt prose): a single SHARED INLINE policy --
# `new iam.Policy(this, "TeamMetricsPolicy", { roles: [batchRunner,
# reportWriter], statements: [...] })` on awscdk (synthesizes a standalone
# `AWS::IAM::Policy`, not `AWS::IAM::ManagedPolicy`), or
# `aws_iam_role_policy` duplicated per role on the TF arms -- is NOT
# accepted by either oracle. Nothing in this ticket requires the
# team-defined policy to be CUSTOMER-MANAGED rather than inline; "both
# need the same team-defined policy allowing them to write metrics to
# CloudWatch" is satisfied by this shape too, and it does not disturb
# out-of-band attachments any more than the graded shape does.
# DEMONSTRATED (2026-08-21, and again 2026-08-23 under the ported
# engine): an awscdk stack granting the metrics permission without a real
# `AWS::IAM::ManagedPolicy` resource is REJECTED, reward 0.0 -- in 2026-08-21
# via cfn-guard's `customer_policy_exists_when_roles_present`, and since
# REPAIR PASS 10 via the same fail-closed rule ported into
# oracles/rego-cfn/.../policy.rego. As of REPAIR PASS 10 that limitation
# is no longer only demonstrated by hand: it ships as
# `solution/broken/no-team-metrics-policy/` on the awscdk arm (the
# `role.addToPolicy(...)` inline spelling), which is both the covering
# negative for that rule and this gap's executable proof. Left unfixed this pass
# because closing it properly means either (i) widening BOTH oracles to
# treat an inline-policy-referencing-both-roles as a second covering shape
# (a real, larger Rego/cfn-guard change, symmetric with shape (2)'s fix
# above but for a resource FAMILY tier-0 cannot even name uniformly across
# arms -- `AWS::IAM::Policy` has no TF-arm analog shaped the same way,
# since `aws_iam_role_policy` is per-role with no `roles` list, so "shared"
# means something structurally different on each arm), or (ii) adding an
# in-world sentence to the prompt that forces "a policy other teams can
# also attach" (i.e. customer-managed) -- both are real authoring work
# this pass's scope (fixing the FIVE identified defects) does not extend
# to. Tracked here as a known gap for a follow-on revision, exactly the
# way shape (2) used to be tracked before this same pass closed it.
#
# ---------------------------------------------------------------------
# RISK NOTE carried over verbatim from the blueprint (§2(f)): the prompt's
# closing sentence ("Other teams attach their own policies to these roles
# out of band; that must keep working.") is the ONE in-world motivating
# sentence docs/adding-scenarios.md §1 item 3a allows. It is a fact about
# the environment, not a mechanism constraint and not a description of the
# fix -- without it the additive-vs-exclusive distinction is unobservable
# in a GREENFIELD plan (nothing else is attached yet) and this scenario
# would measure nothing; with it, every arm's task is identical. If future
# review judges this sentence a hint, the documented alternative is to move
# this scenario to the brownfield queue (a seed already carrying an
# out-of-band attachment) -- a different form, a different metric stratum,
# and no longer this spec.

id: iam-managed-policy-exclusive-vs-attachment
workspace_id: batch-service-roles
title: "Two service roles that share the same managed policies"
difficulty: 2
services: [iam]

arms:
  awscdk: true
  hcl_raw: true
  terraconstructs:
    enabled: true
    reason: >
      arms/terraconstructs/README.md §4 lists `iam` ("Roles, users, groups,
      managed/inline policies, policy statements, grants, principals,
      OIDC/SAML providers, instance profiles") as a covered service.
      RE-VERIFIED DIRECTLY against the pinned 0.2.13 package at authoring
      time (2026-08-20, not assumed): `lib/aws/iam/role.js` exports a real
      `Role` L2 construct with `assumedBy`/`roleName`/`addManagedPolicy()`
      matching aws-cdk-lib's own API; `lib/aws/iam/managed-policy.js`
      exports `ManagedPolicy` with `fromAwsManagedPolicyName(scope, id,
      managedPolicyName)` (a 3-arg static, unlike aws-cdk-lib's newer
      1-arg form -- confirmed against the installed .js, not just its
      possibly-stale .d.ts doc comment) and `attachToRole()`/`addStatements()`.
      Both constructs are the ones this scenario's reference solution uses.
      Separately (not part of this enable/reason but recorded since it was
      verified at the same time): this arm's own `managedPolicyArns` is
      commented out of the synthesized `IamRole` resource
      (`lib/aws/iam/role.js:212-215`, citing the provider's own
      exclusive-relationship-management-resources design decision) and
      `ManagedPolicy.attachToRole()` always emits the additive
      `IamRolePolicyAttachment` resource
      (`lib/aws/iam/managed-policy.js:43`) -- this arm is immune to this
      scenario's first two catches BY CONSTRUCTION, not merely by not
      having tried yet. See catches[].applies_to below.

instruction:
  shared_body: |
    Our batch platform needs two IAM roles:

    - `batch-runner`, assumed by ECS tasks, and
    - `report-writer`, assumed by Lambda.

    Both roles need read access to our reporting data in S3 (the AWS managed
    policy AmazonS3ReadOnlyAccess), and both need the same team-defined policy
    allowing them to write metrics to CloudWatch. Other teams attach their own
    policies to these roles out of band; that must keep working.
  placeholders: []
  per_arm:
    awscdk:
      language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdk.out/ScenarioStack.template.json
        build_command: "npm run build"
        synth_command: "npx cdk synth --no-lookups --quiet -o cdk.out"
        json_fields: []
    hcl_raw:
      language_line: "Author this as hand-written Terraform HCL (no modules)."
      output_contract:
        entry_file: main.tf
        artifact_path: plan.json
        plan_command: >-
          terraform init && terraform validate && terraform plan -out=plan.tfplan
          && terraform show -json plan.tfplan > plan.json
        json_fields: []
    terraconstructs:
      language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdktf.out/stacks/batch-service-roles/plan.json
        synth_command: "npx cdktn synth"
        json_fields: []

catches:
  - name: account-exclusive-policy-attachment
    taxonomy: graph-dependency
    description: >
      Uses ONE `aws_iam_policy_attachment` resource (the account-wide
      exclusive form) with `roles = [batch_runner, report_writer]` for the
      team-defined CloudWatch-metrics policy, instead of two
      `aws_iam_role_policy_attachment` resources. This is the PLAUSIBLE-
      WRONG solution: it plans clean, applies clean, and satisfies every
      functional assert this scenario declares (both roles trust the right
      service, both get the team policy, S3-readonly is attached) -- the
      damage is invisible to a synth/plan-only oracle by the mechanism
      itself: `aws_iam_policy_attachment` becomes the CANONICAL, exclusive
      owner of every principal attached to that specific policy ARN
      account-wide, silently detaching the team-metrics policy from any
      OTHER role/user/group that references it now or attaches to it later
      via any other mechanism (the "other teams attach their own policies
      out of band" sentence in the prompt is what makes this consequence
      real rather than moot in a greenfield plan). Predicted to be the most
      likely real mistake: `aws_iam_policy_attachment` is the resource
      whose NAME most closely resembles "attach a policy to these roles" --
      a name-similarity failure, not a knowledge failure (blueprint §2(e)'s
      own secondary prediction). Structurally unreachable on awscdk (CFN
      has one attachment surface, ManagedPolicyArns on the role -- no
      separate attachment resource type exists to reach for) and on
      terraconstructs (its L2 IAM surface only ever emits
      IamRolePolicyAttachment or the commented-out-by-design
      managedPolicyArns path -- see this spec's header comment's
      "terraconstructs immunity" evidence) through ordinary use.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: deprecated-exclusive-role-attribute
    taxonomy: nested-attribute
    description: >
      Sets `managed_policy_arns` directly on one or both `aws_iam_role`
      resources (the deprecated, role-scoped-exclusive attribute) AND
      separately adds an `aws_iam_role_policy_attachment` for one of the
      same policies on the same role -- the detach/reattach churn shape
      the provider's own docs warn about verbatim ("this resource will
      take over exclusive management of the role's respective policy
      types... incompatible with... aws_iam_role_policy_attachment... you
      will get resource cycling and/or errors", website/docs/r/
      iam_role.html.markdown). The fixture (`solution/broken/
      deprecated-exclusive-role-attribute/`) sets `managed_policy_arns =
      []` specifically (REPAIR PASS 2, replacing a non-empty-list form) --
      the EMPTIENT-set variant, per the same provider docs page's own
      example ("If someone attaches a policy out-of-band, on the next
      apply, Terraform will detach that policy... configuring an empty
      set... will cause Terraform to remove ALL managed policy
      attachments"), is the single most destructive shape of this
      mistake, and is also the one the FIRST-pass `no-deprecated-role-
      managed-policy-arns` assert failed to catch at all (see that
      assert's own note) -- this fixture now exercises exactly the
      variant that bug required. Structurally unreachable on awscdk/
      terraconstructs: aws-cdk-lib's Role construct has no
      `managedPolicyArns`-as-a-settable-prop escape hatch that isn't
      itself `addManagedPolicy()` (which never renders this literal
      attribute name), and terraconstructs' own `lib/aws/iam/role.js`
      comments the equivalent Terraform argument OUT of what it ever
      synthesizes (see this spec's header comment) -- through ordinary
      use, an agent on either typed arm cannot reach for the mistake even
      by trying the "obvious" L2 API path.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: role-scoped-exclusive-attachment
    taxonomy: graph-dependency
    description: >
      Uses `aws_iam_role_policy_attachments_exclusive` (the purpose-built,
      role-scoped-exclusive resource, correctly named and self-describing
      as exclusive -- unlike deprecated-exclusive-role-attribute's mistake,
      this is not a deprecation trap) for one or both roles' managed-policy
      set, instead of individual `aws_iam_role_policy_attachment` resources.
      ADDED IN REPAIR PASS 4 (2026-08-22; this spec's own header comment,
      defect 8): a prior pass's oracle accepted this shape, reading
      blueprint §2(b)'s shape-list annotation ("also acceptable") without
      checking it against the SAME blueprint section's own prompt
      sentence, reproduced verbatim in this scenario's own
      `instruction.shared_body`: "Other teams attach their own policies to
      these roles out of band; that must keep working."
      `aws_iam_role_policy_attachments_exclusive` takes exclusive
      ownership of THE ROLE's entire managed-policy set and REMOVES, on
      the next apply, any attachment not listed in its own `policy_arns`
      -- verified verbatim against the provider's own docs,
      website/docs/r/iam_role_policy_attachments_exclusive.html.markdown:
      "This resource takes exclusive ownership over managed IAM policies
      attached to a role. This includes removal of managed IAM policies
      which are not explicitly configured." An out-of-band policy some
      other team attaches to either role is exactly what this resource
      would remove on the next apply -- narrower in blast radius than
      account-exclusive-policy-attachment (one role, not every principal
      account-wide referencing the policy) but identical in KIND: like
      that catch, it plans clean, applies clean, and satisfies every
      *functional* assert this scenario declares -- the damage is
      invisible to a synth/plan-only oracle by the mechanism itself.
      Structurally unreachable on awscdk (CFN's single ManagedPolicyArns
      surface is inherently additive; no exclusive attachment surface
      exists at all) and on terraconstructs (its L2 IAM surface has no
      path to this resource type either -- confirmed by direct read of
      the pinned 0.2.13 package's `lib/aws/iam/**` tree, 2026-08-22, see
      this spec's own header comment's terraconstructs-immunity note)
      through ordinary use.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: policy-attached-to-one-role-only
    taxonomy: graph-dependency
    description: >
      The team-defined CloudWatch-metrics policy is attached to only ONE
      of the two roles (`batch-runner`, say) -- the other role never
      receives it. Every tier-0 assert this scenario declares passes
      identically to a correct solution (both roles exist with the right
      trust principals; no forbidden exclusive-attachment resource/attribute
      is used; the S3-readonly policy's own attachment is unaffected by
      this catch) -- this is a real cross-resource wiring omission, not a
      typed-value or enum mistake, and needs a graph-shaped check that
      accounts for BOTH roles independently, which tier-0's flat
      JSONPath+op grammar cannot express (see the customer-metrics-
      policy-attached-to-both-roles-* asserts' own notes for exactly why:
      `contains`/`exists` pass on ANY ONE matching node, `set_eq` collapses
      duplicates -- none of tier-0's ops can distinguish "attached once"
      from "attached to both"). Reachable, and equally easy to make by
      accident, on every arm: an awscdk/terraconstructs solution that
      simply forgets the second `role.addManagedPolicy(metricsPolicy)`
      call is just as functionally-broken as an hcl_raw solution missing
      the second `aws_iam_role_policy_attachment` resource -- there is no
      typed-arm advantage for THIS catch, unlike the first two.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null
    applies_to: [awscdk, hcl_raw, terraconstructs]

  - name: s3-readonly-missing-on-one-role
    taxonomy: graph-dependency
    description: >
      The AWS managed policy AmazonS3ReadOnlyAccess is attached to only
      ONE of the two roles -- the other role gets the team-defined metrics
      policy but no S3 read access at all. The sibling of
      policy-attached-to-one-role-only, on the OTHER of the two policies
      the ticket names, and an equally plain omission of a stated
      requirement: the prompt's second paragraph opens "Both roles need
      read access to our reporting data in S3 (the AWS managed policy
      AmazonS3ReadOnlyAccess)".

      ADDED IN REPAIR PASS 7 (2026-08-22; this spec's own header comment,
      defect 13). Until this pass BOTH oracles graded this fact as "at
      least one role" (the TF oracle's `count(s3_covered_role_names) ==
      0`; on awscdk, then-cfn-guard's flat `some
      %roles.Properties.ManagedPolicyArns[*]...`),
      so this mistake scored reward 1.0 on every arm -- reproduced
      directly on all three. The rule was also the only graded fact in
      this scenario with NO covering broken fixture, i.e. unfalsified by
      the shipped fixture set even after it was tightened; this catch and
      its three fixtures close both halves.

      Every tier-0 assert passes identically to a correct solution (both
      roles exist with the right trust principals, no exclusive-ownership
      resource or attribute is used anywhere), and so does the
      metrics-policy tier-1 rule -- exactly like
      policy-attached-to-one-role-only, this is a per-role coverage fact
      that tier-0's flat JSONPath+op grammar cannot express. Reachable and
      equally easy to make by accident on every arm: one missing
      `role.addManagedPolicy(s3ReadOnly)` call on the typed arms, one
      missing `aws_iam_role_policy_attachment` block on hcl_raw. No typed-
      arm advantage.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null
    applies_to: [awscdk, hcl_raw, terraconstructs]

  - name: trust-principals-not-split-across-both-roles
    taxonomy: nested-attribute
    description: >
      Two IAM roles are created and both policies are attached to both of
      them, but the two service principals the ticket pairs to the two
      roles are not split across them: the FIRST role's trust policy names
      both ecs-tasks.amazonaws.com and lambda.amazonaws.com, and the
      SECOND role's names states.amazonaws.com instead. The role the
      ticket describes as "assumed by Lambda" therefore cannot be assumed
      by Lambda at all, while the flattened union of both roles' trust
      principals still contains both service names.

      ADDED IN REPAIR PASS 9 (2026-08-23; this spec's own header comment,
      defect 17). Until this pass the two trust facts were graded ONLY by
      two tier-0 `contains` asserts over that flattened union, plus a bare
      role COUNT at tier 1 -- so this mistake scored reward 1.0 on both
      graded arm families, reproduced directly on each. It was also the
      last graded fact in this scenario with NO covering broken fixture on
      any arm.

      Every tier-0 assert passes identically to a correct solution, which
      is the whole point: `contains` has no per-element quantifier, so a
      union that holds both principals satisfies both asserts however the
      principals are distributed. Reachable and equally easy to make by
      accident on every arm -- one `CompositePrincipal` on the typed arms,
      one `Principal.Service` list on hcl_raw. No typed-arm advantage.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null
    applies_to: [awscdk, hcl_raw, terraconstructs]

oracle:
  intent: >
    Two IAM roles exist: one whose trust policy permits
    ecs-tasks.amazonaws.com to assume it, and a SECOND, DISTINCT one whose
    trust policy permits lambda.amazonaws.com to assume it. That pairing
    is graded per role, not over the flattened union of both roles'
    principals: no single role may carry both service principals, because
    a plan in which one role is assumable by both and the other by neither
    leaves the role this ticket describes as assumed by Lambda unable to
    be assumed by Lambda at all. Because other teams attach
    their own managed policies to these roles out of band, and those
    attachments must survive every future apply of this configuration,
    neither role's managed-policy attachments may be declared through ANY
    exclusive-ownership resource or attribute -- not the account-wide-
    exclusive aws_iam_policy_attachment, not the role-scoped-exclusive
    aws_iam_role.managed_policy_arns (including an explicit empty set),
    and not the purpose-built, role-scoped-exclusive
    aws_iam_role_policy_attachments_exclusive either: all three take
    ownership of a set of attachments and remove, on the next apply,
    whatever they do not themselves list, which is precisely the failure
    this scenario's one load-bearing prompt sentence forbids. Every
    managed-policy attachment in this configuration is additive instead --
    aws_iam_role_policy_attachment on the TF-shaped arms, or
    CloudFormation's ManagedPolicyArns list (the only surface
    CloudFormation has, and inherently additive: CFN never removes an
    attachment it did not itself add). The AWS managed policy
    AmazonS3ReadOnlyAccess, specifically (not merely "some" AWS-managed
    policy), is attached to BOTH roles -- as either a
    partition-templated Fn::Join/Ref construction or a bare literal ARN
    string on awscdk (both are legitimate, equally-idiomatic renders of
    the same import; neither is preferred), or as a plan-time-known
    literal ARN on the TF-shaped arms. A single team-defined managed
    policy, created in this configuration and granting a CloudWatch
    metrics-write action, is attached to BOTH roles as well. Either
    policy reaching only one of the two roles, or covering a role only
    through Terraform-address indirection that a for_each/count idiom
    breaks, is what this scenario's tier-1 checks exist to find.

    No role's PHYSICAL NAME is graded, on any arm, and neither is the
    team-defined policy's: identity here is existence + type +
    properties, keyed on the plan address (TF-shaped arms) or the
    template logical id (awscdk). A solution that omits the role's
    physical name and lets the provider or CDK compute one -- the DEFAULT
    shape on terraconstructs, whose L2 falls back to `namePrefix`
    whenever `roleName` is not supplied -- scores exactly the same as one
    that sets it, on every arm.

  # REPAIR PASS 10 (2026-08-23), specs/SCHEMA.md §4.5. This scenario's
  # tier-1 fact is a CROSS-RESOURCE JOIN ("the team-defined managed policy
  # is attached to BOTH of the roles this template creates"), stated on
  # the CFN side through logical ids -- exactly what cfn-guard 3.2.0
  # cannot express and what three previous repair passes each had to
  # approximate with a proxy that was unsound in both directions (see this
  # file's header comment, defect 18). DECISIONS.md Amendment 29 §4 makes
  # equal-strictness cross-arm grading binding, and this scenario's entire
  # output IS a cross-arm comparison, so its awscdk tier-1 is graded by
  # the same engine the TF-shaped arms use, over the same synthesized
  # CloudFormation template cfn-guard used to read.
  # The bundle: oracles/rego-cfn/iam-managed-policy-exclusive-vs-
  # attachment/policy.rego. oracles/cfn-guard/iam-managed-policy-
  # exclusive-vs-attachment/policy.guard is DELETED (the generator will
  # not remove a hand-authored file, so flipping this field leaves an
  # orphan unless it is deleted by hand -- oracles/emit.py says so at its
  # own site). cfn-guard remains installed in the awscdk arm image as a
  # measured arm capability.
  awscdk_tier1_engine: rego

  structural_asserts:
    - name: role-trusts-ecs-tasks-service
      description: >
        At least one IAM role's trust policy (AssumeRolePolicyDocument /
        assume_role_policy) permits the ecs-tasks.amazonaws.com service
        principal to assume it. principal is always a plan-time-known,
        agent-authored literal (never provider-computed) regardless of arm.

        DELIBERATELY "at least one", and honest about it: this assert
        resolves the FLATTENED UNION of every role's trust principals, and
        tier-0's grammar has no per-element quantifier (`contains` is
        satisfied by any one matching node anywhere in the resolved set).
        Blueprint §2(c) pre-registered this row as "(`contains`, PER
        ROLE)"; the per-role PAIRING -- one role trusted by ecs-tasks, a
        DIFFERENT role trusted by lambda -- is graded at tier 1 instead,
        by matching rules on both oracle files (the deny rules over
        `ecs_trusting_role_ids` / `lambda_trusting_role_ids` /
        `roles_trusting_both_ids` in oracles/rego-cfn/<id>/policy.rego,
        and the three deny rules over `ecs_trusting_role_addresses` /
        `lambda_trusting_role_addresses` /
        `roles_trusting_both_addresses` in oracles/rego/<id>/policy.rego).
        REPAIR PASS 10 ported the awscdk half off cfn-guard onto Rego;
        the two halves' semantics were byte-for-byte matched before that
        port and still are. See this spec's
        header comment, REPAIR PASS 9 defect 17, for the reproduction that
        forced the move and why tier 0 cannot express it.
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::IAM::Role')].Properties.AssumeRolePolicyDocument.Statement[*].Principal.Service"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.assume_role_policy|fromjson.Statement[*].Principal.Service"
      op: contains
      expected: "ecs-tasks.amazonaws.com"

    - name: role-trusts-lambda-service
      description: >
        At least one IAM role's trust policy permits the
        lambda.amazonaws.com service principal to assume it. Same
        plan-time-known rationale as role-trusts-ecs-tasks-service, and
        the same deliberate, tier-0-grammar-bound "at least one" scope --
        see that assert's own note for where the per-role pairing is
        actually graded (tier 1, both oracle files, matching semantics).
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::IAM::Role')].Properties.AssumeRolePolicyDocument.Statement[*].Principal.Service"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.assume_role_policy|fromjson.Statement[*].Principal.Service"
      op: contains
      expected: "lambda.amazonaws.com"

    - name: no-account-exclusive-policy-attachment
      description: >
        No `aws_iam_policy_attachment` resource (the account-wide-exclusive
        form) exists anywhere in the plan -- the account-exclusive-policy-
        attachment catch's own falsifying fact. CloudFormation has no such
        resource type at all, so this has no cfn_jsonpath / no awscdk
        entry; the corresponding terraconstructs fact is covered by this
        same tf_jsonpath (its L2 surface never emits this type either --
        see this spec's header comment -- so a correct terraconstructs
        solution trivially passes it too).
      tier: "0"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_iam_policy_attachment')]"
      op: not_exists

    - name: no-role-scoped-exclusive-attachment
      description: >
        No `aws_iam_role_policy_attachments_exclusive` resource (the
        purpose-built, role-scoped-exclusive form) exists anywhere in the
        plan -- the role-scoped-exclusive-attachment catch's own
        falsifying fact.

        ADDED IN REPAIR PASS 4 (2026-08-22): a prior pass's oracle
        accepted this resource type at tier 1 (see this spec's own header
        comment, defect 8, and oracles/rego/.../policy.rego's own header
        comment for the full before/after) -- this scenario's one
        load-bearing prompt sentence ("Other teams attach their own
        policies to these roles out of band; that must keep working.")
        forbids it just as surely as it forbids `aws_iam_policy_attachment`
        below, since both remove an out-of-band attachment the sentence
        requires to survive; only the blast radius differs (one role vs.
        account-wide), not the mechanism -- so this assert is symmetric
        with `no-account-exclusive-policy-attachment`, not a weaker
        cousin of it. CloudFormation has no such resource type at all, so
        this has no cfn_jsonpath / no awscdk entry; the corresponding
        terraconstructs fact is covered by this same tf_jsonpath (its L2
        surface never emits this type either -- re-verified directly
        against the pinned 0.2.13 package, see this spec's header comment
        -- so a correct terraconstructs solution trivially passes it too).
      tier: "0"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_iam_role_policy_attachments_exclusive')]"
      op: not_exists

    - name: no-deprecated-role-managed-policy-arns
      description: >
        No `aws_iam_role` resource sets `managed_policy_arns` (the
        deprecated, role-scoped-exclusive attribute) -- the deprecated-
        exclusive-role-attribute catch's own falsifying fact.

        BUG FOUND AND FIXED, REPAIR PASS 2 (2026-08-21): the ORIGINAL
        `tf_jsonpath` read `.planned_values...values.managed_policy_arns`,
        which is UNSOUND for exactly the most destructive form of this
        mistake -- Terraform OMITS an explicitly-empty
        `managed_policy_arns = []` from `.planned_values...values`
        ENTIRELY (verified directly against a real `terraform show -json`
        plan, provider 6.58.0: `.planned_values...aws_iam_role.values |
        has("managed_policy_arns")` -> `false` for a role with `= []`
        set), so the old path resolved 0 nodes for that role -- identical
        to a role that never touched the attribute at all -- and
        `not_exists` (wrongly) PASSED. This matters precisely because
        `= []` is the WORST case, per the provider's own docs
        (website/docs/r/iam_role.html.markdown: "If someone attaches a
        policy out-of-band, on the next apply, Terraform will detach that
        policy... configuring an empty set... will cause Terraform to
        remove ALL managed policy attachments") -- it is the exact
        "other teams attach their own policies out of band" failure mode
        this scenario's one load-bearing prompt sentence exists to test,
        and the original assert could not see it.

        THE FIX: retargeted at
        `.configuration...expressions.managed_policy_arns` instead (the
        CONFIGURATION tree, not planned values) -- verified directly
        against real plan JSON both ways: a role with `managed_policy_arns
        = []` resolves `{"constant_value": []}` (a present, non-null node
        -- `not_exists` correctly FAILS), a role that never sets the
        argument has NO `managed_policy_arns` key under `.expressions` at
        all (jq/jsonpath-ng both resolve nothing for a genuinely-missing
        object key, as opposed to a key present with value `null` --
        confirmed for both the jq translation `tests/_assert_lib.sh`'s
        `assert_check` actually runs, via its own `map(select(. !=
        null))` null-filtering, and the `oracles/lib/structural.py`
        `resolve()` path this repo's own gates use) -- `not_exists`
        correctly PASSES. Re-verified against this scenario's own
        reference solution (PASSES, unchanged) and the
        deprecated-exclusive-role-attribute broken fixture, which now
        uses the `= []` form specifically (see that catch's own updated
        description) -- FAILS, as required.
      tier: "0"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.configuration.root_module.resources[?(@.type=='aws_iam_role')].expressions.managed_policy_arns"
      op: not_exists

    # s3-readonly-policy-attached-cfn (tier 0, awscdk-only, RETIRED in
    # REPAIR PASS 4, 2026-08-22) used to live here. Its FIRST two bug
    # fixes (recursive-descent `..Ref` to reach the bracket-quoted
    # `Fn::Join` key at all, then narrowing "some AWS-managed policy" down
    # to "specifically AmazonS3ReadOnlyAccess" by moving the strict check
    # to tier 1) are unchanged history, preserved in full in
    # customer-metrics-policy-attached-to-both-roles-cfn's own description
    # below. REPAIR PASS 4 found a THIRD problem this assert's own grammar
    # could not survive: `iam.ManagedPolicy.fromManagedPolicyArn(...)`, an
    # equally first-class aws-cdk-lib import spelling, renders a BARE
    # literal ARN string (no `Ref` node anywhere) instead of the
    # `Fn::Join`+`Ref` construction this assert's `..Ref` extraction
    # requires -- an otherwise fully correct solution using that spelling
    # FAILED this assert (reproduced directly: aws-cdk-lib 2.263.0,
    # `grep -c '"Ref"' template.json` inside ManagedPolicyArns for that
    # role = 0). Unlike the second bug, this one cannot be fixed by
    # narrowing the SAME jsonpath -- accepting a bare string OR a nested
    # `Ref` is exactly the type-conditional-field-selector case
    # generator/jsonpath_jq.py's grammar cannot express (see
    # s3-readonly-policy-attached-tf's own retirement note, REPAIR PASS 2,
    # for the identical class of limitation on the TF side). RETIRED for
    # the same reason and in the same way that assert was: the identity
    # fact now lives entirely at tier 1
    # (in the awscdk-side bundle: `s3_readonly_attached_to_both_roles` in
    # policy.guard, widened to accept EITHER render in REPAIR PASS 4 and
    # tightened from "at least one role" to per-role in REPAIR PASS 7,
    # then ported in REPAIR PASS 10 to
    # `s3_readonly_covered_role_ids` in oracles/rego-cfn/<id>/policy.rego,
    # which accepts both renders and an Fn::Sub one with a single
    # suffix match -- see that file's own header note), not
    # as a standalone `structural_asserts` entry (folded into
    # the SAME already-existing awscdk-side bundle
    # customer-metrics-policy-attached-to-both-roles-cfn already runs, so
    # `make tier1-coverage`'s numeric floor is unaffected).

    # --- policy-attached-to-one-role-only (tier 1) --------------------------
    # Split cfn/tf per specs/SCHEMA.md §4.2's own "different artifact
    # families need a real second expression" rule (mirrors
    # s3-lambda-log-retention's lambda-permission-scoped-to-bucket-cfn/-tf
    # pair and toy-ssm-parameter's policy-resource-scoped-not-wildcard-cfn/
    # -tf pair) -- but for a DIFFERENT underlying reason than either of
    # those precedents' plan-time-unknown-ness: here it is that tier-0's
    # flat JSONPath+op grammar cannot express "for EACH of N roles,
    # independently, a matching attachment exists" (a per-element
    # quantification), which Rego's set-comprehension CAN. The
    # cfn_jsonpath/tf_jsonpath below are real, RESOLVABLE
    # spec-documentation for the policy files that actually run
    # (oracles/rego-cfn/iam-managed-policy-exclusive-vs-attachment/
    # policy.rego on awscdk since REPAIR PASS 10 -- see
    # `oracle.awscdk_tier1_engine` above -- and
    # oracles/rego/iam-managed-policy-exclusive-vs-attachment/policy.rego
    # on the TF-shaped arms) -- not an exhaustive, mechanically-sufficient
    # check on their own, exactly the documentation-only role
    # specs/SCHEMA.md §4.2.1 point 1's own caveat describes for a
    # multi-hop graph-edge check.
    - name: customer-metrics-policy-attached-to-both-roles-cfn
      description: >
        (awscdk only -- see customer-metrics-policy-attached-to-both-roles-tf
        for the TF-shaped arms.) A customer-authored AWS::IAM::ManagedPolicy
        resource exists in the template (the team-defined CloudWatch-
        metrics policy this scenario asks for), and it is attached to BOTH
        AWS::IAM::Role resources the template creates -- not just one (the
        policy-attached-to-one-role-only catch). This cfn_jsonpath
        documents only the weaker "the policy resource itself exists"
        half, which check-paths can verify resolves against a real
        fixture; the real per-role fact is a CROSS-RESOURCE JOIN and lives
        in the tier-1 policy bundle.

        WHICH BUNDLE, AND WHY IT CHANGED (REPAIR PASS 10, 2026-08-23):
        this arm's tier-1 is now graded by OPA/Rego --
        `oracle.awscdk_tier1_engine: rego` above,
        oracles/rego-cfn/iam-managed-policy-exclusive-vs-attachment/
        policy.rego -- over the SAME synthesized CloudFormation template
        cfn-guard used to read. oracles/cfn-guard/iam-managed-policy-
        exclusive-vs-attachment/policy.guard is DELETED. The reason is
        structural, not stylistic: cfn-guard 3.2.0 has no cross-collection
        identity join, so it cannot state "this ManagedPolicy's `Roles`
        entry references the logical id of THAT Role", and each of the
        three rules that tried was a proxy unsound in both directions --
        REPAIR PASS 3's rule-level disjunction rejected the correct MIXED
        attachment shape (defect 16), and REPAIR PASS 9's replacement
        count equality (`count(roles whose own ManagedPolicyArns carries
        no Ref at all) == count(every in-template ManagedPolicy's Roles
        entries)`) accepted a policy-side `Roles` list naming the SAME
        role twice and credited a role for a `Ref` to any Ref-addressable
        resource at all. The Rego bundle performs the real join
        (`references_logical_id` over `{"Ref": ...}` / `{"Fn::GetAtt":
        [...]}`, unioned across the role-side and policy-side attachment
        shapes before any cardinality is looked at), so the mixed shape,
        the role-side shape and the policy-side shape all pass, and the
        one-role-only shape fails in every spelling. See this spec's
        header comment, defect 18, and that file's own header.

        HISTORICAL RECORD, retained because the fixtures it produced are
        still shipped and still graded: the ORIGINAL cfn-guard rule
        checked `'Fn::GetAtt' EXISTS` and FAILED against this scenario's
        own oracle-CORRECT reference solution. Root cause, confirmed
        against AWS's own CloudFormation resource-reference docs
        (`AWS::IAM::ManagedPolicy`, "Return values", read 2026-08-21):
        *"When you pass the logical ID of this resource to the intrinsic
        Ref function, Ref returns the ARN"* -- unlike most resource types,
        this one's `Ref` IS the ARN, and aws-cdk-lib's
        `Role.addManagedPolicy()` emits a bare `{"Ref": "<ManagedPolicy
        LogicalId>"}` for exactly that reason (verified directly against
        `cdk synth`, aws-cdk-lib 2.263.0). The Rego bundle's join accepts
        `Ref` (the CDK-emitted spelling) and `Fn::GetAtt` (a legitimate
        escape-hatch spelling) alike, so that class of bug cannot recur by
        picking the wrong one of the two.

        The residual gap the old cfn-guard rule had to accept -- "cannot
        verify a role's `Ref` target is SPECIFICALLY this ManagedPolicy
        and not some other Ref-addressable resource" -- is CLOSED by the
        port: the join credits a role only for a reference naming an
        actual in-template AWS::IAM::ManagedPolicy.

        Two facts share this bundle rather than declaring
        `structural_asserts` entries of their own, both folded in for the
        same reason (tier-0's flat JSONPath+op grammar has no per-element
        quantifier and no type-conditional field selector, so neither can
        be expressed there): the AmazonS3ReadOnlyAccess IDENTITY check
        (see the s3-readonly-policy-attached-cfn retirement note above
        this entry -- REPAIR PASS 2 introduced it, REPAIR PASS 4 widened
        it to accept `fromManagedPolicyArn`'s bare-literal render, REPAIR
        PASS 7 tightened it from "at least one role" to PER ROLE), and the
        two-roles/trust-principal-pairing checks (REPAIR PASS 6 and 9).
        The Rego port preserves all of them at exactly the strictness the
        TF-shaped oracle grades the same facts at, and REPAIR PASS 10 adds
        the four broken fixtures that finally falsify the four of them
        that had none.
      tier: "1"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::IAM::ManagedPolicy')].Properties.PolicyDocument"
      op: exists

    - name: customer-metrics-policy-attached-to-both-roles-tf
      description: >
        (hcl_raw + terraconstructs only -- see
        customer-metrics-policy-attached-to-both-roles-cfn for awscdk.)
        Graph-edge check, documentation-only (see this entry group's own
        header note above for why a flat path cannot fully express this
        fact): an `aws_iam_role_policy_attachment` resource's `policy_arn`
        expression REFERENCES a customer-authored `aws_iam_policy` resource
        created in this configuration (as opposed to a hardcoded/AWS-owned
        literal ARN, which has no `.references` entry at all). The real
        check -- that the SET of role IDENTITIES covered by such
        attachments equals every role this plan creates, not just one --
        is Rego's job (oracles/rego/iam-managed-policy-exclusive-vs-
        attachment/policy.rego's `metrics_covered_role_addresses` /
        `iam_role_addresses` rules). Those role identities are plan
        ADDRESSES, not physical names, as of REPAIR PASS 7 -- see this
        spec's own header comment, defect 12, and policy.rego's BUG 8.

        REPAIR PASS 2 (2026-08-21) -- TWO fixes, both documented in full
        in policy.rego's own header comment (not re-derived here):
          1. SHAPE-2 TOLERANCE, ITSELF REVERSED IN REPAIR PASS 4
             (2026-08-22 -- see this spec's own header comment, defect 8,
             and policy.rego's own header comment for the full
             before/after). This pass had widened policy.rego to
             recognize `aws_iam_role_policy_attachments_exclusive`
             (role-scoped exclusive) as a SECOND covering shape alongside
             the additive `aws_iam_role_policy_attachment`, reading
             blueprint §2(b)'s "also acceptable" clause literally without
             checking it against the same blueprint section's own prompt
             sentence ("Other teams attach their own policies... out of
             band; that must keep working") -- which that resource type
             VIOLATES by design (it removes any out-of-band attachment to
             that role its own `policy_arns` list does not name). REPAIR
             PASS 4 removed the union entirely: policy.rego no longer
             treats `aws_iam_role_policy_attachments_exclusive` as
             covering ANYTHING, and instead denies outright when it is
             present at all (mirroring the pre-existing account-wide
             `aws_iam_policy_attachment` rejection), backed by the new
             tier-0 `no-role-scoped-exclusive-attachment` assert above as
             the primary defense. This tf_jsonpath's own
             `aws_iam_role_policy_attachment`-only documentation is
             UNCHANGED (still real, resolvable spec-documentation for the
             one now-accepted shape).
          2. FOR_EACH BLINDNESS. The first pass resolved the
             attachment->role edge via `expressions.role.references`
             matched against a role's Terraform ADDRESS -- undefined for
             an ordinary `for_each`-over-roles idiom (DEMONSTRATED: a real
             `terraform plan` for a `for_each`-shaped, otherwise-correct
             hcl_raw solution scored 0.0). Fixed: role coverage was
             matched by the role's own AWS identity (its `name`, read
             from `.planned_values`) instead of by resource address.
             REPAIR PASS 7 (2026-08-22) REPLACED that with a two-path
             resolution keyed on the role's plan ADDRESS -- the `name`
             join is retained as one of the two paths (so every shape
             this fix rescued still scores 1.0), but a role whose
             physical name is provider-computed (`name_prefix`, or
             terraconstructs' `roleName`-omitted default) now resolves
             through the attachment block's own
             `expressions.role.references` instead of failing closed.
             REPAIR PASS 8 (2026-08-23) widened that fallback again
             (BUG 10, defect 14 in this file's own header comment): a
             reference to a for_each'd role is INSTANCE-qualified
             (`aws_iam_role.this["batch_runner"].name`), so it names the
             covered role instance outright and is now read at face
             value instead of being reduced to a block address the
             block-keyed lookup could not match. Four resolution paths
             in total; see policy.rego's PATH A-D note.
             See this spec's header comment, defects 12 and 14, and
             policy.rego's BUG 8 / BUG 10.
          3. The SAME policy.rego file now ALSO carries the S3-readonly
             identity check (folded in, not a new tier-1
             `structural_asserts` entry -- see s3-readonly-policy-
             attached-cfn's sibling note for the awscdk-side half of this
             same class of fix; the retired `s3-readonly-policy-attached-
             tf` tier-0 assert's history is preserved in this file's own
             prior-pass record, DECISIONS.md-adjacent).

        REPAIR PASS 5 (2026-08-22) -- BUG 6, the POLICY-side mirror of
        REPAIR PASS 2's fix 2 above, which fixed the ROLE side of this
        exact attachment edge and left the POLICY side unfixed: a
        `for_each`-over-a-map-of-policy-ARNs idiom (`policy_arn =
        each.value`) or a for_each-over-{role,policy}-pairs idiom
        (`policy_arn = each.value.policy_arn`) made
        `expressions.policy_arn.references` resolve to `["each.value"]`
        (or similar), never `"aws_iam_policy.team_metrics"` -- a fully
        correct, additive, idiomatically-DRY solution using either idiom
        scored reward 0.0, `deny` FALSELY claiming the policy was
        unattached. Fixed: policy.rego's new
        `attachment_instance_targets_customer_policy` adds a SCHEMA.md
        §4.2.1 plan-time-unknown fallback per PLANNED INSTANCE (not just
        per configured block) -- see that predicate's own comment, BUG 6,
        for the full evidence and re-verified negative.

        SCOPE CORRECTION (REPAIR PASS 9, 2026-08-23): REPAIR PASS 5 fixed
        only the POLICY half of the {role,policy}-pairs idiom's edge. That
        idiom's ROLE half -- resolving WHICH role each pair instance
        covers, when the role's own physical name is provider-computed --
        stayed broken until this pass's PATH E (policy.rego, BUG 11; this
        spec's header comment, defect 15). Read REPAIR PASS 5's claim as
        "the policy edge of that idiom", not "that idiom".

        REPAIR PASS 9 (2026-08-23) -- BUG 11, PATH E: an attachment BLOCK
        with no per-instance role edge from PATHS A-D, whose
        `.references` name a role BLOCK with N > 1 planned instances, has
        its own planned instances grouped by resolved POLICY IDENTITY; a
        group of exactly N credits all N role instances of that block for
        that policy. That is what makes the fully-DRY cartesian
        `setproduct(roles, policies)` idiom score 1.0 without crediting a
        one-role-only negative (1 instance vs 2 role instances credits
        nobody). The two coverage deny messages were reworded in the same
        edit to stay TRUE in the ambiguous case: they now say the plan
        "does not establish" the attachment and that no attachment
        instance "resolves onto" the named addresses. Fixtures:
        `solution/reference-alt-hcl-cartesian/` (1.0),
        `solution/broken/cartesian-metrics-on-one-role-only/` and
        `solution/broken/cartesian-s3-on-one-role-only/` (0.0).
      tier: "1"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.configuration.root_module.resources[?(@.type=='aws_iam_role_policy_attachment')].expressions.policy_arn.references[*]"
      op: regex
      expected: "^aws_iam_policy\\."

  rego_hints:
    - >-
      package cdktn_bench.iam_managed_policy_exclusive_vs_attachment, graded
      against `terraform show -json` PLAN output (input) for hcl_raw AND
      terraconstructs. Read attachment/policy/role identity from
      input.configuration.root_module.resources (the graph-edge facts,
      plan-time-known regardless of whether the referenced ARNs themselves
      are) -- SCHEMA.md §4.2.1, same rationale as s3-lambda-log-retention's
      and toy-ssm-parameter's own Rego.
    - >-
      REPAIR PASS 2 (2026-08-21) rewrote this policy substantially, then
      REPAIR PASS 4 (2026-08-22) reversed ONE of that rewrite's decisions
      -- see oracles/rego/iam-managed-policy-exclusive-vs-attachment/
      policy.rego's own header comment for the full before/after evidence
      on all bugs fixed across both passes (for_each role-identity
      blindness, S3-readonly identity fold-in, the shape-2 tolerance
      REPAIR PASS 4 removed, and the `.id`-vs-`.name` fallback). The
      hints below describe the CURRENT design.
    - >-
      Collect aws_iam_role (from .planned_values...resources, for role
      ADDRESS identity -- always present, and never a physical name; see
      the identity hint below) and aws_iam_policy (customer_policies, from
      .configuration...resources, for graph-edge references) resources.
      Collect the ADDITIVE attachment family from
      .configuration...resources: aws_iam_role_policy_attachment ONLY.
      `aws_iam_role_policy_attachments_exclusive` (role-scoped exclusive)
      is REJECTED, not collected as a covering shape (REPAIR PASS 4,
      2026-08-22): it removes any out-of-band attachment to that role its
      own `policy_arns` list does not name, which is exactly what this
      scenario's one load-bearing prompt sentence forbids -- deny
      outright when any such resource exists in the configuration, mirror
      the account-wide `aws_iam_policy_attachment` rejection (a different
      resource type, still rejected by this scenario's tier-0
      no-account-exclusive-policy-attachment assert) at tier 1 too, for
      defense in depth alongside the primary tier-0
      no-role-scoped-exclusive-attachment assert.
    - >-
      For each additive attachment RESOURCE BLOCK (one `.configuration`
      entry per for_each/count resource, covering every instance), resolve
      whether its policy_arn expression REFERENCES a customer_policies
      address (bare address or an attribute-qualified form, e.g.
      "aws_iam_policy.team_metrics" or "aws_iam_policy.team_metrics.arn"
      -- both occur in real plan output, same as toy-ssm-parameter's own
      G2 fix note documents for a different attribute). PER PLANNED
      INSTANCE (REPAIR PASS 5, BUG 6, policy.rego's own header comment):
      when the block-level reference resolution above is undefined (e.g.
      `policy_arn = each.value`, a for_each-over-policies idiom, whose
      `.references` names only the iteration variable, never the customer
      policy's own address) AND exactly one customer_policies resource
      exists, ALSO treat an instance whose own `values.policy_arn` did NOT
      resolve to a plan-time-known string as covering the customer policy
      (SCHEMA.md §4.2.1's plan-time-unknown class -- the only thing that
      makes `policy_arn` unknown in this scenario's world is a reference to
      the not-yet-created customer policy's own `.arn`). For each covering
      instance (either path), resolve WHICH ROLE it covers as that role's
      plan ADDRESS (REPAIR PASS 7, BUG 8 -- physical names are never
      load-bearing here): join on `values.role` against a planned role's
      `values.name` when that string is plan-time-known (the ordinary
      case, and the one that keeps every for_each idiom working), and
      otherwise resolve the attachment BLOCK's own
      `expressions.role.references` down to the referenced role
      resource's address (the case where the role's physical name is
      provider-computed -- `name_prefix`, terraconstructs' `roleName`-
      omitted default, or BUG 4's `.id` spelling -- and `values.role` is
      therefore unknown or absent). Union those addresses into
      metrics_covered_role_addresses. A parallel set
      (s3_covered_via_attachment, matched against the literal
      AmazonS3ReadOnlyAccess ARN instead of a customer-policy reference,
      unaffected by the plan-time-unknown fallback since that ARN is
      always a known literal) gives s3_covered_role_addresses.
    - >-
      iam_role_addresses := the SET of plan ADDRESSES of the aws_iam_role
      instances this plan creates, from .planned_values (REPAIR PASS 7,
      BUG 8: role identity is existence + type + properties keyed on the
      address -- NOT `values.name`, which is absent whenever the physical
      name is provider-computed, and which nothing in this scenario
      grades as a value on any arm). Four deny rules, all keyed on that
      same address domain: (1) any address in iam_role_addresses but not
      in metrics_covered_role_addresses (fail-closed by construction --
      when NO customer policy was created at all,
      metrics_covered_role_addresses is empty and every role is
      "missing", no second rule needed); (2) any address in
      iam_role_addresses but not in s3_covered_role_addresses (the
      folded-in AmazonS3ReadOnlyAccess identity check -- PER ROLE as of
      REPAIR PASS 7, matching the prompt's own "Both roles need read
      access..." sentence and blueprint §2(c)'s pre-registered tier-0
      plan; it used to fire only when ZERO roles were covered, which let
      a role with no S3 access at all score 1.0 -- see this spec's header
      comment, defect 13); (3) any
      aws_iam_role_policy_attachments_exclusive resource exists at all
      (the REPAIR PASS 4 rejection, defense-in-depth alongside tier-0's
      own not_exists check); (4) REPAIR PASS 6 (2026-08-22):
      `count(iam_role_addresses) != 2` -- oracle.intent's own opening
      sentence ("Two IAM roles exist...") was previously unbacked by any
      check; a single role carrying both trust principals satisfied every
      pre-existing assert. A bare count, not a name match on
      `{"batch-runner", "report-writer"}` -- neither literal name is
      graded anywhere in this scenario, on any arm, so a legitimate
      renaming (or omitting the name entirely) must not be broken by this
      fix. See policy.rego's own BUG 7 and BUG 8 header notes.


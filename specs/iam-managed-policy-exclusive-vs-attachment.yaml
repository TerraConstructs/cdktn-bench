  # oracles/rego-cfn/iam-managed-policy-exclusive-vs-attachment/policy.rego
  # (`oracle.awscdk_tier1_engine: rego`), not a `.guard` file, so every
  # hint below was rewritten in Rego terms in the same edit. The previous
  # hints described `%roles { ... }` block forms and `%roles_without_ref_
  # count == %policy_role_ref_count` cardinality equalities in a file that
  # no longer exists; leaving them would have left the spec documenting a
  # grader nothing runs. (`rego_hints` above stay what they always were:
  # the PLAN-JSON-shape hints for oracles/rego/<id>/policy.rego.)
  cfn_guard_hints:
    - >-
      Graded against the awscdk arm's synthesized CloudFormation template
      (cdk.out/ScenarioStack.template.json). `input.Resources` is an
      OBJECT keyed by LOGICAL ID; `iam_role_ids` and `managed_policy_ids`
      are the sets of logical ids whose `.Type` is "AWS::IAM::Role" and
      "AWS::IAM::ManagedPolicy" respectively. Every set this policy
      differences is a set of LOGICAL IDS -- never a physical
      `Properties.RoleName` (Amendment 29 §4 / operator ruling 1), which
      is the CFN-side twin of the plan ADDRESS the TF-shaped policy.rego
      keys on. Read every optional property through `object.get(...,
      default)`: an absent ManagedPolicyArns or Roles list must make the
      enclosing deny FIRE, not go undefined (fail-closed).
    - >-
      THE JOIN (the whole reason this scenario selects the `rego` engine
      -- specs/SCHEMA.md §4.5): `references_logical_id(node, lid)` is true
      when `node` is `{"Ref": lid}` or `{"Fn::GetAtt": [lid, ...]}` (list
      or dotted-string form). `metrics_covered_role_ids` is the UNION of
      the two attachment shapes aws-cdk-lib offers -- role-side (a role's
      own ManagedPolicyArns entry referencing an in-template ManagedPolicy,
      what `role.addManagedPolicy(p)` emits; note AWS::IAM::ManagedPolicy's
      Ref intrinsic itself returns the policy ARN, per AWS's own CFN docs,
      so the entry is a bare `Ref`, never an `Fn::GetAtt ... Arn`) and
      policy-side (an in-template ManagedPolicy's own `Roles` entry
      referencing a role, what `ManagedPolicyProps.roles` emits). Taking
      the union over BOTH shapes before any cardinality is looked at is
      what makes a MIXED solution -- one role named from each side --
      correct by construction, with no rule-level disjunction to fall
      between.
    - >-
      Deny, per role (operator ruling 2 -- the prompt says BOTH roles, so
      the check is a SET DIFFERENCE, never "at least one"): `iam_role_ids
      - metrics_covered_role_ids`, non-empty -> deny naming the uncovered
      logical ids. Strictness is pinned to the TF-shaped oracle in BOTH
      directions: the union runs over every in-template ManagedPolicy,
      exactly as oracles/rego/<id>/policy.rego's
      `metrics_covered_via_attachment` unions over every customer-authored
      `aws_iam_policy` (`attachment_block_targets_customer_policy` is
      satisfied by ANY `some p in customer_policies`). A solution creating
      a separate team policy per role is therefore accepted on every arm
      alike; requiring one single policy to cover both roles HERE -- which
      the join could easily express -- would make this arm stricter than
      the other two, the very asymmetry Amendment 29 §4 forbids.
    - >-
      Fail-closed companion (the port's preservation of the retired
      `customer_policy_exists_when_roles_present` cfn-guard rule): roles
      present but zero AWS::IAM::ManagedPolicy resources in the template
      -> deny. Guarded so exactly one of it and the coverage rule above
      fires. Covering negative:
      `solution/broken/no-team-metrics-policy/` (the metrics permission
      granted as an INLINE policy per role instead), which also makes
      oracle.intent's documented inline-policy scope limit executable.
    - >-
      AmazonS3ReadOnlyAccess identity, per role: `iam_role_ids -
      s3_readonly_covered_role_ids`, non-empty -> deny. A role is covered
      when some entry of its ManagedPolicyArns has ANY string leaf (via
      `walk`) ENDING WITH ":iam::aws:policy/AmazonS3ReadOnlyAccess". One
      rule covers all three renders aws-cdk-lib produces or an agent may
      write -- `fromAwsManagedPolicyName`'s `Fn::Join` + `{"Ref":
      "AWS::Partition"}`, `fromManagedPolicyArn`'s bare literal ARN, and
      an `Fn::Sub`-templated partition -- instead of enumerating them,
      which is the mistake REPAIR PASS 4 already had to repair once when a
      third spelling appeared. Anchoring at the END of the leaf is what
      keeps a different AWS-managed policy from ever satisfying it. This
      is the CFN-side twin of the TF oracle's tolerance for a
      `data.aws_partition`-templated ARN; neither render is preferred,
      and oracle.intent says so.
    - >-
      Trust principals, per role -- byte-for-byte the same semantics as
      the TF-shaped oracle's `ecs_trusting_role_addresses` /
      `lambda_trusting_role_addresses` / `roles_trusting_both_addresses`,
      mirrored onto logical ids so no arm grades this fact more strictly
      than another: some role trusts ecs-tasks.amazonaws.com, some role
      trusts lambda.amazonaws.com, and the INTERSECTION of those two sets
      is empty (which is what forces the two principals onto two DISTINCT
      roles). `Principal.Service` is accepted as a bare string or a list;
      `AssumeRolePolicyDocument` is accepted as an object (what CDK
      emits) or a JSON string (which CloudFormation also accepts). Role
      CARDINALITY is a bare `count(iam_role_ids) != 2` -- a resource
      count, never a `roleName`/`RoleName` match, so a solution that lets
      CDK compute the physical names scores exactly what one that sets
      them scores, on this arm and on the other two.
    - >-
      Every rule above has a covering `solution/broken/` fixture on this
      arm (REPAIR PASS 10 added the four that had none:
      `single-role-for-both-workloads` for the role count,
      `no-team-metrics-policy` for the fail-closed existence rule, and
      `both-roles-trust-ecs-tasks-only` / `both-roles-trust-lambda-only`
      for the two some-role-trusts-<service> rules -- plus
      `metrics-policy-on-one-role-from-both-sides`, the shape that proved
      the retired cfn-guard count-equality accepted a template leaving one
      role without the team policy). An unfalsified rule
      is untested; do not add a rule here without one.
  tier05_jsonata: null


# Batch A greenfield scenario. Design source:
# docs/design/batch-a-greenfield-blueprints.md §2 (authored 2026-08-20,
# while a live trial was running against 886312446417 -- no generation, no
# AWS calls, no tasks/ writes were made producing that blueprint). Read in
# full at authoring time alongside docs/adding-scenarios.md §1 item 3a
# (prompt-writing rules), specs/SCHEMA.md (field reference, esp. §0.1
# identity separation, §3 catches/applies_to, §4.2/§4.2.1 structural
# asserts + plan-time-unknown), DECISIONS.md Amendments 23-28, and
# specs/s3-lambda-log-retention.yaml (structural template).
#
# ---------------------------------------------------------------------
# THE TRAP (operator-facing; never written where the agent can read it):
# ---------------------------------------------------------------------
# Terraform models "policy X is attached to role Y" three ways with
# different ownership semantics, two of which are AUTHORITATIVE / exclusive
# rather than additive:
#   - aws_iam_role_policy_attachment  -- additive, correct for this ticket.
#   - aws_iam_role_policy_attachments_exclusive -- exclusive, but scoped to
#     ONE role and DECLARED as exclusive by its own name. REJECTED (the
#     role-scoped-exclusive-attachment catch, REPAIR PASS 4): "role-scoped"
#     is not "safe" -- it still removes, on the next apply, any attachment
#     to that role it did not itself list, which is exactly what this
#     scenario's "other teams attach their own policies... out of band;
#     that must keep working" sentence forbids. See the "Oracle must
#     tolerate/defend" section below for the full reasoning.
#   - aws_iam_policy_attachment -- takes exclusive ownership of a POLICY's
#     entire account-wide attachment set. `roles = [both roles]` plans
#     clean, applies clean, and satisfies every *functional* assert in this
#     scenario -- but silently detaches that managed policy from every
#     OTHER principal in the account that happens to reference it, now or
#     in the future. This is the plausible-wrong solution (catch
#     account-exclusive-policy-attachment): the resource name most closely
#     resembles the question ("attach a policy" -> aws_iam_policy_attachment),
#     a name-similarity failure, not a knowledge failure.
#   - aws_iam_role.managed_policy_arns -- deprecated, takes exclusive
#     ownership of a ROLE's entire managed-policy set. Mixing it with an
#     additive attachment on the same role/policy produces attach/detach
#     churn on every apply (catch deprecated-exclusive-role-attribute).
# CloudFormation has exactly one attachment surface (ManagedPolicyArns on
# the role) and no additive alternative -- the mistake is structurally
# UNREACHABLE there. This is a narrower-API "advantage" for the CDK-shaped
# arms, not a smarter-tool advantage, and the scenario states that plainly
# rather than dressing it up (blueprint §2(e)).
#
# EVIDENCE (blueprint §2(d) re-verification, 2026-08-20; the graded
# candidate's original evidence -- three discuss.hashicorp.com threads --
# is UNVERIFIABLE via `gh` and is replaced here with primary sources read
# directly on the hashicorp/terraform-provider-aws repo's `main` branch):
#   - website/docs/r/iam_role.html.markdown: `managed_policy_arns` is
#     "(Optional, Deprecated)", "Set of EXCLUSIVE IAM managed policy ARNs".
#     Its own note: "this resource will take over exclusive management of
#     the role's respective policy types... incompatible with...
#     aws_iam_policy_attachment, aws_iam_role_policy_attachment... you will
#     get resource cycling and/or errors"; migration guidance names
#     aws_iam_role_policy_attachment and
#     aws_iam_role_policy_attachments_exclusive as the replacements.
#   - website/docs/r/iam_role_policy_attachments_exclusive.html.markdown
#     exists (2,674 bytes) -- the purpose-built, role-scoped exclusive
#     resource, carrying its own "removal of managed IAM policies which are
#     not explicitly configured" warning.
#   - tfp-aws#39376 (OPEN, 2024-09-18 -> 2026-01-30, 11 (thumbsup), 29
#     comments) -- HashiCorp's own meta-issue "[Provider]: Implement
#     exclusive relationship management resources", cataloguing this exact
#     additive-vs-exclusive pattern across IAM inline policies, IAM
#     customer-managed policies, Organizations policies, Route53 records,
#     SSO managed policies, VPC prefix lists, route tables and security
#     groups. The strongest single artifact in the whole Batch A set;
#     anchors this spec's provenance.
#
# terraconstructs immunity, VERIFIED DIRECTLY against the pinned 0.2.13
# package at authoring time (not assumed -- DECISIONS.md's own
# "s3-lambda-log-retention catch is falsified by the pinned provider"
# lesson):
#   - lib/aws/iam/role.js:212-215 -- `managedPolicyArns` is commented OUT
#     of the synthesized IamRole props, with the construct's own citation
#     to the provider's exclusive-relationship-management-resources design
#     doc (the same doc website/docs/r/iam_role.html.markdown's migration

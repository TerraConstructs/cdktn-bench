id: iam-e2e-role
title: 'IAM E2E role derivation: author deployer + workload permissions against real AWS denials'
difficulty: 3
services:
- iam
- ec2
- s3
- ssm
- kms
- sts
arms:
  awscdk: true
  hcl_raw: true
  terraconstructs:
    enabled: true
    reason: |-
      Verified directly against the pinned terraconstructs@0.2.13 package
      (node_modules/terraconstructs/lib/aws/**/*.d.ts, checked at spec-authoring
      time): iam/role.d.ts + iam/instance-profile.d.ts + iam/policy-statement.d.ts
      give iam.Role / iam.PolicyStatement / role.attachInlinePolicy(), the only
      surface this scenario's deliverable (two IAM roles) needs. Because the
      seeded module/ (Terraform, applied by harness/validate.sh, never by any
      arm's own toolchain) is what actually creates the security group, EBS
      volume, S3 bucket and instance profile, this arm's own coverage of
      compute.SecurityGroup / compute.Volume / storage.Bucket is NOT
      load-bearing for whether the arm is eligible -- only its IAM surface is.
      storage/parameter.d.ts confirms StringParameter.fromSecureStringParameterAttributes
      (with an encryptionKey option) and IParameter.grantRead() exist, and
      encryption/key-lookup.d.ts confirms an existing CMK can be imported by
      alias -- both cited by docs/scenario-proposal-iam-e2e-role.md §5.9 as the
      mechanism a future extension of this scenario's workload-role reference
      solution could use to exercise the grantXxx-derivation contrast directly
      in terraconstructs' own substrate, though the v1 reference solution below
      authors the workload policy by hand on all three arms for symmetry with
      hcl_raw (see the spec's own "arms" provenance note below for why).
instruction:
  shared_body: |-
    Author two IAM roles for a real, live Terraform deployment in this AWS
    account, then use them for real -- iterating against actual AWS denials --
    until deployment and teardown both work under exactly the permissions you
    granted.

    This workspace has a fixed Terraform module at `module/` (read-only
    reference input -- do not edit it) that provisions a small set of AWS
    resources: a security group, an encrypted EBS volume, an S3 bucket, and an
    EC2 instance profile. Read it to understand what it creates, but treat it
    as given -- your job is authoring the IAM permissions around it, not the
    module itself.

    Author, in this file, using your target language/toolchain (see below):

    1. A DEPLOYER role, named exactly `iam-e2e-role-deployer`, under IAM path
       `/cdktn-bench-task/`. Its trust policy must allow this AWS account's
       root principal to assume it, gated by a condition requiring a specific
       `sts:ExternalId` value that you choose yourself and record (see the JSON
       contract below). Grant this role exactly the permissions needed to run a
       real `terraform apply` and a real `terraform destroy` of `module/` in
       this account -- no more, no less.

    2. A WORKLOAD role, named exactly `iam-e2e-role-workload`, under the same
       IAM path. Its trust policy must allow BOTH the `ec2.amazonaws.com`
       service principal (this is the role a real EC2 instance would use in
       production) AND this account's root principal, gated by the same kind of
       `sts:ExternalId` condition as the deployer role (a test harness needs to
       be able to assume this role directly, since this task's module never
       boots a real EC2 instance). Grant this role exactly the permissions a
       workload attached to `module/`'s resources genuinely needs to read and
       use them -- no more, no less.

    Deploy your two roles for real, using your toolchain's real deploy command
    against this account (not just synth/plan).

    Then run the harness at `harness/validate.sh` (read-only reference input;
    see its own header comment for exactly what it does and how to invoke it)
    from your project root. It assumes your deployer role, applies `module/`
    for real under that role, runs further checks, assumes your workload role,
    runs further checks under that role, then destroys everything it created.
    Every failure it reports is a real AWS denial in this account, not a
    simulated one. Read the denied action name, decide which of your two
    roles' policies is missing it, fix that role's policy, redeploy, and re-run
    the harness. Repeat until it reports every phase passed.

    Reading `module/`'s resource blocks is a starting point, not a complete
    answer -- some of the permissions either role genuinely needs cannot be
    determined by inspection alone, and are only found by actually running the
    harness and reading what it denies.

    Both roles must be least-privilege. Concretely: do not grant `Action: "*"`
    on any statement; do not grant a full-service wildcard action (an action
    string of the exact form `service:*`, e.g. `iam:*` or `ec2:*`); every
    action you grant must be a real IAM action; and scope every `Resource` to a
    specific ARN or ARN pattern rather than `"*"` wherever you can express one.
    Do not grant any S3 permission a bucket-name pattern broader than what
    `module/`'s own bucket needs -- a pattern that also happens to match some
    OTHER bucket already in this account is a real security defect, not a
    convenience, even if nothing in this task's own harness would ever notice.
    A policy that only "works" because it grants far more than it needs is not
    a correct solution to this task, regardless of what the harness reports.

    Write `/logs/agent/agent-output.json` (see the JSON contract below)
    recording both roles' real ARNs and the external-ID value you chose, so the
    harness (and your own re-runs of it) can find and use them.

    Do NOT delete the two roles or the module's resources when you are done --
    leave them running. Cleanup of this account is handled automatically by the
    benchmark itself once grading is complete; it is not part of your task.
  placeholders: []
  per_arm:
    awscdk:
      language_line: Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs (iam.Role,
        iam.PolicyStatement, iam.Policy/role.attachInlinePolicy). Deploy for real with `npx cdk deploy`.
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdk.out/ScenarioStack.template.json
        build_command: npm run build
        synth_command: npx cdk synth --no-lookups --quiet -o cdk.out
        json_fields: &id001
        - name: deployer_role_arn
          description: the real ARN of the deployer role you created, e.g. arn:aws:iam::123456789012:role/cdktn-bench-task/iam-e2e-role-deployer
        - name: workload_role_arn
          description: the real ARN of the workload role you created, e.g. arn:aws:iam::123456789012:role/cdktn-bench-task/iam-e2e-role-workload
        - name: external_id
          description: the sts:ExternalId value you chose and put in both roles' trust policy conditions
    hcl_raw:
      language_line: Author this as hand-written Terraform HCL (no modules). Deploy for real with `terraform
        apply`.
      output_contract:
        entry_file: main.tf
        artifact_path: plan.json
        plan_command: terraform init && terraform validate && terraform plan -refresh=false -out=plan.tfplan
          && terraform show -json plan.tfplan > plan.json
        json_fields: *id001
    terraconstructs:
      language_line: Author this using terraconstructs (TypeScript) L2 constructs (iam.Role, iam.PolicyStatement),
        synthesized via cdktn. Deploy for real with `terraform apply` against the synthesized stack.
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdktf.out/stacks/iam-e2e-role/plan.json
        synth_command: npx cdktn synth
        json_fields: *id001
seeded_files:
- path: module/main.tf
  content: |
    # module/main.tf
    #
    # FIXED, SEEDED Terraform module for the iam-e2e-role scenario. Byte-identical
    # across all three arms and NEVER edited by the agent -- the agent authors
    # only the deployer role and the workload role, in its own arm-specific
    # substrate (main.tf / lib/scenario-stack.ts at the workspace root), never
    # here. This directory is a separate, read-only tree (seeded_files, chmod
    # 0o444) the agent's own harness/validate.sh applies on the agent's behalf.
    #
    # Applied under the AGENT-AUTHORED deployer role's ASSUMED credentials (via
    # `aws sts assume-role`, see harness/validate.sh) -- never under the agent's
    # own base credentials directly, and never against real AWS credentials
    # belonging to anyone but the dedicated benchmark account.
    #
    # Every module-owned resource name is fixed except the S3 bucket and
    # security group, which take a harness-generated trial_id suffix because
    # S3 bucket names are unique across ALL of AWS, not just this account.

    terraform {
      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = ">= 5.0"
        }
      }
    }

    provider "aws" {
      region = "us-east-1"
      default_tags {
        tags = {
          Project  = "cdktn-bench"
          Scenario = "iam-e2e-role"
          TrialId  = var.trial_id
        }
      }
    }

    variable "trial_id" {
      type        = string
      description = "Harness-generated per-invocation suffix (see harness/validate.sh) -- used ONLY to keep the S3 bucket name and security group name collision-free across repeated trials. Never chosen by the agent."
    }

    variable "workload_role_name" {
      type        = string
      description = "Name (not ARN) of the IAM role the agent authored as the workload role (fixed name iam-e2e-role-workload, path /cdktn-bench-task/ -- see the instruction). This module creates ONLY the EC2 instance profile that wraps it; it does not create the role itself, and does not grant it any permissions -- that is entirely the agent's own deliverable."
    }

    variable "extra_bucket_enabled" {
      type        = bool
      default     = true
      description = "Mirrors the real episode's tfmigrate_enabled module flag. ON by default -- the scratch bucket (and its non-obvious refresh reads) is always in scope for this scenario."
    }

    data "aws_caller_identity" "current" {}

    data "aws_vpc" "default" {
      default = true
    }

    data "aws_kms_alias" "cdktn_bench" {
      name = "alias/cdktn-bench-iam-e2e-role"
    }

    # The pre-provisioned, PLAIN (non-secret) SSM parameter under the shared
    # fixture path. Read as a data source (NOT created here) so the plan/apply
    # this module runs exercises the DEPLOYER role's own ssm:GetParameter
    # permission on a resource it does not own -- deliberately the same shape
    # as the real episode's `data "aws_route53_zone"` (a data-source read on a
    # pre-existing resource with its own IAM surface), just on SSM instead of
    # Route53. See specs/iam-e2e-role.yaml's own Route53-drop rationale for why
    # this substitution was made.
    data "aws_ssm_parameter" "app_config" {
      name = "/cdktn-bench-iam-e2e-role/app/config"
    }

    # ---------------------------------------------------------------------------
    # Reaches the real episode's A9: ec2:GetSecurityGroupsForVpc. Describe* does
    # NOT cover Get* -- the AWS provider calls this specific action while
    # refreshing a security group's VPC. Every other EC2 read in this module is
    # a plain Describe*, so this is the one naming-convention trap.
    #
    # ec2:GetSecurityGroupsForVpc is ALSO one of the many EC2 actions that does
    # not support resource-level permissions at all (must be granted on
    # Resource: "*") -- the same mechanical class Route53's GetChange exemplified
    # in the real episode. Kept deliberately for that reason -- see the
    # Route53-drop rationale in specs/iam-e2e-role.yaml.
    # ---------------------------------------------------------------------------
    resource "aws_security_group" "scratch" {
      name        = "cdktn-bench-iam-e2e-${var.trial_id}-sg"
      description = "cdktn-bench iam-e2e-role scratch security group"
      vpc_id      = data.aws_vpc.default.id

      egress {
        from_port   = 0
        to_port     = 0
        protocol    = "-1"
        cidr_blocks = ["127.0.0.1/32"]
      }
    }

    # ---------------------------------------------------------------------------
    # Reaches A8 on the EC2 side (a different KMS grant shape than SSM's) plus
    # C-1b's self-discovery angle (see harness/assertions.py). Standalone --
    # never attached to a running instance, since this reduced module has no
    # EC2 instance/ASG/AMI machinery at all (dropped deliberately, see
    # specs/iam-e2e-role.yaml's own module-reduction rationale).
    # ---------------------------------------------------------------------------
    resource "aws_ebs_volume" "scratch" {
      availability_zone = "us-east-1a"
      size              = 1
      encrypted         = true
      kms_key_id        = data.aws_kms_alias.cdktn_bench.target_key_arn

      tags = {
        Name = "cdktn-bench-iam-e2e-${var.trial_id}-scratch"
      }
    }

    # ---------------------------------------------------------------------------
    # Reaches A3: an S3 bucket behind a module flag (var.extra_bucket_enabled,
    # ON by default) plus the non-"GetBucket*" refresh reads that only match
    # explicitly-listed actions, never a wildcard.
    # ---------------------------------------------------------------------------
    resource "aws_s3_bucket" "scratch" {
      count  = var.extra_bucket_enabled ? 1 : 0
      bucket = "cdktn-bench-iam-e2e-${var.trial_id}-scratch"
    }

    resource "aws_s3_bucket_ownership_controls" "scratch" {
      count  = var.extra_bucket_enabled ? 1 : 0
      bucket = aws_s3_bucket.scratch[0].id
      rule {
        object_ownership = "BucketOwnerEnforced"
      }
    }

    resource "aws_s3_bucket_policy" "scratch" {
      count  = var.extra_bucket_enabled ? 1 : 0
      bucket = aws_s3_bucket.scratch[0].id
      policy = jsonencode({
        Version = "2012-10-17"
        Statement = [{
          Sid       = "DenyInsecureTransport"
          Effect    = "Deny"
          Principal = "*"
          Action    = "s3:*"
          Resource = [
            aws_s3_bucket.scratch[0].arn,
            "${aws_s3_bucket.scratch[0].arn}/*",
          ]
          Condition = {
            Bool = { "aws:SecureTransport" = "false" }
          }
        }]
      })
    }

    # ---------------------------------------------------------------------------
    # Reaches A7 (tag-on-create): creating an IAM Instance Profile while
    # `default_tags` is active silently ALSO requires iam:TagInstanceProfile --
    # CloudTrail never emits it as a separate event; it has to be reasoned
    # about, not replayed. This is the ONE IAM resource the module itself
    # creates -- it wraps the agent-authored workload role BY NAME. The role
    # itself, and everything it is permitted to do, is 100% agent-authored, in
    # the agent's own substrate; this module never grants the workload role
    # anything.
    # ---------------------------------------------------------------------------
    resource "aws_iam_instance_profile" "workload" {
      name = "cdktn-bench-iam-e2e-role-workload-profile"
      role = var.workload_role_name
    }

    output "security_group_id" {
      value = aws_security_group.scratch.id
    }

    output "volume_id" {
      value = aws_ebs_volume.scratch.id
    }

    output "bucket_name" {
      value = var.extra_bucket_enabled ? aws_s3_bucket.scratch[0].bucket : null
    }

    output "instance_profile_arn" {
      value = aws_iam_instance_profile.workload.arn
    }

    output "app_config_value" {
      value     = data.aws_ssm_parameter.app_config.value
      sensitive = true
    }
- path: harness/validate.sh
  content: |
    #!/usr/bin/env bash
    # harness/validate.sh -- the assume -> apply -> assert -> destroy loop.
    #
    # This is the harness the operator's own real episode ran by hand, six
    # times, over two days (docs/scenario-proposal-iam-e2e-role.md §2). Run it
    # yourself, from your own project workspace, AS MANY TIMES AS YOU NEED
    # while iterating on the two roles you author:
    #
    #   bash harness/validate.sh
    #
    # It reads /logs/agent/agent-output.json (deployer_role_arn,
    # workload_role_arn, external_id -- write this file, or update it, BEFORE
    # every run) and:
    #   1. assumes the deployer role (sts:AssumeRole with your external_id)
    #   2. terraform apply's the FIXED module/ directory under those credentials
    #      (revision 1)
    #   3. applies it a SECOND time with no config change (forces refresh-time
    #      reads, e.g. iam:ListRoleTags -- these only appear on a second apply,
    #      never the first)
    #   4. makes the harness's OWN direct AWS calls, still under the deployer
    #      identity (a test-harness call is not the same thing as a call the
    #      module's own HCL makes -- do not assume your deployer policy is
    #      complete just because `terraform apply` succeeded)
    #   5. assumes the workload role and runs harness/assertions.py under ITS
    #      credentials
    #   6. destroys everything it created, under the deployer identity, always
    #      (even on failure -- see the trap below)
    #
    # Every denial this script prints is real: a genuine AWS AccessDenied
    # against the account this task runs in, not a simulated or synthetic one.
    # Fix your role's policy and re-run. You have a limited number of iterations
    # for this whole task (see your own instruction for the exact budget) --
    # use `aws iam simulate-principal-policy` or read the denial's own action
    # name carefully before guessing broadly.
    #
    # module/ (this script's sibling) is READ-ONLY reference input -- do not
    # edit it. This script itself is also read-only reference input.
    set -euo pipefail

    AGENT_OUTPUT="${AGENT_OUTPUT:-/logs/agent/agent-output.json}"
    HARNESS_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    MODULE_DIR="$(cd "$HARNESS_DIR/../module" && pwd)"
    REGION="us-east-1"

    need() { command -v "$1" >/dev/null 2>&1 || { echo "FAIL: missing dependency '$1' -- this should already be in your image" >&2; exit 2; }; }
    need aws
    need terraform
    need jq
    need python3

    if [ ! -f "$AGENT_OUTPUT" ]; then
      echo "FAIL: $AGENT_OUTPUT does not exist yet." >&2
      echo "      Write deployer_role_arn, workload_role_arn, and external_id there first" >&2
      echo '      (a plain JSON object, e.g. {"deployer_role_arn": "...", "workload_role_arn": "...", "external_id": "..."})' >&2
      exit 1
    fi

    DEPLOYER_ROLE_ARN="$(jq -r '.deployer_role_arn // empty' "$AGENT_OUTPUT")"
    WORKLOAD_ROLE_ARN="$(jq -r '.workload_role_arn // empty' "$AGENT_OUTPUT")"
    EXTERNAL_ID="$(jq -r '.external_id // empty' "$AGENT_OUTPUT")"

    for v in DEPLOYER_ROLE_ARN WORKLOAD_ROLE_ARN EXTERNAL_ID; do
      val="${!v}"
      if [ -z "$val" ]; then
        echo "FAIL: $AGENT_OUTPUT is missing a non-empty '${v,,}' field (case-sensitive JSON keys: deployer_role_arn, workload_role_arn, external_id)" >&2
        exit 1
      fi
    done

    WORKLOAD_ROLE_NAME="${WORKLOAD_ROLE_ARN##*/}"
    # harness-generated, NOT agent-chosen -- only exists to keep the S3 bucket
    # name and security group name collision-free across repeated runs of this
    # same script within your own iteration loop.
    TRIAL_ID="$(date -u +%Y%m%d%H%M%S)-$$"

    echo "== phase 1: assume the deployer role ($DEPLOYER_ROLE_ARN) =="
    CREDS_JSON="$(mktemp)"
    if ! aws sts assume-role \
          --role-arn "$DEPLOYER_ROLE_ARN" \
          --role-session-name "iam-e2e-role-deployer-${TRIAL_ID}" \
          --external-id "$EXTERNAL_ID" \
          --duration-seconds 3600 \
          --region "$REGION" \
          --output json > "$CREDS_JSON" 2>/tmp/assume_deployer.err; then
      echo "FAIL: could not assume the deployer role." >&2
      cat /tmp/assume_deployer.err >&2
      echo "      Check: (a) the role's trust policy Principal and its Condition on sts:ExternalId," >&2
      echo "             (b) that YOUR OWN credentials are allowed sts:AssumeRole on this specific role ARN." >&2
      exit 1
    fi

    export AWS_ACCESS_KEY_ID; AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' "$CREDS_JSON")"
    export AWS_SECRET_ACCESS_KEY; AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' "$CREDS_JSON")"
    export AWS_SESSION_TOKEN; AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' "$CREDS_JSON")"
    export AWS_DEFAULT_REGION="$REGION"
    rm -f "$CREDS_JSON"

    cleanup() {
      echo "== cleanup: terraform destroy (deployer credentials) =="
      export AWS_DEFAULT_REGION="$REGION"
      ( cd "$MODULE_DIR" && terraform destroy -auto-approve -input=false \
          -var "trial_id=$TRIAL_ID" -var "workload_role_name=$WORKLOAD_ROLE_NAME" ) || \
        echo "WARNING: destroy did not exit cleanly -- check for orphaned resources tagged TrialId=$TRIAL_ID" >&2
      unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_DEFAULT_REGION || true
    }
    trap cleanup EXIT

    echo "== phase 2: terraform apply the seeded module/ (revision 1) =="
    ( cd "$MODULE_DIR" && terraform init -input=false -reconfigure )
    ( cd "$MODULE_DIR" && terraform apply -auto-approve -input=false \
        -var "trial_id=$TRIAL_ID" -var "workload_role_name=$WORKLOAD_ROLE_NAME" )

    echo "== phase 3: a second, no-op apply (forces refresh-time reads) =="
    ( cd "$MODULE_DIR" && terraform apply -auto-approve -input=false \
        -var "trial_id=$TRIAL_ID" -var "workload_role_name=$WORKLOAD_ROLE_NAME" )

    echo "== phase 4: the HARNESS's own AWS calls, still under the deployer identity =="
    # Deliberately a call the harness makes directly, never a call module/'s own
    # HCL triggers -- the real episode's own such call was ssm:GetInventory (a
    # terratest poll, not a provider call); this scenario's own analogue is
    # ec2:DescribeVolumeStatus. A policy that only covers what `terraform plan`
    # and `terraform apply` themselves need can still fail here.
    VOLUME_ID="$(cd "$MODULE_DIR" && terraform output -raw volume_id)"
    if ! aws ec2 describe-volume-status --volume-ids "$VOLUME_ID" --region "$REGION" >/dev/null 2>/tmp/dvs.err; then
      echo "FAIL: deployer role denied ec2:DescribeVolumeStatus (a HARNESS-level call -- see this script's phase 4 comment)." >&2
      cat /tmp/dvs.err >&2
      exit 1
    fi

    echo "== phase 5: assertions under the WORKLOAD role =="
    WORKLOAD_CREDS_JSON="$(mktemp)"
    # NOTE: this uses the DEPLOYER's own (still-exported) credentials as the
    # CALLER of sts:AssumeRole -- the deployer role therefore also needs
    # sts:AssumeRole on the workload role for this phase to run at all. If your
    # deployer role does not need to assume the workload role for any other
    # reason, scope this permission narrowly to the workload role's own ARN.
    if ! aws sts assume-role \
          --role-arn "$WORKLOAD_ROLE_ARN" \
          --role-session-name "iam-e2e-role-workload-${TRIAL_ID}" \
          --external-id "$EXTERNAL_ID" \
          --duration-seconds 900 \
          --region "$REGION" \
          --output json > "$WORKLOAD_CREDS_JSON" 2>/tmp/assume_workload.err; then
      echo "FAIL: could not assume the workload role." >&2
      cat /tmp/assume_workload.err >&2
      echo "      Check the workload role's OWN trust policy -- it must trust the account root under the SAME external_id, in addition to ec2.amazonaws.com, for this harness to be able to test it directly (there is no running EC2 instance in this task)." >&2
      exit 1
    fi

    (
      export AWS_ACCESS_KEY_ID; AWS_ACCESS_KEY_ID="$(jq -r '.Credentials.AccessKeyId' "$WORKLOAD_CREDS_JSON")"
      export AWS_SECRET_ACCESS_KEY; AWS_SECRET_ACCESS_KEY="$(jq -r '.Credentials.SecretAccessKey' "$WORKLOAD_CREDS_JSON")"
      export AWS_SESSION_TOKEN; AWS_SESSION_TOKEN="$(jq -r '.Credentials.SessionToken' "$WORKLOAD_CREDS_JSON")"
      export AWS_DEFAULT_REGION="$REGION"
      python3 "$HARNESS_DIR/assertions.py"
    )
    ASSERT_STATUS=$?
    rm -f "$WORKLOAD_CREDS_JSON"
    if [ "$ASSERT_STATUS" -ne 0 ]; then
      echo "FAIL: workload-role assertions failed -- see output above." >&2
      exit 1
    fi

    echo "== ALL PHASES PASSED: deployer role can apply+destroy the module; workload role can read what it needs =="
- path: harness/assertions.py
  content: |
    #!/usr/bin/env python3
    """harness/assertions.py -- runs ONLY under the WORKLOAD role's assumed
    credentials (harness/validate.sh phase 5). stdlib + the `aws` CLI v2 only --
    no boto3, matching every arm image's documented "python3 stdlib only, no
    pip package ever installed" baseline (see each arm's own Dockerfile).

    Two checks. Both must pass for the workload role's policy to be considered
    correct by this harness:

      1. ssm get-parameters-by-path --with-decryption over the pre-provisioned
         fixture path, WITH DECRYPTION, must return BOTH parameters under it --
         the plain "config" one AND the SecureString "db-password" one,
         decrypted. ssm:GetParameter/ssm:GetParameters alone (what an L2
         grantRead()-style call derives on every library checked for this
         scenario) is not sufficient by itself for either half of this: the
         PATH read needs ssm:GetParametersByPath specifically, and the
         SecureString half additionally needs kms:Decrypt (with a
         kms:ViaService=ssm.<region>.amazonaws.com condition) on the
         pre-provisioned CMK.

      2. ec2:DescribeVolumes with a Name-tag filter -- a stand-in for the
         self-discovery call a real EC2 instance's own cloud-init would make to
         find "its own" attached volume by tag. This reduced module has no real
         EC2 instance to boot, so the harness makes this call directly under
         the workload role's own credentials instead.
    """
    from __future__ import annotations

    import json
    import subprocess
    import sys

    APP_PATH_PREFIX = "/cdktn-bench-iam-e2e-role/app/"
    EXPECTED_PARAM_NAMES = {APP_PATH_PREFIX + "config", APP_PATH_PREFIX + "db-password"}


    def run_aws(*args: str) -> tuple[int, str, str]:
        result = subprocess.run(
            ["aws", *args, "--output", "json"],
            capture_output=True,
            text=True,
            timeout=30,
        )
        return result.returncode, result.stdout, result.stderr


    def check_parameters_by_path() -> str | None:
        code, out, err = run_aws(
            "ssm", "get-parameters-by-path", "--path", APP_PATH_PREFIX, "--with-decryption"
        )
        if code != 0:
            return f"ssm get-parameters-by-path denied or failed: {err.strip()}"
        try:
            params = json.loads(out).get("Parameters", [])
        except json.JSONDecodeError:
            return f"ssm get-parameters-by-path returned non-JSON output: {out[:200]!r}"
        names = {p.get("Name") for p in params}
        missing = EXPECTED_PARAM_NAMES - names
        if missing:
            return (
                f"ssm get-parameters-by-path did not return: {sorted(missing)} "
                "(the SecureString parameter missing suggests kms:Decrypt with "
                "kms:ViaService=ssm.*.amazonaws.com is not granted; either "
                "parameter missing suggests ssm:GetParametersByPath itself is "
                "not granted, or the resource scope does not cover this path)"
            )
        for p in params:
            if p.get("Name") == APP_PATH_PREFIX + "db-password" and not p.get("Value"):
                return "the SecureString parameter was returned but its Value is empty -- decryption likely failed silently"
        return None


    def check_volume_self_discovery() -> str | None:
        code, out, err = run_aws(
            "ec2", "describe-volumes",
            "--filters", "Name=tag:Name,Values=cdktn-bench-iam-e2e-*",
        )
        if code != 0:
            return f"ec2 describe-volumes denied or failed: {err.strip()}"
        return None


    def main() -> int:
        failures = [msg for msg in (check_parameters_by_path(), check_volume_self_discovery()) if msg]
        report = {"pass": not failures, "failures": failures}
        print(json.dumps(report, indent=2))
        return 0 if report["pass"] else 1


    if __name__ == "__main__":
        raise SystemExit(main())
catches:
- name: admin-wildcard-policy
  taxonomy: nested-attribute
  description: |-
    Either role's policy grants a bare `Action: "*"` or a full-service
    wildcard action of the exact form `service:*` (e.g. `iam:*`, `ec2:*`,
    `s3:*`, `ssm:*`, `kms:*`). Sub-service wildcards (e.g. `s3:GetBucket*`) are
    NOT this catch -- those are permitted and appear in the reference
    solution itself. This is the baseline anti-gaming check: without it, the
    whole scenario is won in one iteration by granting everything.
  predicted_tier_caught:
    awscdk: '0'
    hcl: '0'
    terraconstructs_override: null
- name: invalid-action-name
  taxonomy: typed-value-trap
  description: |-
    Either role's policy contains an action string that is not a real IAM
    action for the services this task touches -- syntactically well-formed,
    silently accepted by IAM at deploy time, and never matches anything at
    evaluation time. The real-world version of this mistake is confusing a
    CloudTrail event name with the IAM action name that actually authorizes
    it (they diverge for several services this task touches).
  predicted_tier_caught:
    awscdk: '0'
    hcl: '0'
    terraconstructs_override: null
- name: wildcard-matches-protected-bucket
  taxonomy: nested-attribute
  description: |-
    The deployer role's policy grants an S3 action with a `Resource` pattern
    that is broader than `module/`'s own bucket needs -- broad enough that it
    also matches a DIFFERENT bucket already present in this account, one this
    task's own module never creates or references. Derived correctly from the
    module's own naming convention, this is not a denial an agent would ever
    see: nothing in this task's own harness exercises the other bucket, so a
    policy with this mistake still reports full success. It is a silent
    over-grant, not a failure.
  predicted_tier_caught:
    awscdk: '1'
    hcl: '1'
    terraconstructs_override: null
- name: trust-policy-unconditional
  taxonomy: nested-attribute
  description: |-
    Either role's trust policy trusts a wildcard principal (`"*"`), or trusts
    the account root without the `sts:ExternalId` condition the instruction
    asks for. This is checkable directly from the delivered trust policy
    document, independent of whether the role happens to work when the
    harness assumes it with the right external ID.
  predicted_tier_caught:
    awscdk: '0'
    hcl: '0'
    terraconstructs_override: null
- name: missing-kms-for-securestring
  taxonomy: graph-dependency
  description: |-
    The workload role's policy can read the plain SSM parameter under the
    fixed fixture path but cannot decrypt the SecureString parameter under the
    same path, because it never grants `kms:Decrypt` (scoped by a
    `kms:ViaService` condition on the SSM service) on the pre-provisioned
    customer-managed key. Every static tier -- including the tier-1 checks
    above -- passes this policy identically to a fully correct one: nothing
    about a missing KMS grant is visible from the policy's own shape, only
    from actually trying to read the encrypted value.
  predicted_tier_caught:
    awscdk: live
    hcl: live
    terraconstructs_override: null
  applies_to:
  - hcl_raw
- name: getparametersbypath-not-granted
  taxonomy: anti-L2
  description: |-
    The workload role's policy grants single-parameter reads
    (`ssm:GetParameter`/`ssm:GetParameters`) but not the hierarchical
    path-based read the harness's own checks actually use. This is the
    scenario's deliberate anti-overclaim catch: an agent who authors this
    role's permissions by calling an SDK/CDK/terraconstructs helper method
    that is documented as "grants read access to a parameter" -- without
    independently checking exactly which four SSM actions that helper method
    covers -- reproduces this exact gap, on every arm, because none of the
    libraries available in this benchmark's arms grant the path-based read
    action from that kind of helper call.
  predicted_tier_caught:
    awscdk: live
    hcl: live
    terraconstructs_override: null
- name: missing-tag-on-create
  taxonomy: nested-attribute
  description: |-
    The deployer role's policy grants `iam:CreateInstanceProfile` (needed for
    `module/`'s own instance-profile resource) but not `iam:TagInstanceProfile`
    -- and every resource this module creates is tagged by the provider's own
    default-tags mechanism. This specific pairing never appears as two
    separate entries in anything an agent could observe by watching API
    calls; it has to be reasoned about from how tagging-on-create actually
    works, not read off a list of calls that were made.
  predicted_tier_caught:
    awscdk: live
    hcl: live
    terraconstructs_override: null
oracle:
  intent: |-
    Exactly two IAM roles exist in the FINAL delivered artifact: one named
    `iam-e2e-role-deployer` and one named `iam-e2e-role-workload`, both under
    IAM path `/cdktn-bench-task/`. Neither role's trust policy trusts a
    wildcard principal; both trust this account's root principal gated by an
    `sts:ExternalId` condition (the deployer additionally may trust nothing
    else; the workload additionally trusts `ec2.amazonaws.com`). Neither
    role's permissions policy grants a bare `Action: "*"` or a full-service
    wildcard action (`service:*`); every granted action is a real IAM action
    for one of this task's services (ec2, iam, kms, s3, ssm, sts
    -- see the pinned action catalogue in this scenario's tier-0 check for the
    exact allowed set); no granted S3 `Resource` pattern is broad enough to
    match `cdktn-bench-iam-e2e-tfstate-<account>-us-east-1` (a pre-provisioned
    bucket this task's own module never creates or references).

    This oracle grades the FINAL delivered policy documents' STATIC shape
    only -- the two properties above (no admin wildcards, no invalid actions,
    no wildcard-trust, no over-broad bucket scope) are exactly and only what a
    synth/plan artifact can express. Whether the two roles actually WORK --
    whether a real `terraform apply`+`destroy` of module/ succeeds under the
    deployer role, and whether the workload role can actually read what a
    real workload needs -- is a runtime fact no static artifact can express;
    it is checked instead by harness/validate.sh (via this scenario's
    hand-authored live check, SCHEMA.md §5 verifier.live_check), which is
    GATING for this scenario (three of this scenario's catches are
    predicted_tier_caught: "live" by construction -- see missing-kms-for-securestring,
    getparametersbypath-not-granted, and missing-tag-on-create above; a
    non-gating live check would mean none of those three could ever cost a
    real trial any reward).

    Known, deliberate scope decision (see specs/iam-e2e-role.yaml's own
    DECISIONS.md amendment for the full reasoning): a policy that passes every
    static tier here is NOT thereby proven correct -- the static tiers prove
    "not obviously over-permissioned"; only the live check proves "actually
    works with exactly what was granted." Neither property alone is
    sufficient; both are required, deliberately, so that a wildcard-admin
    policy (defeats the live check's own purpose by trivially passing it,
    were it the only gate) is still rejected by the static tiers, and a
    narrowly-scoped-but-incomplete policy (passes every static tier) is still
    rejected by the live check.
  structural_asserts:
  - name: deployer-role-exists
    description: An IAM role named exactly iam-e2e-role-deployer exists.
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Role')].Properties.RoleName
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.name
    op: contains
    expected: iam-e2e-role-deployer
  - name: workload-role-exists
    description: An IAM role named exactly iam-e2e-role-workload exists.
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Role')].Properties.RoleName
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.name
    op: contains
    expected: iam-e2e-role-workload
  - name: trust-not-wildcard-principal
    description: |-
      THE trust-policy-unconditional catch, half 1: no AssumeRolePolicyDocument
      statement, on either role, has a bare Principal of "*".
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Role')].Properties.AssumeRolePolicyDocument.Statement[?(@.Principal=='*')]
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.assume_role_policy|fromjson.Statement[?(@.Principal=='*')]
    op: not_exists
  - name: trust-has-external-id-condition
    description: |-
      THE trust-policy-unconditional catch, half 2: at least one
      AssumeRolePolicyDocument statement, somewhere across both roles, carries a
      Condition.StringEquals block (a weak, existence-only proxy: it checks
      that A StringEquals condition is present somewhere, not specifically
      that its key is sts:ExternalId nor that each role has its own --
      the jsonpath_jq translator this generator uses does not support
      bracket-quoted keys containing a colon; see rego_hints for the
      stronger, per-role, key-specific version a tier-1 policy adds).
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Role')].Properties.AssumeRolePolicyDocument.Statement[*].Condition.StringEquals
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role')].values.assume_role_policy|fromjson.Statement[*].Condition.StringEquals
    op: exists
  - name: no-full-service-wildcard-actions
    description: |-
      THE admin-wildcard-policy catch: no granted Action, across either role's
      policy, is the bare string "*" or a full-service wildcard of the exact
      form "service:*". Sub-service wildcards (e.g. s3:GetBucket*) are
      permitted and are not matched by this pattern.
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Policy')].Properties.PolicyDocument.Statement[*].Action
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role_policy')].values.policy|fromjson.Statement[*].Action
    op: not_regex
    expected: ^(\*|[a-zA-Z0-9-]+:\*)$
  - name: actions-are-real-iam-actions
    description: |-
      THE invalid-action-name catch: every granted action, across either role's
      policy, is a member of this scenario's pinned action catalogue (built
      from the reference solutions' own action lists -- the exact set of real
      IAM actions this task's module and harness can ever need). Any invented,
      misremembered, or CloudTrail-event-name-instead-of-IAM-action-name string
      fails this check by not being in the list.
    tier: '0'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Policy')].Properties.PolicyDocument.Statement[*].Action
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role_policy')].values.policy|fromjson.Statement[*].Action
    op: in
    expected:
    - sts:GetCallerIdentity
    - sts:AssumeRole
    - ec2:Describe*
    - ec2:DescribeVolumeStatus
    - ec2:GetSecurityGroupsForVpc
    - ec2:DescribeVolumes
    - ec2:DescribeInstances
    - ec2:CreateSecurityGroup
    - ec2:DeleteSecurityGroup
    - ec2:AuthorizeSecurityGroupEgress
    - ec2:RevokeSecurityGroupEgress
    - ec2:AuthorizeSecurityGroupIngress
    - ec2:RevokeSecurityGroupIngress
    - ec2:CreateTags
    - ec2:DeleteTags
    - ec2:CreateVolume
    - ec2:DeleteVolume
    - iam:CreateInstanceProfile
    - iam:DeleteInstanceProfile
    - iam:GetInstanceProfile
    - iam:AddRoleToInstanceProfile
    - iam:RemoveRoleFromInstanceProfile
    - iam:TagInstanceProfile
    - iam:UntagInstanceProfile
    - iam:ListInstanceProfilesForRole
    - iam:GetRole
    - iam:ListRoleTags
    - ssm:GetParameter
    - ssm:GetParameters
    - ssm:GetParametersByPath
    - ssm:DescribeParameters
    - kms:DescribeKey
    - kms:Decrypt
    - kms:GenerateDataKey
    - kms:GenerateDataKeyWithoutPlaintext
    - kms:CreateGrant
    - s3:CreateBucket
    - s3:DeleteBucket
    - s3:ListBucket
    - s3:GetBucket*
    - s3:PutBucket*
    - s3:DeleteBucketPolicy
    - s3:ListTagsForResource
    - s3:GetAccelerateConfiguration
    - s3:GetLifecycleConfiguration
    - s3:GetReplicationConfiguration
    - s3:GetEncryptionConfiguration
    - s3:PutEncryptionConfiguration
  - name: s3-resource-not-overbroad
    description: |-
      THE wildcard-matches-protected-bucket catch. Tier-1 SPEC only (see
      oracle.rego_hints/cfn_guard_hints for the actual glob-match logic this
      entry documents) -- points at every S3 Resource pattern granted by either
      role's policy; the hand-authored policy bundle below asserts none of them
      match the pre-provisioned decoy bucket's ARN,
      arn:aws:s3:::cdktn-bench-iam-e2e-tfstate-<account>-us-east-1.
    tier: '1'
    applies_to:
    - awscdk
    - hcl_raw
    - terraconstructs
    cfn_jsonpath: $.Resources[?(@.Type=='AWS::IAM::Policy')].Properties.PolicyDocument.Statement[*].Resource
    tf_jsonpath: $.planned_values.root_module.resources[?(@.type=='aws_iam_role_policy')].values.policy|fromjson.Statement[*].Resource
    op: exists
  rego_hints:
  - |-
    IAM-shape-coverage (same lesson as specs/_toy/toy-ssm-parameter.yaml's own rego_hints): inspect BOTH the standalone aws_iam_role_policy (inline) shape and an aws_iam_policy + aws_iam_role_policy_attachment shape identically; fail closed (deny) when an aws_iam_role exists but neither recognized policy shape appears anywhere in the plan for it.
  - |-
    deny if any Statement.Resource under an S3 action (Action starting with "s3:") glob-matches "arn:aws:s3:::cdktn-bench-iam-e2e-tfstate-*" via glob.match(resource_pattern, [], decoy_arn) -- decoy_arn is the fixed literal from oracles/iam-e2e-role/intent.md, NOT re-derived from input (the decoy bucket is a pre-provisioned fixture, never part of this plan).
  - |-
    stronger trust-policy check (optional, beyond this spec's own tier-0 existence-only proxy): deny if EITHER role's account-root-trusting statement (Principal.AWS present) lacks its own Condition.StringEquals["sts:ExternalId"], rather than only checking that the condition exists SOMEWHERE across both roles.
  cfn_guard_hints:
  - |-
    Same IAM-shape-coverage rule as rego_hints, applied to AWS::IAM::Policy / AWS::IAM::ManagedPolicy / inline Role.Properties.Policies[*] shapes (see specs/_toy/toy-ssm-parameter.yaml's own cfn_guard_hints for the three-shape pattern).
  - |-
    rule s3_resource_not_overbroad: no Statement.Resource under an S3 action equals the literal "arn:aws:s3:::cdktn-bench-iam-e2e-*" (WITHOUT a "-scratch" suffix) -- cfn-guard has no general glob-match builtin, so this is a literal-pattern denylist of the specific known-bad shape rather than rego's general glob.match, and is honestly weaker: a differently-shaped overbroad pattern (e.g. "cdktn-bench-*") would evade this specific rule while still being caught by the rego bundle. Documented as a known asymmetry in DECISIONS.md, not silently accepted as equal strictness.
  tier05_jsonata: null

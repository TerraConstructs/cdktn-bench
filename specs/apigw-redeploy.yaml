# specs/apigw-redeploy.yaml
#
# Slice G (2026-08-06). Design source: docs/apigw-redeploy-mechanics.md
# (verified mechanics), docs/slice-g-recon.md (generator/schema gap
# inventory), the apigw-openapi static sibling (specs/apigw-openapi.yaml).
# DECISIONS.md "Slice G" amendment records the schema/generator extensions
# this spec is the first (and, as of this writing, only) consumer of:
# verifier.live_check.enabled may now be true (spec_model.LiveCheck), a
# catch may restrict which arms need a broken/ fixture
# (spec_model.Catch.applies_to), and predicted_tier_caught may be "live"
# (a catch invisible to every static tier by construction, gated instead
# by gates/oracle_falsifiability.py's LIVE_ONLY_CONFIRMED_MARKER check --
# see that module's "live" branch).
#
# UNLIKE every other v1 scenario, this one tests a DAY-2 iteration: the
# agent must author + LIVE-deploy a real API Gateway REST API, and then --
# in a SECOND, separately-prompted step -- apply a change request and
# LIVE-redeploy it, against the dedicated benchmark account (886312446417,
# us-east-1 only -- see DECISIONS.md "Slice G" / CONTEXT). Each step's
# static tiers grade that step's delivered file; the live behavioral fact
# -- did the deploy actually serve? did the SECOND deploy actually serve
# the modification, or does the stage keep serving stale content -- is
# graded by each step's own hand-authored tests/live_check.py (GATING for
# this scenario, SCHEMA.md §5).
#
# MULTI-STEP as of 2026-08-20 (DECISIONS.md Amendment 27,
# docs/prompt-decomposition-audit.md). It used to be ONE prompt that
# narrated both days -- "Step 1 ... Step 2 -- apply the prescribed
# modification ... add ONE more route, `GET /status`, using a MOCK
# integration whose response is the fixed JSON body {...}". That is
# foreshadowing: an agent told about the change up front authors the
# three-route API in one pass and never performs a second deploy at all,
# so the redeploy-trigger trap this scenario exists for never fires. The
# instruction is now decomposed into `steps:` below -- step 01 has ZERO
# knowledge of /status, and step 02's prompt is delivered only after step
# 01 has verified green (min_reward hard gate, Amendment 26 §3).
#
# The old prompt ALSO named the trap outright ("A second deploy that does
# not actually create a new, live-serving deployment behind the stage ...
# is exactly the mistake this task exists to test for"). That paragraph is
# DELETED, not relocated: it is answer-key material, and it appears in
# neither step.
#
# STEP NAMES are deliberately generic ("01-initial-deploy",
# "02-change-request") rather than descriptive ("02-add-status-route").
# Step names live in task.toml and on disk -- host-side only, never
# uploaded to the agent's container -- but a name that spells out the
# day-2 change is one accidental log line or future feature away from
# being a leak, and costs nothing to avoid.
#
# WHO DEPLOYS: the AGENT, in BOTH steps. DECISIONS.md Amendment 26 §2
# makes the harness the default deployer (steps/<n>/pre_invoke), and this
# spec explicitly opts out -- no step declares `pre_invoke`. The deploy
# loop IS the measurement here (`triggers-incomplete-hash` is a
# predicted_tier_caught: "live" catch: only the AGENT's own second apply
# producing no new deployment discriminates it). Step 02 needs no harness
# action at all: Harbor keeps ONE container alive across every step
# (harbor/trial/multi_step.py::_run stops the environment once, after the
# loop) and uploads a step workdir only if steps/<n>/workdir/ exists,
# which the generator does not emit -- so step 02's agent opens the very
# workspace, terraform state and deployed stack its own step-01 self left
# behind. Full justification: docs/prompt-decomposition-audit.md §3.

id: apigw-redeploy
title: "API Gateway REST API: deploy, confirm, modify, re-deploy (day-2 iteration)"
# SCHEMA.md §0.1 -- REQUIRED on a multi-step spec. `title` above describes the
# whole two-step arc and is correct for the registry/task.toml metadata (host
# side, never uploaded to the agent). It must NOT be the header stamped into
# the arm skeletons, because environment/ IS the image the step-1 agent lives
# in: its very first `main.tf` / `scenario-stack.ts` would otherwise open with
# "modify, re-deploy (day-2 iteration)" and hand the agent the foreknowledge
# the redeploy-trigger trap exists to deny it (Amendment 26 §7 rule 2).
# Deliberately terminal: nothing here implies a second change is coming.
workspace_title: "API Gateway REST API (live)"
# AGENT-VISIBLE (SCHEMA.md §0.1), the NAME half of the same split
# `workspace_title` makes for the SENTENCE half. `id` above is operator-facing
# and may name the pitfall; this may not, because it is stamped into the
# terraconstructs arm's `new ScenarioStack(app, ...)` construct id and
# `gridUUID` -- and therefore into `cdktf.out/stacks/<id>/`, which the STEP-1
# agent sees in its own `npx cdktn synth` output and in preflight.sh.
#
# "apigw-redeploy" is step 2's verb. Amendment 27's foreshadowing sweep grepped
# the hyphenated "re-deploy" only, so the id sailed through every guard: it was
# in main.ts on one arm and in every arm's skeleton header
# ("from specs/apigw-redeploy.yaml"), while the step-1 prompt was clean.
#
# This value names the STEP-1 GOAL and nothing beyond it: a REST API serving
# GET /hello and GET /version, which is exactly what step 01's prompt asks for.
# Deliberately terminal -- nothing here implies a second change is coming.
workspace_id: hello-version-api
# This scenario's OWN foreshadowing vocabulary (SCHEMA.md §0.1), on top of the
# global deny-list. These are step 02's SUBSTANCE: the route it adds, the
# integration type it uses, and the resulting route count. None of them may
# appear on any surface a step-1 agent can read. Previously these lived only in
# generator/tests/test_multistep_emission.py::CONTENT_TOKENS; declared here they
# are reviewed in the same file as the decomposition they protect, and the
# generator-wide sweep (test_scenario_identity.py) picks them up automatically.
agent_deny_vocab:
  - /status
  - mockintegration
  - mock integration
  - mock-integration
  - '"routes": 3'
  - '"routes":3'
difficulty: 3
services: [apigateway, lambda, iam, logs]

arms:
  awscdk: true
  hcl_raw: true
  terraconstructs:
    enabled: true
    reason: >
      Same terraconstructs 0.2.13 compute.RestApi/Deployment mechanics
      apigw-openapi's own arms.terraconstructs.reason already verified
      (src/aws/compute/{restapi.ts,deployment.ts,method.ts} -- a
      line-for-line port of aws-cdk-lib's own automatic dependency +
      logical-id-salting wiring, docs/apigw-redeploy-mechanics.md §1/§2).
      compute.MockIntegration exists too (verified directly against the
      installed package at spec-authoring time,
      node_modules/terraconstructs/lib/aws/compute/integrations/mock.js),
      so the day-2 modification (add a MOCK /status route) is expressible
      the same way as on awscdk.

instruction:
  # SHARED across every step (SCHEMA.md §2.6): the parts of the prompt that
  # are true at every point in this scenario's life. The DAY-SPECIFIC work
  # lives in `steps:` below -- that split is the whole point of the
  # decomposition, so nothing here may name a route, an integration type, or
  # a revision.
  #
  # Note this body is NEVER delivered on its own: a multi-step task has no
  # root instruction.md (harbor/models/task/task.py sets Task.instruction=""
  # when [[steps]] is present). gen.py prepends each step's own shared_body
  # to it, so every step's prompt carries these standing constraints -- which
  # it must, because sessions are FRESH per step (Amendment 26 §1) and the
  # agent cannot be assumed to remember them.
  shared_body: |
    Standing constraints, in force for everything you do in this workspace:

    Write `/logs/agent/agent-output.json` (see the JSON contract below)
    recording the deployed stage's real invoke URL, so it can be
    independently re-checked afterward.

    Environment constraint: any IAM role your solution creates (for
    example, a Lambda function's execution role) must be created under
    the path `/cdktn-bench-task/` (e.g. `path = "/cdktn-bench-task/"` on a
    Terraform `aws_iam_role`, or `path: "/cdktn-bench-task/"` on a CDK/
    terraconstructs `iam.Role`) -- this account's deploy credentials only
    permit creating and passing roles under that path.

    Do NOT delete the REST API, the Lambda functions, their execution
    role, or any CloudWatch Logs log groups when you are done -- leave
    every resource you created running and deployed. This task's grading
    depends on re-checking your work against the live stage after your
    work ends, so tearing anything down yourself would erase the only
    evidence that your deploy took effect. Cleanup of this account is
    handled automatically by the benchmark itself once grading is
    complete; it is not part of your task.
  placeholders: []
  per_arm:
    awscdk:
      # NOTE the missing `MockIntegration`: this SPEC-level line used to
      # name it, which leaked the day-2 integration type into the day-1
      # prompt on this arm ALONE -- a foreshadowing defect AND an arm-parity
      # one (docs/prompt-decomposition-audit.md §2 "Leak 4"). Every step
      # below declares its own per-arm language line, so this one is only a
      # fallback; it is kept non-foreshadowing so it can never become the
      # leak again by a step forgetting to override it.
      language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs (apigateway.RestApi, LambdaIntegration). Deploy for real with `npx cdk deploy`."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdk.out/ScenarioStack.template.json
        build_command: "npm run build"
        synth_command: "npx cdk synth --no-lookups --quiet -o cdk.out"
        json_fields:
          - name: api_url
            description: "the deployed stage's real invoke URL, e.g. https://abc123.execute-api.us-east-1.amazonaws.com/prod/ (trailing slash)"
    hcl_raw:
      language_line: "Author this as hand-written Terraform HCL (no modules). Deploy for real with `terraform apply`."
      output_contract:
        entry_file: main.tf
        artifact_path: plan.json
        # -refresh=false (B3 fix, DECISIONS.md Slice G amendment): this
        # scenario's own working tree, unlike every other spec's, can
        # legitimately have already been REAL-applied by the agent's own
        # trial by the time this static tier runs offline against it
        # (tests/test.sh runs static_tiers.sh, then live_check.py, both
        # BEFORE the post-trial mutating reset tears anything down -- see
        # verifier.live_check.concurrency_mode below and DECISIONS.md).
        # The leftover terraform.tfstate names a real REST API/Lambda/IAM
        # role; a default (refreshing) `terraform plan` re-contacts AWS to
        # reconcile that state and 403s against this arm's own dummy
        # provider credentials (provider.tf's default, unset
        # cdktn_bench_live) -- a PERFECT solution would fail this offline
        # tier for a reason that has nothing to do with its own
        # correctness. `-refresh=false` makes the plan diff config against
        # the LOCAL cached state only, with zero AWS calls -- exactly what
        # an offline structural check needs, and a true no-op for every
        # OTHER spec's tier (whose working tree never has prior state to
        # begin with).
        plan_command: >-
          terraform init && terraform validate && terraform plan -refresh=false -out=plan.tfplan
          && terraform show -json plan.tfplan > plan.json
        json_fields:
          - name: api_url
            description: "the deployed stage's real invoke URL, e.g. https://abc123.execute-api.us-east-1.amazonaws.com/prod/ (trailing slash)"
    terraconstructs:
      language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn. Deploy for real with `terraform apply` against the synthesized stack."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdktf.out/stacks/hello-version-api/plan.json
        synth_command: "npx cdktn synth"
        json_fields:
          - name: api_url
            description: "the deployed stage's real invoke URL, e.g. https://abc123.execute-api.us-east-1.amazonaws.com/prod/ (trailing slash)"

seeded_files: []

catches:
  - name: deployment-missing-integration-dependency
    taxonomy: graph-dependency
    description: >
      The classic API Gateway deployment race (same catch family as
      apigw-openapi's own catch of this name, prereg §5): an
      AWS::ApiGateway::Deployment / aws_api_gateway_deployment resource
      created without an explicit dependency edge covering every route's
      method (CFN DependsOn / TF depends_on+triggers) can be provisioned
      before, or without ever picking up, some of the routes it is meant
      to deploy. Idiomatic L2 usage (RestApi.addResource/addMethod on
      awscdk/terraconstructs, or `depends_on`/`triggers` referencing every
      integration on hand-written HCL) makes this structurally impossible
      by construction -- reproduced here, like apigw-openapi's own fixture,
      by dropping to a manual escape hatch (a hand-constructed
      CfnDeployment/L1 Deployment resource that bypasses the L2's automatic
      wiring) on awscdk/terraconstructs, and by a hand-omitted `depends_on`
      entry on hcl_raw. Caught STRUCTURALLY (the dependency edge itself),
      never a live invoke/behavioral check.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null

  - name: stale-deployment-no-triggers
    taxonomy: graph-dependency
    description: >
      hcl_raw only (no meaningful equivalent on awscdk/terraconstructs --
      both L2 arms always compute SOME hash-salted trigger/logical-id
      automatically; there is no direct way to omit it short of the
      escape-hatch mistake `deployment-missing-integration-dependency`
      above already covers). The `aws_api_gateway_deployment` resource has
      NO `triggers` block at all -- `depends_on` is left CORRECT and
      complete, isolating this fixture to ONLY this catch (the existing
      `deployment-missing-integration-dependency` tier-1 depends_on-
      coverage check still finds every integration correctly listed and
      passes). Statically, single-artifact-catchable: the FINAL delivered
      main.tf's `aws_api_gateway_deployment.this` resource has no
      `triggers.redeployment` value at all (tier "0" existence check).
      LIVE consequence (docs/apigw-redeploy-mechanics.md §3/§6(c), not what
      this catch's own tier-0 check exercises, but the real-world failure
      this static fact predicts): Terraform only replaces a resource when
      one of ITS OWN arguments changes; with `triggers` gone, the only
      argument left (`rest_api_id`) never changes between revisions, so a
      real second `terraform apply` shows "0 to change" for the deployment
      and the stage keeps serving the OLD deployment -- `GET /status`
      404s/403s live despite `terraform apply` exiting 0.
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null
    applies_to: [hcl_raw]

  - name: triggers-incomplete-hash
    taxonomy: graph-dependency
    description: >
      hcl_raw only. The subtle sibling of stale-deployment-no-triggers:
      the `triggers.redeployment` block EXISTS, `depends_on` is complete
      and correct, but the hash's own input list is left FROZEN at
      revision 1's fields (hello/version only) when `/status` is added --
      "the operator forgot to extend the hash when adding a route", the
      single most realistic version of this footgun (the block still
      exists, still resolves to a real hex value, and a reviewer skimming
      the diff sees a `triggers = { redeployment = sha1(...) }` block was
      already there and assumes it is covered). Every static tier that
      grades only the FINAL delivered file passes IDENTICALLY to a correct
      solution (triggers exists, depends_on is complete, route count is
      3, MOCK integration is wired) -- catching this requires comparing
      the triggers hash ACROSS TWO REVISIONS, which no single-artifact
      static tier (this benchmark's v1 grading unit) can express by
      construction. This is the "live"-tier catch: only a live
      apply -> modify -> re-apply -> curl loop discriminates it
      (docs/apigw-redeploy-mechanics.md §6(c)) -- see
      gates/oracle_falsifiability.py's "live" branch and this catch's own
      broken/ fixture, which mechanically confirms (via two independent
      `terraform plan`s, no apply/AWS credentials needed) that the hash is
      identical across revisions, printing the shared
      LIVE_ONLY_CONFIRMED_MARKER, rather than merely asserting it.
    predicted_tier_caught:
      awscdk: "live"
      hcl: "live"
      terraconstructs_override: null
    applies_to: [hcl_raw]

oracle:
  intent: >
    Exactly one API Gateway REST API exists (named `apigw-redeploy-api`),
    implementing three routes in its FINAL delivered state: `GET /hello`
    and `GET /version`, each with an AWS_PROXY Lambda integration to a
    real Lambda function, and `GET /status`, with a MOCK integration
    (no Lambda) returning the fixed JSON body `{"status": "ok", "routes":
    3}`. The API's deployment resource depends on every route's method
    (CFN DependsOn / TF depends_on+triggers) -- it must not be constructed
    in a way that could provision before, or without ever picking up, any
    route. On hcl_raw and terraconstructs, the deployment resource also
    carries a non-null `triggers.redeployment` value -- TF's own
    redeploy-on-change mechanism (docs/apigw-redeploy-mechanics.md §1) --
    without which a second, real `terraform apply` is not guaranteed to
    create a new deployment when the route set changes (awscdk has no
    equivalent static fact to check: CDK's own logical-ID salting is
    unconditional and cannot be omitted by idiomatic L2 usage, only
    bypassed via the same escape hatch `deployment-missing-integration-
    dependency` already covers). The API is deployed to a stage named
    `prod`.

    Known v1 scope limitation, matching apigw-openapi's own documented
    limitation for a structurally identical reason: this oracle grades the
    FINAL delivered file only (the only artifact a real trial's verifier
    ever has). Whether the SECOND live deploy actually took effect --
    genuinely the entire point of this scenario -- is not a fact any
    single-artifact static tier can express; it is checked instead by
    tests/live_check.py (hand-authored, SCHEMA.md §5 verifier.live_check,
    non-gating but genuinely exercised for the first time in this
    benchmark) against the REAL resources the agent's own trial deployed.

  structural_asserts:
    - name: rest-api-exists
      description: "An API Gateway REST API resource exists."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::ApiGateway::RestApi')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_api_gateway_rest_api')]"
      op: exists

    - name: deployment-exists
      description: "An API Gateway deployment resource exists."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::ApiGateway::Deployment')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_api_gateway_deployment')]"
      op: exists

    - name: lambda-function-exists
      description: "At least one Lambda function exists to back /hello or /version."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::Lambda::Function')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_lambda_function')]"
      op: exists

    - name: proxy-integration-wired
      description: >
        At least one API Gateway method has an AWS_PROXY-type integration
        (backing /hello or /version).
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::ApiGateway::Method')].Properties.Integration.Type"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_api_gateway_integration')].values.type"
      op: contains
      expected: "AWS_PROXY"

    - name: mock-integration-wired
      description: >
        At least one API Gateway method has a MOCK-type integration
        (backing the day-2 /status route) -- proves the prescribed
        modification is present in the FINAL delivered file.
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::ApiGateway::Method')].Properties.Integration.Type"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_api_gateway_integration')].values.type"
      op: contains
      expected: "MOCK"

    - name: deployment-triggers-present
      description: >
        On the TF-shaped arms, the deployment resource's `triggers` map
        has a non-null `redeployment` value -- without this, a second real
        `terraform apply` is not guaranteed to create a new deployment
        when the route set changes (docs/apigw-redeploy-mechanics.md §1/§3;
        THE stale-deployment-no-triggers catch, above). Not applicable to
        awscdk: CFN has no `triggers` concept, and CDK's own logical-ID
        salting (the equivalent mechanism) is unconditional in idiomatic
        L2 usage -- see this assert's own applies_to.
      tier: "0"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_api_gateway_deployment')].values.triggers.redeployment"
      op: exists

    - name: deployment-depends-on-all-methods
      description: >
        THE PLANTED CATCH (deployment-missing-integration-dependency).
        Same shape as apigw-openapi's own assert of this name: a
        cardinality proxy on awscdk (cfn-guard: DependsOn length >= method
        count), full per-resource SET identity on the TF-shaped arms
        (Rego).
      tier: "1"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::ApiGateway::Deployment')].DependsOn"
      tf_jsonpath: "$.configuration.root_module.resources[?(@.type=='aws_api_gateway_deployment')].depends_on"
      op: exists

verifier:
  budget:
    max_iters: 8
  live_check:
    enabled: true
    module: "tests/live_check.py"
    hand_authored: true
    agent_role_name: "QALocalInvocationApplicationAdmin"
    concurrency_mode: "mutating"
    # GATING (fix-round-3, DECISIONS.md Slice G amendment): live is the
    # ONLY signal that can ever catch triggers-incomplete-hash (a
    # predicted_tier_caught: "live" catch by construction, see that
    # catch's own description above) -- leaving live_check non-gating for
    # THIS scenario would mean the catch this whole scenario exists to
    # motivate can never actually cost a real trial any reward.
    #
    # DEPLOY IDENTITY (DECISIONS.md Amendment 24, 2026-08-13). This is a
    # mutating scenario, so the agent runs as
    # `QALocalInvocationApplicationAdmin` (AdministratorAccess) -- exactly
    # how aws-bench runs its own mutation tasks. Reading aws-bench's IAM
    # story confirmed its model is BROAD power in a DISPOSABLE, SCP-guarded
    # account, not per-scenario least-privilege. The earlier bespoke,
    # minimally-scoped `QADeployApplicationRole` (apigateway/lambda/
    # path-scoped-iam/logs, + Amendment 19's scoped sts:AssumeRole) is
    # RETIRED: it deviated from the platform and created two hazards -- (1)
    # a too-tight deploy role turns harness permission gaps into fake AGENT
    # failures, and (2) it broke arm parity (Terraform on the scoped role
    # vs CDK's default synthesizer routing CloudFormation through the
    # AdministratorAccess bootstrap cfn-exec-role). Admin on a shared role
    # gives BOTH arms identical deploy authority, so a deploy failure means
    # the same thing in both. Safety is the disposable account + the
    # region-restriction and role-protection SCPs (both verified present
    # 2026-08-13) + reset, not narrow IAM. The path-/cdktn-bench-task/
    # pinning the reference solutions carry is now moot (admin needs no
    # path scope) but harmless, so it is left in place.
    #
    # gating: true is fail-closed on anything but a live_check.py outcome
    # of "pass". The deploy identity (QALocalInvocationApplicationAdmin)
    # already exists in the live account, so this scenario IS trial-runnable
    # -- the first live green (hcl-raw, reward 1.0) is on record (Amdt 23).
    # After changing qa_roles_stack.ts (retiring QADeployApplicationRole),
    # re-run `aws-bench env setup` before the next trial so the role set in
    # the account matches this source.
    gating: true

# --------------------------------------------------------------------------
# steps (SCHEMA.md §2.6) -- the no-foreshadowing decomposition.
#
# Read docs/prompt-decomposition-audit.md before editing either body. The
# ONE rule: step 01's prompt must contain no hint of step 02's intent. Not
# "/status", not "MOCK", not "you will later", not "for now", not a route
# COUNT that only makes sense if a third is coming.
# --------------------------------------------------------------------------
steps:
  - name: "01-initial-deploy"
    # HARD GATE (Amendment 26 §3) -- gen.py's default for a non-final step,
    # stated here anyway because it is load-bearing for this scenario
    # specifically: step 02 is a change request against a RUNNING API, and a
    # change request whose starting state was never actually deployed is not
    # a measurement of anything.
    min_reward: 1.0
    instruction:
      shared_body: |
        Build and deploy a REST API on Amazon API Gateway, for REAL, in
        this AWS account: named EXACTLY
        `apigw-redeploy-api`, with two routes -- `GET /hello` and
        `GET /version` -- each backed by its own Lambda function via a
        Lambda proxy integration (any inline/trivial handler body is fine;
        its exact response content is not graded, only that it returns
        HTTP 200). Deploy the API to a stage named `prod`.

        Actually run your toolchain's real deploy command against this
        account (not just synth/plan), and confirm by making real HTTP
        requests to the deployed stage that both `GET /hello` and
        `GET /version` return HTTP 200.
      per_arm:
        # Per-step, per-arm language lines (SCHEMA.md §2.6). Declared for
        # every arm at every step -- even where the text is identical to the
        # spec-level fallback -- so a reader auditing "what was this arm's
        # agent told at this step" reads it here rather than reconstructing
        # an inheritance chain.
        awscdk:
          language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs (apigateway.RestApi, LambdaIntegration). Deploy for real with `npx cdk deploy`."
        hcl_raw:
          language_line: "Author this as hand-written Terraform HCL (no modules). Deploy for real with `terraform apply`."
        terraconstructs:
          language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn. Deploy for real with `terraform apply` against the synthesized stack."
    oracle:
      # Every FINAL-state assert that is already true of revision 1. The one
      # deliberate omission is `mock-integration-wired`, whose own
      # description reads "backing the day-2 /status route" -- step-2 oracle
      # text by construction, so it lives ONLY in
      # steps/02-change-request/tests/ (Amendment 26 §7 rule 1).
      #
      # `deployment-triggers-present` IS included: a correct revision 1 on
      # the TF-shaped arms already carries triggers.redeployment (verified
      # against this scenario's own reference solutions' write_rev1), and
      # requiring it here is what makes step 01 a real gate rather than a
      # formality.
      structural_asserts:
        - rest-api-exists
        - deployment-exists
        - lambda-function-exists
        - proxy-integration-wired
        - deployment-triggers-present
        - deployment-depends-on-all-methods
      # Inherits verifier.live_check.{enabled,gating} = true/true. Step 01's
      # own tests/live_check.py (hand-authored, 2-route contract) is what
      # makes "deployed and serving" a gate rather than a claim -- without
      # it an agent could write perfect IaC, never deploy, pass step 01, and
      # reach a step-02 change request against an API that does not exist.
  - name: "02-change-request"
    instruction:
      shared_body: |
        This account already runs the REST API `apigw-redeploy-api`,
        deployed to its `prod` stage, serving `GET /hello` and
        `GET /version`. The source that produced it is in your workspace,
        exactly as it was left; read it before changing anything.

        Change request: add ONE more route, `GET /status`, using a MOCK
        integration (no Lambda) whose response is the fixed JSON body
        `{"status": "ok", "routes": 3}` for every request.

        Re-run your toolchain's real deploy command so the SAME stage
        (`prod`, same REST API) serves this new route too. Then confirm, by
        making real HTTP requests to that same deployed stage, that
        (a) `GET /status` returns HTTP 200 with exactly that JSON body,
        AND (b) `GET /hello` and `GET /version` still return HTTP 200 --
        the change must not regress the routes that already worked.
      per_arm:
        awscdk:
          language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs (apigateway.RestApi, LambdaIntegration, MockIntegration). Deploy for real with `npx cdk deploy`."
        hcl_raw:
          language_line: "Author this as hand-written Terraform HCL (no modules). Deploy for real with `terraform apply`."
        terraconstructs:
          language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn. Deploy for real with `terraform apply` against the synthesized stack."
    # FINAL step: `oracle.structural_asserts` is OMITTED, which SCHEMA.md
    # §2.6 requires -- the last step runs the FULL tier suite, so this

  #     must NAME `aws_lambda_function.ingest.arn`, which is only possible
  #     if the object-spelled locals were really read -- and removes
  #     reward.txt if that assertion fails, since the falsifiability gate
  #     grades on reward.txt alone and would ignore a bare non-zero exit.
  #     Verified BOTH ways by execution: it passes against the shipped
  #     library, and goes red against a library with the object clause
  #     removed (the deny reverts to "no `locals` block in any supplied .tf
  #     file defines local.arns.media_bucket" -- the false message).

  - name: two-notification-resources-for-one-bucket
    taxonomy: graph-dependency
    description: >
      THE PLAUSIBLE-WRONG SOLUTION (blueprint §9(c)'s own headline catch).
      Declares ONE `aws_s3_bucket_notification` per requirement --
      "upload" wiring the Lambda half, "delete_audit" wiring the SNS
      half -- both with `bucket = aws_s3_bucket.media.id`. This is the
      NATURAL shape when two tickets (Product, Compliance) arrive and are
      authored as two separate resources; it plans green and applies
      green (Terraform's own schema has no cross-resource uniqueness
      constraint on `bucket`), and the two resources silently fight over
      S3's single PutBucketNotificationConfiguration document on every
      subsequent apply -- exactly one requirement is ever live at a time,
      with no diagnostic anywhere (this file's own header comment,
      tfp-aws#501/#23951/#1715/#5299/#22147/#48509). Structurally
      UNREACHABLE on both typed arms: `bucket.addEventNotification`
      (awscdk) / `bucket.addEventNotification` (terraconstructs) both
      lazily create their own `BucketNotifications`/notifications
      construct exactly once per bucket (`createResourceOnce()`, this
      file's own header comment) -- a second call accumulates into the
      SAME resource, it cannot create a second one. Caught directly by
      exactly-one-notification-resource-per-bucket-tf: the path resolves
      to 2 nodes, and `eq`'s own "0 or >1 resolved nodes FAILS outright"
      rule (SCHEMA.md §4.2's op table) fails regardless of the two nodes'
      (identical) value.
    applies_to: [hcl_raw]
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null

  - name: sns-publish-not-permitted
    taxonomy: graph-dependency
    description: >
      Wires the topic notification (a single, correct
      `aws_s3_bucket_notification` with both `lambda_function` and `topic`
      blocks -- this catch is independent of the singleton mistake above)
      but never creates an `aws_sns_topic_policy` resource, NOR sets a
      `policy` argument directly on `aws_sns_topic` -- NEITHER accepted
      shape (point 6 of "oracle must tolerate/defend" above) is present. S3
      silently drops every publish attempt to the audit topic -- no error
      at plan time, apply time, or (without actively monitoring for
      missing audit events) ever. Structurally unreachable on awscdk
      through ordinary use: `s3n.SnsDestination.bind()`
      (aws-s3-notifications/lib/sns.ts, re-read directly at the pinned
      commit) unconditionally calls `this.topic.addToResourcePolicy(...)`
      the moment the topic is wired via the idiomatic
      `bucket.addEventNotification(EventType.OBJECT_REMOVED, new
      s3n.SnsDestination(topic))` call -- the honest option from
      blueprint §9(f)'s own risk note: dropped from applies_to rather than
      reproduced via a fabricated escape-hatch fixture. On awscdk, caught
      directly by sns-topic-policy-exists-cfn (tier 0, existence-only -- no
      graph-edge resolution needed, since a resource's mere PRESENCE,
      unlike its own attribute values, is never plan-time-unknown
      regardless of what it references). ROUND-2 FIX (this file's own
      VERIFIER-REJECTION FIX PASS header): on hcl_raw/terraconstructs the
      catching mechanism moved from tier 0 to tier 1 -- the old tier-0
      `sns-topic-policy-exists` assert could not OR the two accepted TF
      resource shapes together in one jsonpath op, so that fact now lives
      entirely in `sns-topic-policy-allows-s3-publish-tf`'s own Rego
      fail-closed rule (denies when BOTH `topic_policy_configs` and
      `inline_policy_topics` are empty -- see policy.rego's own header).
    applies_to: [hcl_raw, terraconstructs]
    predicted_tier_caught:
      awscdk: "0"
      hcl: "1"
      terraconstructs_override: null

  - name: only-one-of-the-two-events-wired
    taxonomy: nested-attribute
    description: >
      Wires the Product half only (upload -> transcode via the Lambda
      notification, correctly scoped) and never creates the SNS topic, its
      policy, or any ObjectRemoved notification entry at all -- the
      Compliance half of the ticket is dropped entirely. Reachable
      identically on every arm (omitting a whole second call/block is not
      gated by any type system or L2 auto-wiring the way the two catches
      above are). Caught directly by
      object-removed-notification-targets-a-topic (0 resolved nodes -- no
      topic block/TopicConfigurations entry exists anywhere in the
      artifact) and, redundantly, by sns-topic-exists (0 resolved nodes)
      -- both tier 0, the cheapest possible catch for "half the ticket was
      never attempted."
    predicted_tier_caught:
      awscdk: "0"
      hcl: "0"
      terraconstructs_override: null

  - name: lambda-permission-not-scoped-to-bucket
    taxonomy: graph-dependency
    description: >
      s3-lambda-log-retention's own s3-lambda-invoke-permission-scoped
      catch, reused verbatim (blueprint §9(c) tier-1 item 3: "the existing
      s3-lambda-log-retention rule"). Both requirements are otherwise wired
      correctly (single authoritative notification resource, SNS half
      fully correct including its topic policy), but the Lambda
      resource-based permission grants principal s3.amazonaws.com with NO
      SourceArn, or with a hardcoded/wildcard literal one -- account-wide,
      or tied to a bucket this stack does not create, either way not scoped
      to this scenario's bucket. Passes lambda-permission-principal-is-s3
      (tier 0 -- principal is correct); fails
      lambda-permission-scoped-to-bucket-{cfn,tf} alone (tier 1) on EVERY
      enabled arm, for EVERY spelling -- each one re-proved by execution,
      never asserted, and each shipped as a fixture so it stays proved:
      the omitted-SourceArn spelling is this catch's own broken/ fixture
      on each arm; the hardcoded-literal spelling is the extra fixture
      `lambda-permission-scoped-to-a-different-bucket` (all three arms,
      round 7); the interpolated-literal spelling -- the same unrelated
      bucket name behind `cdk.Fn.sub` on awscdk, behind a
      `data.aws_partition` interpolation on hcl_raw -- is
      `lambda-permission-scoped-via-an-interpolated-literal` (round 10);
      and the wrong-resource spelling reached through the arm's ordinary
      DRY hoist is `lambda-permission-scoped-to-the-topic-arn-behind-a-
      local` (round 10), joined at round 12 by
      `lambda-permission-scoped-to-the-lambdas-own-arn-behind-a-local`
      (the same defect with the wrong resource being the Lambda ITSELF
      rather than the audit topic -- a shape round 11's topic-only
      provenance test could not see, and which scored 1.0 on hcl_raw
      against 0.0 on awscdk until round 12 made the acceptance positive).
      Three of those five sentences were FALSE when
      first written, and each was fixed by widening the rule rather than
      narrowing the claim: before round 7 awscdk's rule was a bare
      SourceArn presence check (the hardcoded-literal variant scored 1.0
      there and 0.0 on hcl_raw), and before round 10 it was a cfn-guard
      approximation that could not read an `Fn::Sub` (the interpolated
      variant scored 1.0 there and 0.0 on hcl_raw) while hcl_raw's own
      `local.`/`var.` tolerance let the wrong-resource variant score 1.0
      there and 0.0 on awscdk; and before round 12 that same tolerance let
      ANY wrong-type resource ARN behind a local score 1.0 on hcl_raw
      against 0.0 on awscdk, because rounds 10-11 had only taught it about
      TOPIC-ARN slots and about laundered literals.
      Reachable on hcl_raw/terraconstructs by simply omitting `source_arn`
      when hand-authoring the permission resource (no compiler/schema nudge
      forces it), or by pasting an ARN string. Reachable on awscdk too,
      same as its s3-lambda-log-retention precedent:
      `s3n.LambdaDestination` always scopes correctly, so these fixtures
      bypass it with a minimal custom `IBucketNotificationDestination` that
      wires the event without ever calling `fn.addPermission()`, then
      separately (and deliberately) author an unscoped/mis-scoped
      `lambda.CfnPermission` -- reproducing what an agent hand-rolling the
      permission (or reaching for the L1 escape hatch) would produce, not a
      contrived shape unique to these fixtures.
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null

  - name: sns-topic-policy-not-scoped-to-bucket
    taxonomy: graph-dependency
    description: >
      The SNS-side mirror of lambda-permission-not-scoped-to-bucket, on the
      STANDALONE `aws_sns_topic_policy` shape. Both requirements are
      otherwise wired correctly (single authoritative notification
      resource, Lambda half fully correct including its scoped permission),
      and an `aws_sns_topic_policy` resource DOES exist (so the "some
      policy-bearing shape exists" fail-closed check passes -- ROUND-2, now
      part of sns-topic-policy-allows-s3-publish-tf's own Rego, see this
      file's own VERIFIER-REJECTION FIX PASS header) -- but its policy
      document grants `sns:Publish` to `s3.amazonaws.com` with NO
      `aws:SourceArn`-conditioned scoping at all (or one hardcoded to an
      unrelated ARN), so the policy is either wide open to ANY bucket in
      the account or defeated by pointing at the wrong one. Fails
      sns-topic-policy-allows-s3-publish-tf's own bucket-reference clause
      alone (tier 1). ROUND-9: a THIRD spelling of the same defect ships
      as the extra fixture `sns-topic-policy-unscoped-behind-a-local` --
      the identical unscoped policy, with the topic's own ARN hoisted into
      a `locals` block and used for the statement's `Resource`. It exists
      because round 8's arm-parity fix accepted any `local.`/`var.`
      reference anywhere in a policy document as evidence of bucket
      scoping, and an adversarial verifier PROVED by execution that this
      one ordinary edit flipped THIS fixture from 0.0 to 1.0. All three
      spellings now score 0.0 on every arm that grades this catch. Dropped from awscdk (applies_to below) for the same
      reason sns-publish-not-permitted is: `s3n.SnsDestination.bind()`
      unconditionally authors a CORRECTLY-scoped statement the moment the
      idiomatic API is used at all, so this specific mis-scoping (as
      opposed to the policy being entirely absent) has no ordinary-use path
      on that arm either -- see oracle.cfn_guard_hints' own note above.
      ROUND-11 CORRECTION: `predicted_tier_caught.awscdk: "1"` below was
      FACTUALLY FALSE until this round -- nothing on that arm graded topic-
      policy scoping at ANY tier, and an adversarial verifier PROVED by
      execution that an awscdk artifact carrying exactly this defect (topic
      bound through a destination that authors no policy of its own, plus a
      hand-authored `AWS::SNS::TopicPolicy` with no `aws:SourceArn`
      condition) scored reward 1.0 while its hcl_raw twin scored 0.0. The
      row is not relabelled: the RULE was added
      (`sns-topic-policy-allows-s3-publish-cfn`, oracles/rego-cfn/.../
      policy.rego), so "1" is now true in the sense this field carries for
      an applies_to-dropped catch -- the tier that WOULD catch it there.
      `applies_to` stays [hcl_raw, terraconstructs] because reaching the
      defect on awscdk still requires that fabricated escape hatch; the new
      clauses are falsified instead by the awscdk-only extra broken
      fixtures `hand-authored-topic-policy-not-scoped-to-bucket` and
      `hand-authored-topic-policy-attached-to-a-different-topic`.
    applies_to: [hcl_raw, terraconstructs]
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null

  - name: inline-sns-topic-policy-not-scoped-to-bucket
    taxonomy: graph-dependency
    description: >
      NEW (round 2): the inline-shape mirror of
      sns-topic-policy-not-scoped-to-bucket, added specifically to falsify
      the new `inline_policy_topics` Rego branch this fix pass introduced
      (this file's own VERIFIER-REJECTION FIX PASS header, point 6 of
      "oracle must tolerate/defend") -- without a fixture that violates it,
      that branch would be unexercised code, the exact kind of gap
      generator/check_tier1_coverage.py's own floor exists to force a
      covering catch for. Uses the provider's OTHER documented shape --
      `policy` set directly on `aws_sns_topic` itself, no separate
      `aws_sns_topic_policy` resource at all -- with a policy document that
      grants `sns:Publish` to `s3.amazonaws.com` but with NO
      `aws:SourceArn`-conditioned scoping (or one hardcoded to an unrelated
      ARN), open to any bucket in the account. Everything else wired
      correctly (single authoritative notification resource, Lambda half
      fully correct). Passes the fail-closed "some policy-bearing shape
      exists" check (a policy-bearing `aws_sns_topic` DOES exist); fails
      sns-topic-policy-allows-s3-publish-tf's inline-shape bucket-reference
      clause alone (tier 1). Only reachable on hcl_raw: terraconstructs'
      own `TopicBase.addToResourcePolicy()` always composes via a separate
      `data "aws_iam_policy_document"` + standalone `aws_sns_topic_policy`
      (re-verified this authoring pass, this file's own header comment) --
      it never sets `aws_sns_topic`'s own `policy` argument, so this
      specific resource SHAPE (not just its scoping) has no ordinary-use
      path on that arm; reproducing it there would need the same kind of
      fabricated escape hatch this file's other typed-arm-dropped catches
      avoid. ROUND-11 CORRECTION, same finding as its standalone-shape
      sibling above: `predicted_tier_caught.awscdk: "1"` below was
      factually false until this round, because that arm graded no SNS
      topic-policy scoping at all. It is now true -- with the caveat stated
      explicitly, since the INLINE shape has no CloudFormation counterpart
      whatsoever (`AWS::SNS::Topic` has no `Policy` property): what the new
      `sns-topic-policy-allows-s3-publish-cfn` assert catches on awscdk is
      the same DEFECT (a topic policy granting s3 publish with no
      bucket-scoping condition) expressed in the one shape CFN does have,
      `AWS::SNS::TopicPolicy`. That is exactly the reading
      `predicted_tier_caught` already carries for terraconstructs on this
      row, where the inline shape is equally unreachable.
    applies_to: [hcl_raw]
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null

  - name: audit-topic-wired-only-to-lifecycle-expiration
    taxonomy: nested-attribute
    description: >
      NEW (round 6, this file's own VERIFIER-REJECTION FIX PASS (round 6)
      header) -- exists specifically to falsify the new
      `audit-topic-events-cover-a-real-delete` tier-1 assert/Rego/cfn-guard
      rule that pass introduced. Everything else wired correctly (single
      authoritative notification resource, Lambda half fully correct
      including its scoped permission, topic policy correctly scoped) --
      but the topic target's notification events are `["s3:
      LifecycleExpiration:*"]` ONLY, with NO `s3:ObjectRemoved:*`-family
      entry anywhere. This is the adversarial verifier's own PROVEN
      false-accept shape: it passes the six-literal whitelist
      (object-removed-notification-targets-a-topic, tier 0 -- the one
      resolved event IS a member) but does not satisfy "when any object is
      deleted", since `s3:LifecycleExpiration:*` never fires for an
      ordinary user-initiated delete (only for one S3's own Lifecycle
      engine performs) -- per AWS's own docs, already cited at round 5.
      Reachable identically on every arm through the SAME idiomatic call
      site the reference solution itself uses, one argument different:
      `s3.EventType.LIFECYCLE_EXPIRATION` (awscdk, aws-cdk-lib 2.263.0's
      own `EventType` enum) and `storage.EventType.LIFECYCLE_EXPIRATION`
      (terraconstructs 0.2.13's own identically-named enum member,
      re-verified directly against the pinned package tree) are both
      first-class members alongside `OBJECT_REMOVED` -- no fabricated
      escape hatch needed on either typed arm. Passes every tier-0 assert
      and every OTHER tier-1 rule; fails
      audit-topic-events-cover-a-real-delete alone (tier 1).
    predicted_tier_caught:
      awscdk: "1"
      hcl: "1"
      terraconstructs_override: null


# an agent enumerating the family precisely (instead of wiring the
# wildcard) reaches for it exactly the same way it reaches for the other
# three. PROVEN empirically against the generated hcl_raw oracle: an
# otherwise byte-for-byte-correct main.tf (single authoritative
# `aws_s3_bucket_notification`, correctly-scoped lambda permission and

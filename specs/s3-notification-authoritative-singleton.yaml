  # NOTE ON THIS FIELD'S NAME (specs/SCHEMA.md §4.3/§4.5): these are the
  # CFN-SHAPE hints, and they apply to the awscdk arm's tier-1 bundle
  # whichever engine reads them. Since round 10 that bundle is
  # oracles/rego-cfn/s3-notification-authoritative-singleton/policy.rego
  # (OPA/Rego over the same synthesized template), not a cfn-guard
  # `.guard` file -- the field keeps its schema name, the hints below
  # describe the rules that actually run.
  cfn_guard_hints:
    - >-
      Graded against the awscdk arm's synthesized CloudFormation template
      (`cdk.out/ScenarioStack.template.json`) by
      `opa eval -f raw -I -d policy.rego
      'data.cdktn_bench.s3_notification_authoritative_singleton.deny'` --
      the SAME command line, package name and `deny` contract the hcl_raw
      and terraconstructs arms run, over a different `input` document.
      Resources are read from `input.Resources[<LogicalId>]` with `.Type`
      and `.Properties`; every cross-resource reference is an intrinsic
      naming a LOGICAL ID. `s3_invoke_permissions` is keyed on that logical
      id: `{lid: r | some lid, r in resources; r.Type ==
      "AWS::Lambda::Permission"; object.get(r, ["Properties","Principal"],
      null) == "s3.amazonaws.com"}`.
    - >-
      ROUND-10 ENGINE PORT, superseding the round-7 cfn-guard hint that
      stood here. `deny` fires PER PERMISSION (`some lid, _ in
      s3_invoke_permissions`, never "at least one" -- DECISIONS.md
      Amendment 29 §4 RULING 2) unless that permission's SourceArn NAMES an
      AWS::S3::Bucket declared in the same template. What a value names is
      computed by `expr_names`, which walks the whole SourceArn expression
      to arbitrary depth (`walk`) and decodes each node with `node_names`:
      `{"Ref": X}` -> X; `{"Fn::GetAtt": [X, attr]}` and its dotted string
      form -> X; `{"Fn::Sub": "...${X}...${Y.Attr}..."}` -> X, Y via
      `sub_tokens` (`regex.find_n`), honouring Fn::Sub's own `${!Literal}`
      escape and excluding names declared in the two-element form's
      variable map; anything nested inside `Fn::Join`, `Fn::If`,
      `Fn::Select`, ... is reached by the walk itself. A name is accepted
      iff `input.Resources[name].Type == "AWS::S3::Bucket"`, so the check
      is on the graph EDGE and the referenced resource's TYPE -- never on a
      physical bucket name and never on a particular logical id (RULING 1).
      Rejected symmetrically with the TF-shaped arms: an absent SourceArn,
      a literal ARN string (wildcarded, or naming a real-but-unrelated
      bucket, or one that happens to spell the solution's own bucket name),
      a literal dressed up in an `Fn::Sub` whose only real substitution is
      the partition, and a SourceArn naming a resource of any other type.
      Falsified by four extra broken fixtures on this arm
      (`lambda-permission-not-scoped-to-bucket`,
      `lambda-permission-scoped-to-a-different-bucket`,
      `lambda-permission-scoped-via-an-interpolated-literal`,
      `second-lambda-permission-scoped-to-the-topic`,
      `lambda-permission-scoped-to-the-topic-arn-behind-a-local`).
    - >-
      WHY NOT cfn-guard, recorded because the retired bundle's own header
      is gone with it: cfn-guard 3.2.0 has no cross-resource join and no
      per-resource quantifier over a resolved reference, and its `let`
      bindings flatten a property across ALL matching resources. Rounds 7-9
      approximated the join with four rules and five `let` bindings; an
      adversarial verifier proved by execution at round 10 that the
      approximation still PASSED both the `Fn::Sub`-composed hardcoded ARN
      (reward 1.0 on awscdk, 0.0 on hcl_raw for the same defect) and a
      second permission scoped to the audit topic. See ROADMAP.md M8 and
      SCHEMA.md §4.5. cfn-guard remains installed in
      arms/awscdk/environment/Dockerfile as a measured arm capability; it
      is simply not the authority in a cross-arm comparison.
    - >-
      The fail-closed companion: `deny` if an AWS::S3::Bucket exists in the
      template but zero AWS::Lambda::Permission resources with Principal ==
      "s3.amazonaws.com" exist at all (mirrors policy.rego's own
      fail-closed rule and toy-ssm-parameter's convention). Falsified by
      the `no-lambda-permission-at-all` extra broken fixture, added at
      round 10 -- before it, this rule had never been exercised on any arm.
      That fixture cannot isolate the rule at tier 1 and says so: with zero
      permissions, tier-0's `lambda-permission-principal-is-s3` (`op: eq`,
      exactly one resolved node) necessarily fails too.
    - >-
      sns-topic-policy-allows-s3-publish-cfn (ROUND 11 -- this entry
      previously read "No rule exists here for SNS topic-policy SCOPING
      content, nor for its ATTACHMENT", which was true and was a DEFECT,
      not a declared asymmetry: two catches were carrying
      `predicted_tier_caught.awscdk: "1"` against it, and
      generator/check_tier1_coverage.py was counting both. The argument
      that made the omission look safe -- `SnsDestination.bind()`
      unconditionally calls `topic.addToResourcePolicy(...)`, so a
      hand-authored `CfnTopicPolicy` is redundant rather than a
      replacement -- was disproved by execution: an artifact that binds the
      topic through a destination authoring no policy, plus one
      hand-authored unconditioned `AWS::SNS::TopicPolicy`, IS the defect
      and scored reward 1.0 against 0.0 for its hcl_raw twin). The rule now
      lives in oracles/rego-cfn/.../policy.rego and mirrors
      sns-topic-policy-allows-s3-publish-tf clause for clause: for EVERY
      AWS::SNS::TopicPolicy independently (RULING 2),
      `expr_names(Properties.PolicyDocument)` must name a resource whose
      Type is AWS::S3::Bucket, and `expr_names(Properties.Topics)` must
      name one whose Type is AWS::SNS::Topic -- joined on logical id +
      Type, never on a physical name (RULING 1), and reusing the same
      arbitrary-depth expression walk the SourceArn rule uses. The
      statement's Action/Effect/Principal are not graded, matching the TF
      side. The ROUND-2 two-accepted-shapes ambiguity (this file's own
      VERIFIER-REJECTION FIX PASS header) is still TF-only and still does
      not affect this arm: CloudFormation's `AWS::SNS::Topic` resource type
      has no `Policy` property, so `AWS::SNS::TopicPolicy` is the ONLY
      shape CFN offers here (verified against the CFN Template Reference
      Guide) -- which is why `inline-sns-topic-policy-not-scoped-to-bucket`
      keeps its awscdk-excluding `applies_to` while its
      `predicted_tier_caught.awscdk` ("the tier that WOULD catch it here")
      is now true. Falsified by the awscdk-only extra broken fixtures
      hand-authored-topic-policy-not-scoped-to-bucket and
      hand-authored-topic-policy-attached-to-a-different-topic.
    - >-
      CROSS-ARM STRICTNESS, stated in one place, REWRITTEN AT ROUND 11.
      This arm has NO residual leniency on the SourceArn axis: the
      CloudFormation template is fully static and every indirection it can
      express (Ref / GetAtt / Join / Sub / any nesting) is resolved; the
      round-7 `Fn::Sub` residual was closed at round 10 and stays closed.
      What this entry used to claim about the OTHER arms -- that a
      `^(local|var)\.` symbol "used in exactly one dedicated ARN slot and
      nowhere else is accepted there without proof of what it holds",
      narrowed by round 10's provenance test -- was proven false twice over
      at round 11 and is corrected rather than preserved: (i) round 10's
      provenance test read one slot only and was defeated by spelling an
      unrelated argument directly, and could never fire for the inline
      topic-policy shape; (ii) the plan DOES prove what such a symbol
      holds, in `.planned_values`, which the file asserting otherwise had
      not looked at. Both were fixed in policy.rego
      (`topic_arn_slot_references`, `slot_is_plan_time_unknown`).
      REWRITTEN AGAIN AT ROUND 12, because the statement round 11 put here
      -- "the one irreducible difference left is a `local.`/`var.` that
      resolves to something unknown for a reason the plan does not name at
      all" -- was itself too generous in one direction and too strict in
      the other, both PROVEN by execution: a symbol holding an
      in-configuration resource attribute of the WRONG TYPE (the Lambda's
      own ARN in the bucket slot; the Lambda's ARN in the topic-policy
      attachment slot) scored 1.0 on hcl_raw against 0.0 on awscdk, and a
      correct one-map hoist of both ARNs scored 0.0 on hcl_raw against 1.0
      on awscdk because provenance was compared by shared container PREFIX.
      The honest statement now is: an ARN slot reference is accepted on the
      TF-shaped arms only when it names a resource of the right type
      directly, OR when it is a `local.`/`var.` symbol (compared as a whole
      traversal, `deepest_refs`) that the plan cannot resolve to a
      constant, that this configuration does not use in a dedicated slot
      for the OTHER ARN, that the plan's own `relevant_attributes` shows
      this configuration reaching an `arn` of the required resource type at
      all (`config_reaches_arn_of`), and -- in the topic-policy attachment
      slot -- that this configuration also uses in a slot that WIRES a
      topic (`topic_target_indirections`). A `local.` hiding a hardcoded
      ARN is rejected on all three arms; a `local.` holding a wrong-type
      resource ARN is now rejected on all three arms; a DRY hoist of the
      right resource attribute is accepted on all three, in the flat and
      the one-map spellings alike. THE ONE DIFFERENCE THAT REMAINS, stated
      plainly because it is not closable from this artifact: the TF-shaped
      arms cannot attach a symbol to an attribute, so a configuration that
      reaches the bucket ARN through ONE symbol and launders a different
      resource's ARN through a SECOND symbol into `source_arn` passes there
      and fails on awscdk, whose template names the target logical id in
      the SourceArn itself. Every shape a SINGLE symbol can express is
      decided identically on all three arms. See the
      lambda-permission-scoped-to-bucket-tf assert's own CROSS-ARM
      STRICTNESS NOTE and "oracle must tolerate/defend" point 8.
      RETRACTED AT ROUND 13 (2026-08-23): the sentence beginning "THE ONE
      DIFFERENCE THAT REMAINS" is FALSE and is kept only as the record of
      what was claimed. It was not "not closable from this artifact" -- it
      was not closable from `plan.json`, and `plan.json` is no longer the
      only artifact. `oracle.hcl_traversal` (SCHEMA.md sect 4.6) merges the
      agent's own parsed `.tf` into the oracle input, so both dedicated
      single-ARN slots resolve their one reference to a REFERENT: a
      `local.` symbol is followed through the `locals` table with
      `graph.reachable` (unbounded, cycle-safe), and a slot holding zero or
      more than one reference is refused by an arity gate that lives in the
      shared library rather than in either rule. Executed on the same
      planned artifact: round 12 denied nothing (reward 1.0); round 13
      denies, quoting `aws_lambda_function.ingest.arn`. Fixture:
      `lambda-permission-scoped-to-a-second-symbol-holding-the-lambda-arn`.
      The round-13 pass also closed SAME-TYPE / WRONG-INSTANCE, which no
      round before it had recorded on any arm: the slot must now resolve to
      the `.arn` of the SAME resource instance this configuration's own
      `aws_s3_bucket_notification` wires. What is residual now: a
      `count`/`for_each` index on the referent is REFUSED and denies a
      possibly-correct solution (a live false fail, loud, not silent);
      module boundaries are not crossed; and the wrong-instance rule, though
      closed on all three arms, ships fixtures on hcl_raw and awscdk only --
      terraconstructs runs the same rule with no fixture exercising it.
      ROUND-14 CORRECTION: "closed on all three arms" was written at round
      13 while the rule still carried a type-only fallback for the case
      where the artifact's own notification resource named no single
      instance -- reachable from an ordinary literal `bucket` argument, and
      executed at reward 1.0 on a genuinely broken artifact. Round 14
      deletes the fallback and makes the anchor gating on both policy
      files; "closed" means closed as of round 14. Two loud-direction
      residuals fall out of that and are listed in the RESIDUALS block at
      the head of this file.
      ROUND-15 CORRECTION, to two sentences of the paragraph above.
      (i) "a `count`/`for_each` index on the referent is REFUSED ... (a live
      false fail, loud, not silent)" was true only of the NUMERIC spelling.
      `aws_s3_bucket.b["media"].arn` PARSES, and the instance identity then
      collapsed every key of one block into one instance: a permission
      scoped to the DECOY key scored REWARD 1.0, executed, and so did its
      correct twin. Silent, not loud. Closed at round 15 by carrying the key;
      the numeric spelling alone remains refused. (ROUND-16 RETRACTION of
      the words "and that half really is loud" which stood here: the
      tokenizer's whole refusal path was DEAD CODE -- a Rego comprehension
      over an undefined body returns the empty collection -- so an
      untokenizable reference was SILENTLY DROPPED from its slot rather than
      refusing it. Fixed at round 16; it is loud now. Full transcript in the
      RESIDUALS block at the head of this file.)
      (ii) "closed on all three arms" therefore meant closed between
      separate resource BLOCKS only; read it as closed as of round 15. Both
      retractions, with the executed artifacts, are in the RESIDUALS block at
      the head of this file.
    - >-
      audit_topic_covers_a_real_delete (ROUND 6, this file's own
      VERIFIER-REJECTION FIX PASS (round 6) header -- unlike the SNS-policy
      note above, THIS mistake IS reachable on awscdk through ordinary use:
      `s3.EventType.LIFECYCLE_EXPIRATION` is a first-class enum member on
      aws-cdk-lib's own `EventType`, so
      `bucket.addEventNotification(EventType.LIFECYCLE_EXPIRATION, new
      s3n.SnsDestination(topic))` in place of `EventType.OBJECT_REMOVED` is
      the exact same idiomatic call site, one argument different -- no
      escape hatch). `topic_notification_events` unions
      `.Properties.NotificationConfiguration.TopicConfigurations[*].Events`
      over every `Custom::S3BucketNotifications` resource; `deny` fires iff
      that set is non-empty and contains neither `s3:ObjectRemoved:*` nor
      `s3:ObjectRemoved:Delete`. The CFN mirror of
      `fires_for_a_real_delete` in policy.rego: same two accepted literals,
      same union shape, same "only when a topic notification is wired at
      all" gating (an entirely-missing one is already caught by tier-0's
      object-removed-notification-targets-a-topic).
  # ROUND-10 (2026-08-23). The awscdk arm's tier-1 is graded by OPA/Rego
  # over the synthesized CloudFormation template
  # (oracles/rego-cfn/s3-notification-authoritative-singleton/policy.rego),
  # not by cfn-guard -- specs/SCHEMA.md §4.5, DECISIONS.md Amendment 29 §4,
  # ROADMAP.md M8. The graded question on this arm is a CROSS-RESOURCE JOIN
  # ("does THIS Lambda permission's SourceArn resolve to an AWS::S3::Bucket
  # declared in THIS template?"), and cfn-guard 3.2.0 cannot express one:
  # its `let` bindings flatten across resources, so rounds 7-9's four-rule
  # approximation could only ask "is SOME s3-principal'd permission's
  # SourceArn a bucket", never "is EACH one's". An adversarial verifier
  # PROVED by execution at round 10 that this scenario -- whose entire
  # output is a cross-arm comparison -- still graded awscdk strictly less
  # than the TF-shaped arms on two spellings of the SAME defect the round-7
  # fix was supposed to close (see this file's own VERIFIER-REJECTION FIX
  # PASS (round 10) header). The retired
  # oracles/cfn-guard/s3-notification-authoritative-singleton/policy.guard
  # was DELETED at round 10, not left behind: an orphan bundle no generated
  # tests/ copies is a policy that looks like grading and is not.
  awscdk_tier1_engine: rego

  # ROUND 13 (2026-08-23) -- HCL SYMBOL RESOLUTION FOR THE hcl_raw ARM.
  # (SCHEMA.md §4.6; docs/design/conftest-hcl-traversal-spike.md.)
  #
  # `terraform show -json` does not emit `locals`. A plan's
  # `.configuration...references` list therefore dead-ends on
  # `local.arns.media_bucket`: it records that `source_arn` was SET to that
  # symbol and nothing whatsoever about what the symbol HOLDS. Both of this
  # scenario's two tier-1 ARN slots live on exactly that fact, and rounds
  # 8-12 tried to work around it with circumstantial, configuration-WIDE
  # evidence (`relevant_attributes`; "the same symbol also appears in a topic
  # slot"; "the plan does/doesn't resolve the slot to a constant"). Both
  # directions of error were then reproduced BY EXECUTION:
  #
  #   FALSE PASS -- `media_bucket = aws_lambda_function.ingest.arn` plus one
  #     ordinary, CORRECT IAM read grant on the real bucket elsewhere in the
  #     file. The read grant alone put `aws_s3_bucket.media ["arn"]` into
  #     `relevant_attributes`, satisfying the positive test, while the S3
  #     invoke permission was scoped to the LAMBDA'S OWN ARN. reward 1.0.
  #   FALSE FAIL -- the topic ARN hoisted into a local for
  #     `aws_sns_topic_policy.arn` and spelled DIRECTLY in the notification's
  #     `topic_arn` (both idiomatic, both correct). reward 0.0, with a deny
  #     message that was factually FALSE about the artifact (RULING 3).
  #
  # With this true, the hcl_raw arm's generated tests/static_tiers.sh parses
  # the agent's own `*.tf`/`*.tf.json` with `hcl2json` (pinned +
  # sha256-verified in arms/hcl-raw/environment/Dockerfile; 4.1 MB; no
  # network) and merges the result into the SAME plan document under one
  # reserved key, `_hcl`, before `opa eval` runs. The ENGINE is unchanged and
  # `input` stays byte-identical for every pre-existing rule in every
  # scenario -- conftest was rejected precisely because adopting it AS the
  # engine would have reshaped `input` for every rule in the repo for a
  # parser that is byte-identically the same one (spike memo §7).
  #
  # ROUND-14 ADDENDUM (2026-08-24) -- the `*.tf.json` half of that glob did
  # NOT work when it was first advertised. Terraform's own JSON syntax
  # writes `"locals"` as an OBJECT of name -> value, while hcl2json emits a
  # LIST of blocks; the shared library read only the list spelling, so every
  # local in an object-spelled `main.tf.json` was silently dropped and a
  # FULLY CORRECT solution scored 0.0 with a deny message the artifact
  # itself contradicted. Both spellings are read now
  # (oracles/rego/lib/hcl_traversal.rego::locals_blocks), with a regression
  # test per spelling.
  #
  # ONLY hcl_raw NEEDS IT, confirmed by synthesis on the other two arms
  # (spike memo §9): awscdk resolves TS variables at synth time and the
  # template names its referent in an `Fn::GetAtt`, and cdktn does the same
  # and emits no `locals` block at all. The terraconstructs arm is graded by
  # the SAME oracles/rego/ policy and simply never takes the `local.` path;
  # its reference solution was re-run against the round-13 policy with no
  # `_hcl` key present at all and denies nothing.
  hcl_traversal: true

  tier05_jsonata: null


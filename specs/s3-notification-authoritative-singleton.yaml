#        *** RETRACTED, ROUND 17. This bullet also said "Effect/Principal/
#        Action are read ONLY to decide which statements must be scoped,
#        with every predicate erring towards 'this statement grants'". The
#        second half was EXECUTABLY FALSE. Both predicates fell back to
#        "covers" only when the key was ABSENT (`== null`), never when it
#        was present but UNREADABLE, so `Principal = local.s3_principal` and
#        `Action = local.publish_action` -- ordinary DRY hoists -- silently
#        REMOVED a real grant from grading and a fully correct solution
#        scored REWARD 0.0. Round 17 rewrites both as "unless this reader
#        can read the value AND that readable value excludes the grant", so
#        the sentence is now true of the code; see the round-17 bullets
#        below. ***
#        ALSO RETRACTED, ROUND 17: the claim above that `data.aws_iam_
#        policy_document` "is read at `statement[*].condition[*]`" IN THE
#        PLAN. The plan drops every LITERAL from a condition's `values`, so
#        a value list holding a wildcard beside the wired bucket is
#        indistinguishable there from one holding the bucket alone. Route 3
#        now reads the same parsed .tf the other two routes read
#        (`hcl.data_blocks`).
#      * NEW, ROUND 16 -- THE TWO TOPIC-POLICY RULES WERE QUANTIFIED OVER
#        EVERY `aws_sns_topic_policy` AND FALSE-FAILED A CORRECT SOLUTION.
#        A solution that also declares an unrelated ops/alarms topic with
#        its own policy was DENIED, with "...Without an aws:SourceArn-shaped
#        condition naming this bucket, any S3 bucket in any account can
#        publish to the audit topic" -- while its `aws_sns_topic_policy.audit`
#        demonstrably carried that condition (Amendment 29 RULING 3).
#        Executed on a real plan: TIER1=FAIL, reward 0.0. Both denies are
#        now quantified over policies attached to a WIRED topic only; the
#        per-policy `references_this_topic` deny is DELETED (narrowed it
#        would be vacuous) and its coverage is carried by round 15's
#        per-wired-topic rule, whose message names the uncovered TOPIC
#        rather than accusing a POLICY. Mirrored on awscdk, including a new
#        per-wired-topic coverage rule so the narrowing gives nothing up
#        there either.
#      * NEW, ROUND 16 -- TWO DEAD GUARDS, BOTH ALWAYS-FALSE, BOTH INVISIBLE
#        IN REVIEW. (i) `parse_traversal` was a bare comprehension, and a
#        Rego comprehension over an undefined body is the EMPTY COLLECTION,
#        not undefined -- so the tokenizer's whole refusal path was dead and
#        untokenizable references were SILENTLY DROPPED from their slot
#        (full transcript at the numeric-index bullet above). (ii) The
#        "a statement with no Principal/Action still counts as granting"
#        clauses were first written `not object.get(st, "Principal", null)`;
#        `object.get` returns its DEFAULT when the key is missing and `null`
#        is TRUTHY in Rego, so that guard is false in BOTH cases. Fixed
#        before shipping, pinned by ::test_a_statement_missing_its_principal
#        _or_action_still_counts_as_granting. THE GENERALISATION, recorded
#        for the next author: in Rego, a guard built out of a TOTAL builtin
#        is a prime candidate for being always false.
#      * NEW, ROUND 16 -- `each.value.arn` ON A `for_each`-EXPANDED
#        PERMISSION IS RESOLVED (see the residual-family bullet above for
#        the executed false FAIL it closes and for exactly how narrow the
#        acceptance is).
#      * NEW, ROUND 17 -- THE ROUND-16 `Sid` LAUNDER WAS NOT CLOSED; IT
#        MOVED INTO THE CONDITION'S VALUE LIST, AND IT WAS CROSS-ARM.
#        Round 16 made the test POSITIONAL, which was right, but it emitted
#        ONE SLOT PER VALUE and accepted a statement on `some` slot. IAM
#        OR-s the values inside ONE condition position and AND-s distinct
#        positions -- two different logical connectives, one quantifier.
#        EXECUTED, real image, --network none, generated static_tiers.sh
#        verbatim: the reference solution with ONLY
#          ArnLike = { "aws:SourceArn" = local.arns.media_bucket }
#        changed to
#          ArnLike = { "aws:SourceArn" = [local.arns.media_bucket, "arn:aws:s3:::*"] }
#        scored `tier0_pass=1 tier1_status=PASS`, `deny []`, REWARD 1.0 --
#        on a topic policy that lets ANY S3 bucket in ANY account publish,
#        the exact property the deny message claims to enforce. Reproduced
#        on all THREE document routes and on the CFN arm.
#        NOW: the graded unit is one POSITION -- an (operator, condition
#        key) pair carrying its WHOLE value list. A position is scoped only
#        when it carries at least one value and EVERY value resolves to the
#        `arn` of a wired bucket instance (a literal, a wildcard or an
#        unresolvable value FAILS the position rather than being skipped);
#        a STATEMENT is scoped when SOME position is, which is sound
#        because an extra AND-ed condition can only narrow a grant.
#        Mirrored in oracles/rego-cfn/ (pseudo-parameters such as
#        AWS::Partition are dropped from a value's name set rather than
#        failing it, so `Fn::Sub "arn:${AWS::Partition}:s3:::${Bucket}"`
#        stays correct).
#        THE ARM THAT SUPPLIES NO PARSED SOURCE. terraconstructs LOADS the
#        library but runs no hcl2json merge (it synthesizes cdk.tf.json and
#        has no .tf files -- specs/SCHEMA.md 4.6 "TWO SCOPES"), so moving
#        route 3 wholesale onto parsed HCL would have DENIED that arm's own
#        reference solution. A plan-based reader is kept for exactly that
#        case, guarded by `not hcl.hcl_supplied` (never by "the HCL route
#        found nothing", so an arm that DOES supply source cannot fall back
#        to the weaker reader by hiding its data block). It is not blind:
#        `.configuration` drops the literals but `.planned_values` KEEPS
#        THE ARITY -- one entry per value, `null` for an unknown and the
#        literal verbatim otherwise -- so `values = [x, "arn:aws:s3:::*"]`
#        reads back as `[null, "arn:aws:s3:::*"]` and the position is
#        refused. Executed both ways on a real terraform 1.15.8 plan with
#        `_hcl` stripped: correct -> deny [], OR-ed -> deny.
#        KNOWN OPEN RESIDUAL on that path, narrow and NOT declared closed:
#        if terraform defers the `data "aws_iam_policy_document"` entirely
#        there is no planned list to check, and the reference slot alone
#        decides -- so a value list of [<wired bucket>, <literal>] would
#        not be caught there. Not observed on any reference or fixture plan
#        of this scenario, and unreachable on hcl_raw, which always
#        supplies parsed source.
#        Fixtures, one per route:
#        `sns-topic-policy-source-arn-ored-with-a-wildcard`,
#        `sns-topic-policy-source-arn-ored-with-a-decoy-bucket`,
#        `inline-sns-topic-policy-source-arn-ored-with-a-wildcard`,
#        `iam-policy-document-source-arn-ored-with-a-wildcard` (hcl_raw),
#        `topic-policy-source-arn-ored-with-a-wildcard` (awscdk). Pinned at
#        the policy level by oracles/tests/test_hcl_traversal.py::
#        test_a_wildcard_beside_the_wired_bucket_is_not_scoping,
#        ::test_a_second_and_ed_condition_position_does_not_break_scoping
#        and ::test_a_condition_position_with_no_readable_value_list_is_
#        refused.
#      * NEW, ROUND 17 -- A DOCUMENT THE READER COULD NOT TURN INTO
#        STATEMENTS WAS GRADED AS "0 GRANTING STATEMENTS", NOT AS
#        UNREADABLE, so FOUR ordinary CORRECT DRY spellings scored REWARD
#        0.0, each with a message the artifact refutes (Amendment 29
#        RULING 3). This is spike-memo defect (b) -- the false FAIL on a
#        DRY hoist this whole library exists to close -- reintroduced one
#        level down, INSIDE the policy document. EXECUTED at
#        tier1_status=FAIL / reward 0.0 for `policy = jsonencode(local.doc)`,
#        `Statement = local.stmts`, `Principal = local.s3_principal` and
#        `Action = local.publish_action`, all four with the IDENTICAL
#        message "...has 0 statement(s) granting the s3.amazonaws.com
#        service principal sns:Publish, and not every one of them is
#        scoped...". Three causes: (i) `_policy_structured_docs` took
#        `hcl.resource_jsonencode` raw with NO `is_object` guard, so the
#        recovered body -- the STRING "${local.doc}" -- counted as a
#        document and the promised loud "unreadable" deny never fired;
#        (ii) `policy_document_scopes_to_the_bucket` carried
#        `count(granting_statements(r)) > 0`, so "zero granting statements"
#        borrowed the "not every one of them is scoped" message (false on
#        both counts, and it mis-described the genuinely-broken
#        events.amazonaws.com case too) -- the CFN mirror had a dedicated
#        zero-granting deny and the TF policy did not, a cross-arm
#        strictness asymmetry; (iii) the Principal/Action predicates, see
#        the retraction above.
#        NOW: `hcl.deref_local(v)` reads what a lone `local.` symbol HOLDS
#        out of the same parsed `locals` every other hop already reads
#        (nothing is evaluated -- the value comes back as raw "${...}"
#        source and every leaf still goes through `hcl.slot`) and is
#        UNDEFINED for an ambiguous, cyclic or non-`local.` expression. It
#        is applied at the jsonencode body, at `Statement`, at
#        Effect/Principal/Action, at `Condition` and at every condition
#        VALUE, so all four DRY spellings score 1.0. What it cannot resolve
#        still hits the fail-closed branches, which are now correct:
#        `is_object` is REQUIRED of the recovered body, a `Statement` key
#        present but unreadable routes to the LOUD unreadable deny rather
#        than to "zero statements", and zero granting statements has its
#        own honest message on BOTH TF shapes.
#        WHERE EACH HALF IS PINNED. The four CORRECT DRY spellings must
#        score 1.0, and a 1.0 shape cannot live under solution/broken/ --
#        `make falsifiability` has exactly one positive slot, the reference
#        solution -- so they are pinned in
#        oracles/tests/test_hcl_traversal.py, one opa process per shape:
#        ::test_a_policy_document_hoisted_into_a_local_is_read_not_refused,
#        ::test_a_statement_list_hoisted_into_a_local_is_read_not_refused,
#        ::test_a_hoisted_principal_or_action_does_not_delete_the_grant,
#        plus the fail-closed twins
#        ::test_an_unreadable_principal_or_action_still_counts_as_granting,
#        ::test_a_document_that_is_still_not_an_object_denies_loudly and
#        ::test_zero_granting_statements_gets_its_own_message. All four were
#        ALSO executed end to end in the real hcl-raw image under
#        --network none at REWARD 1.0. The two DENY halves ship as ordinary
#        broken fixtures: `topic-policy-document-not-readable` and
#        `topic-policy-granting-only-a-non-s3-principal`.
#      * NEW, ROUND 17 -- THE SAME "ERRS TOWARDS 'GRANTS'" CORRECTION ON
#        awscdk, where it was a reward-1.0 LAUNDER rather than a false
#        FAIL. `walk` reaches a literal leaf whatever intrinsic wraps it,
#        which is why the CFN reading was believed safe -- but an intrinsic
#        that does NOT resolve to a literal there
#        (`Principal: {"Service": {"Ref": "PrincipalParam"}}`) has no
#        literal leaf to reach, so the statement was DROPPED from grading
#        entirely. Beside one correctly-scoped statement, an unconditioned
#        sns:Publish grant simply vanished: executed `deny []` on a
#        template carrying both, and `deny` once the fix is in. A statement
#        holding a `Ref`/`Fn::*` under Principal or Action is now GRADED
#        (and must therefore be scoped) rather than silently exempted, so
#        the two arms err in the SAME direction.
#      * NEW, ROUND 17 -- CONDITION OPERATORS THAT DO NOT RESTRICT ARE
#        EXCLUDED ON BOTH ARMS, not just the "...Not..." family:
#        `ArnLikeIfExists` is satisfied VACUOUSLY when the request carries
#        no aws:SourceArn at all, and so is `ForAllValues:ArnLike`. Both
#        read as perfect scoping before this round (executed: the reference
#        solution with `ArnLike` -> `ArnLikeIfExists` scored REWARD 1.0 on
#        hcl_raw and `deny []` on awscdk). `ForAnyValue:` is deliberately
#        NOT excluded -- it requires a present value to match, which for a
#        single-valued key like aws:SourceArn is the same restriction.
#      * NEW, ROUND 17 -- `policy = local.doc_json` where the local holds
#        `data.aws_iam_policy_document.x.json`. terraform reports that
#        argument's references as ["local.doc_json"] and stops, so the
#        document was invisible and an ordinary DRY solution was DENIED for
#        holding an unreadable document (executed). The data-document name
#        is now ALSO read from the parsed .tf, by dereferencing the symbol.
#      * KNOWN OPEN RESIDUAL, ROUND 17 (operator-facing, not closed): the
#        per-value gate reads a value that is EXACTLY one interpolation.
#        An `aws:SourceArn` value built by string concatenation
#        (`"arn:aws:s3:::${aws_s3_bucket.media.id}"`) is UNRESOLVABLE and
#        therefore DENIES -- loud, and consistent with how `source_arn` is
#        graded here, but it is a FALSE FAIL on a spelling that is correct
#        in AWS. It is deliberately left loud rather than accepted: a
#        concatenation this reader "understood" would be a mention test
#        wearing a position test's clothes. Fixture:
#        `lambda-permission-scoped-via-an-interpolated-literal`.
#      * The `ENGINE_ERROR` gate hardening is emitted only for a spec that
#        opts in. Every other scenario still maps "the oracle crashed" onto
#        the same word as "the solution was denied".
oracle:
  intent: >
    Both requirements are wired DIRECTLY off the bucket's own notification
    configuration -- the ticket's own "straight from the bucket itself, not
    through any shared notification or messaging layer" constraint (round-4)
    -- never via an EventBridge rule or an SNS-subscribed relay Lambda,
    both of which are real, working architectures the ticket's own added
    sentence rules out for this delivery, not shapes the oracle considers
    wrong in general. An S3 bucket exists. An AWS Lambda function exists to
    transcode uploaded assets, and the bucket's notification configuration
    includes
    one or more s3:ObjectCreated:* / :Put / :Post / :Copy /
    :CompleteMultipartUpload entries whose Lambda target is that
    function; a resource-based Lambda
    permission grants s3.amazonaws.com the right to invoke it, scoped to
    this specific bucket (no wildcard, no unrelated/hardcoded ARN). An SNS
    topic exists for the compliance audit trail, and the SAME bucket's
    notification configuration ALSO includes one or more
    s3:ObjectRemoved:* / :Delete / :DeleteMarkerCreated /
    s3:LifecycleExpiration:* / :Delete / :DeleteMarkerCreated entries
    (ObjectRemoved and LifecycleExpiration are separate, non-overlapping
    S3 event families -- AWS's own docs state ObjectRemoved does not fire
    for lifecycle-driven deletes -- so wiring both is a MORE complete
    reading of "any object is deleted", never a mis-wiring), AND, among
    those entries, at least one of s3:ObjectRemoved:* / :Delete is present
    (round-6 correction: it is the UNION of both families that is more
    complete than ObjectRemoved alone; s3:LifecycleExpiration entries and
    s3:ObjectRemoved:DeleteMarkerCreated never fire for an ordinary
    user-initiated delete on this unversioned bucket, so a subset drawn
    ONLY from those does not by itself satisfy "any object is deleted",
    even though it is a permitted MEMBER of the wider whitelist) whose
    target is that topic; the topic's resource policy -- either a standalone
    resource-based topic policy, or a `policy` argument set directly on the
    topic itself, both are equally acceptable -- grants s3.amazonaws.com
    sns:Publish, scoped (via an aws:SourceArn-shaped condition, or the
    equivalent typed-arm mechanism) to this specific bucket. Because the S3
    notification-configuration API is a single document per bucket with no
    create/update distinction, both requirements are expressed by AT MOST
    ONE authoritative notification-configuration resource per bucket (on
    the TF-shaped arms: exactly one `aws_s3_bucket_notification` whose
    `bucket` argument references the bucket this configuration creates) --
    never two separate resources each carrying one requirement, which
    silently fight over which configuration is actually live on every
    subsequent apply.

  structural_asserts:
    # --- TIER 0 ------------------------------------------------------------
    - name: s3-bucket-exists
      description: "An S3 bucket exists."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::S3::Bucket')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_s3_bucket')]"
      op: exists

    - name: lambda-function-exists
      description: "An AWS Lambda function exists."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::Lambda::Function')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_lambda_function')]"
      op: exists

    - name: sns-topic-exists
      description: "An SNS topic exists."
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::SNS::Topic')]"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_sns_topic')]"
      op: exists

    - name: object-created-notification-targets-a-lambda
      description: >
        The bucket's notification configuration includes one or more
        s3:ObjectCreated:* / :Put / :Post / :Copy / :CompleteMultipartUpload
        entries targeting a Lambda function (any of these five literals,
        alone or combined, satisfies "uploaded" -- this file's own "oracle
        must tolerate" point 5). WHICH function it targets is covered by
        the permission-scoping checks below, since the notification's own
        LambdaFunctionArn/lambda_function_arn is plan-time-unknown wherever
        it references the created function's provider-computed `.arn`
        (same plan-time-unknown class s3-lambda-log-retention's own
        equivalent assert documents, re-verified for this scenario's own
        reference fixtures). `op: in` requires EVERY resolved event to be a
        member of `expected` -- ROUND-3 FIX (this file's own
        VERIFIER-REJECTION FIX PASS (round 3) header): the set below is
        the full canonical S3 ObjectCreated enumeration (Put, Post, Copy,
        CompleteMultipartUpload, plus the wildcard) -- round 2 widened
        this from two literals to four but still omitted `:Copy`, which
        AWS's own docs list as a fourth non-overlapping ObjectCreated
        cause and which aws-cdk-lib exposes as `EventType.
        OBJECT_CREATED_COPY` -- precisely so a solution wiring the
        fully-precise 4-event upload set is not penalized for being more
        precise than the wildcard, while an event outside the
        ObjectCreated family entirely (e.g. an accidentally-duplicated
        ObjectRemoved event on the lambda target) still fails outright.
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='Custom::S3BucketNotifications')].Properties.NotificationConfiguration.LambdaFunctionConfigurations[*].Events"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_s3_bucket_notification')].values.lambda_function[*].events"
      op: in
      expected:
        [
          "s3:ObjectCreated:*",
          "s3:ObjectCreated:Put",
          "s3:ObjectCreated:Post",
          "s3:ObjectCreated:Copy",
          "s3:ObjectCreated:CompleteMultipartUpload",
        ]

    - name: object-removed-notification-targets-a-topic
      description: >
        The SAME bucket's notification configuration ALSO includes one or
        more s3:ObjectRemoved:* / :Delete / :DeleteMarkerCreated and/or
        s3:LifecycleExpiration:* / :Delete / :DeleteMarkerCreated entries
        targeting an SNS topic (this file's own "oracle must tolerate"
        point 4). ROUND-2 FIX (this file's own VERIFIER-REJECTION FIX PASS
        header): `op` changed from `contains` (checks only for the LITERAL
        wildcard string as a list member -- rejects the enumerated
        `:Delete` + `:DeleteMarkerCreated` pair outright, even though
        together they are the exhaustive non-wildcard equivalent) to `in`.
        ROUND-5 FIX (this file's own VERIFIER-REJECTION FIX PASS (round 5)
        header): `expected` widened from the 3-literal ObjectRemoved-only
        set to the 6-literal set below spanning BOTH the ObjectRemoved and
        LifecycleExpiration families -- AWS documents these as
        non-overlapping (ObjectRemoved does not fire for lifecycle-driven
        deletes), so a solution wiring the LifecycleExpiration family
        alongside ObjectRemoved is covering "any object is deleted" MORE
        completely, not incorrectly, and was wrongly scored 0.0 under the
        old 3-literal whitelist. Any non-empty subset of the six passes
        THIS whitelist check; any event outside both families still fails
        outright (e.g. an accidentally-wired ObjectCreated event on the
        topic target). ROUND-6 CORRECTION (this file's own
        VERIFIER-REJECTION FIX PASS (round 6) header): "any non-empty
        subset ... passes" is true only of THIS op:in check, which bounds
        membership but cannot require it -- a LifecycleExpiration-only (or
        DeleteMarkerCreated-only) subset passes here and is nonetheless
        NOT a valid reading of "any object is deleted" for this
        (unversioned) bucket, since neither ever fires for an ordinary
        user-initiated delete. That presence requirement is now enforced
        by the separate tier-1 `audit-topic-events-cover-a-real-delete`
        assert below, not by this one -- see that assert's own comment.
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='Custom::S3BucketNotifications')].Properties.NotificationConfiguration.TopicConfigurations[*].Events"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_s3_bucket_notification')].values.topic[*].events"
      op: in
      expected:
        [
          "s3:ObjectRemoved:*",
          "s3:ObjectRemoved:Delete",
          "s3:ObjectRemoved:DeleteMarkerCreated",
          "s3:LifecycleExpiration:*",
          "s3:LifecycleExpiration:Delete",
          "s3:LifecycleExpiration:DeleteMarkerCreated",
        ]

    # The new reusable helper (blueprint §9(c)): cardinality of an
    # authoritative child resource per parent, flat form -- this scenario
    # creates exactly one bucket, so "count of aws_s3_bucket_notification
    # resources whose bucket references THIS bucket" and "total count of
    # aws_s3_bucket_notification resources in the plan" coincide. Exploits
    # oracles/lib/structural.py's/generator/gen.py's own `eq` semantics
    # (SCHEMA.md §4.2's op table: "0 or >1 resolved nodes FAILS outright,
    # ambiguity is itself a failure") against the resource's OWN `.type`
    # field, which is always the same constant string for every match: 0
    # matches -> 0 nodes -> FAIL (no notification resource at all); 1 match
    # -> 1 node equal to the constant -> PASS; 2+ matches -> 2+ nodes ->
    # FAIL regardless of their (identical) values. This is genuinely tier-0
    # (no graph-edge resolution needed -- `.type` is never plan-time-unknown
    # for any resource, provider-computed or not) and is the mechanism that
    # actually catches two-notification-resources-for-one-bucket; the
    # GENERAL per-parent form (needed once a scenario has >1 parent, e.g.
    # a multi-bucket variant, §10/§8/the brownfield clobber sibling) is not
    # separately declared here as its own structural_assert, because on
    # THIS scenario's own one-bucket topology any fixture violating the
    # general form ALSO violates this flat one and would always be caught
    # here first -- declaring a redundant tier-1 entry with no fixture that
    # can ever be observed failing at tier 1 (rather than this tier 0)
    # would fail generator/check_tier1_coverage.py's own floor for a new
    # spec (no _KNOWN_UNCOVERED_GAP baseline exists to shield it). The
    # general, parametrized-by-parent-address form is instead written
    # directly into policy.rego below as the literal reusable template
    # (see that file's own header) -- exercised here in its
    # single-bucket-degenerates-to-flat-count specialization, ready to be
    # copied and generalized by a future scenario that actually has >1
    # parent to discriminate. Structurally impossible on awscdk (CFN's
    # Custom::S3BucketNotifications is a singleton by construction, this
    # file's header comment) -- not even listed as N/A applies_to, simply
    # omitted, mirroring s3-bucket-hardening-decomposition's own
    # every-subresource-targets-this-bucket-tf precedent for the same
    # reasoning. ALSO structurally guaranteed on terraconstructs
    # (createResourceOnce(), same header comment) -- included there anyway
    # as a true, always-passing fact for a correct solution, same
    # convention as that sibling spec's bpa-* asserts applying uniformly.
    - name: exactly-one-notification-resource-per-bucket-tf
      description: >
        At most one `aws_s3_bucket_notification` resource exists in the
        plan (0 = no notification wired at all, also a failure; 2+ = the
        headline catch, two resources silently fighting over the same
        bucket's one authoritative configuration).
      tier: "0"
      applies_to: [hcl_raw, terraconstructs]
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_s3_bucket_notification')].type"
      op: eq
      expected: "aws_s3_bucket_notification"

    - name: lambda-permission-principal-is-s3
      description: >
        A Lambda resource-based permission exists whose Principal/principal
        is exactly s3.amazonaws.com -- both plan-time-known literals
        regardless of arm (s3-lambda-log-retention's own precedent, reused
        verbatim here). WHETHER it is scoped to the right bucket is the
        tier-1 concern below.
      tier: "0"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::Lambda::Permission')].Properties.Principal"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_lambda_permission')].values.principal"
      op: eq
      expected: "s3.amazonaws.com"

    # sns-topic-policy-exists-cfn: an unconditional (not fail-closed-Rego)
    # tier-0 existence check is sound here specifically BECAUSE this
    # scenario's own ticket always requires an SNS topic wired to
    # ObjectRemoved -- unlike the lambda-permission-scoped-to-bucket
    # pattern, mere EXISTENCE of a topic-policy-shaped resource needs no
    # graph-edge resolution (a resource's presence, unlike its own
    # attribute VALUES, is never plan-time-unknown), so this is the
    # cheapest possible catch for "no topic policy at all" -- the
    # SNS-side mirror of lambda-permission-principal-is-s3 above. WHETHER
    # it is scoped correctly (grants sns:Publish to s3.amazonaws.com,
    # conditioned on this bucket) is the tier-1 concern below

# (`tier0_pass=0`, reward.txt = 0.0) purely because `:Copy` was not a
# member of `expected`; the identical shape with `:Copy` removed scored
# 1.0. FIXED: `s3:ObjectCreated:Copy` added as a fifth `expected` literal
# on that assert (this file's own "oracle must tolerate" point 5, its own
# comment block, and the assert's own `description` below are all
# corrected in place to say "five" / list all five canonical members --
# the round-2 comments claiming completeness at four are superseded, not
# preserved). No negative fixture depends on `:Copy` being rejected (the
# broken/plausible-wrong solutions all fail on the two-notification-
# resources mechanism or the permission/policy scoping, never on the
# event-literal whitelist), so this widening required no fixture churn.

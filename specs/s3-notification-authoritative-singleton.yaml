      `aws_s3_bucket_notification`) and (b) the target parent's own
      resource address (here: the `aws_s3_bucket.<name>` address), and
      returning `count([c | some c in children; parent_addr in
      object.get(c.expressions.bucket, "references", [])])`. `deny` fires
      when that count is not exactly 1 for any parent that has at least one
      child referencing it. NOT independently exercised as a SEPARATE tier-1
      rule in THIS scenario (see exactly-one-notification-resource-per-bucket-tf's
      own structural_assert comment for why: on this one-bucket topology
      every violation is already caught by the flat tier-0 count first, so
      a redundant tier-1 rule here would have zero fixtures that can ever
      be OBSERVED failing at tier 1, which generator/check_tier1_coverage.py
      treats as a hard-fail gap for a brand-new spec) -- written into this
      package as documentation/template code (a real, callable function,
      not prose) for the next scenario that has >1 parent to discriminate
      per bucket/table/queue.
    - >-
      audit-topic-events-cover-a-real-delete (ROUND 6, this file's own
      VERIFIER-REJECTION FIX PASS (round 6) header): collect
      `topic_events`, the union of every `events` list under
      `.values.topic[*]` of every PLANNED (not configured -- these are

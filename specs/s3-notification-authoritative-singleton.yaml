    # sns-topic-policy-allows-s3-publish-cfn -- ADDED round 11 (this file's
    # own VERIFIER-REJECTION FIX PASS (round 11) header, finding 3). Until
    # round 11 NOTHING on the awscdk arm graded SNS topic-policy scoping or
    # attachment at any tier, while this spec declared
    # `predicted_tier_caught.awscdk: "1"` for two catches that name exactly
    # those mistakes -- a false operator-facing claim that also fed
    # `generator/check_tier1_coverage.py`, which does not filter by
    # `applies_to` and so counted both rows toward this arm's coverage
    # floor. The omission rested on "`SnsDestination.bind()` always authors
    # a correctly-scoped statement, so the mistake has no ordinary-use path
    # here"; an adversarial verifier disproved the conclusion by binding
    # the topic through a destination that authors no policy and
    # hand-authoring an unconditioned `AWS::SNS::TopicPolicy` -- reward
    # 1.0, against 0.0 for the hcl_raw twin of the same defect. The rule is
    # added rather than the row relabelled, so both `awscdk: "1"` rows are
    # now true and the two arms say the same thing about the same fact.
    - name: sns-topic-policy-allows-s3-publish-cfn
      description: >
        (awscdk only -- see sns-topic-policy-allows-s3-publish-tf for the
        TF-shaped arms.) Reference check, in two clauses (per resource,
        never "at least one" -- DECISIONS.md Amendment 29 §4 RULING 2).
        (a) SCOPING, POSITIONAL AND PER STATEMENT (round 16): for EVERY
        statement of the PolicyDocument that grants the s3.amazonaws.com
        service principal `sns:Publish`, that statement's
        `Condition.<op>["aws:SourceArn"]` must NAME an AWS::S3::Bucket this
        template's own notification resource wires -- through a Ref, an
        Fn::GetAtt, an Fn::Join, an Fn::Sub's `${LogicalId}` /
        `${LogicalId.Attr}` tokens, or any nesting of those. EVERY granting
        statement, so a correctly-scoped statement beside an unconditioned
        one launders nothing. Operators whose name contains "Not" are
        excluded. A document with no such condition, or one hardcoded to a
        literal ARN string, names nothing and leaves any bucket in any
        account able to publish to the topic.
        *** ROUND-16 RETRACTION of what stood here: "its PolicyDocument must
        NAME an AWS::S3::Bucket declared in this same template ... which is
        what an aws:SourceArn condition scoped to this bucket produces." The
        second half does not follow from the first. `expr_names` was run
        over the WHOLE PolicyDocument, so a bucket reference in a `Sid`, a
        `Resource`, or anywhere else satisfied it -- no position requirement
        at all. On the TF-shaped arms the identical shape was EXECUTED from
        REWARD 0.0 to REWARD 1.0 by ONE cosmetic line interpolating the
        bucket into a statement's `Sid`, and an `Fn::Sub`-ed `Sid` does the
        same thing here. Falsified now by the
        `hand-authored-topic-policy-bucket-named-only-in-the-sid` extra
        broken fixture. ***
        (b) COVERAGE (round 16, replacing the old per-policy ATTACHMENT
        clause): for EVERY AWS::SNS::Topic this template's own notification
        wires, SOME AWS::SNS::TopicPolicy must list it in `Topics`. A pasted
        literal topic ARN, an empty `Topics`, and an attachment to some
        OTHER topic in this same template all leave the topic that actually
        receives the notifications with no resource policy, and S3 drops
        every publish silently. Stated per WIRED TOPIC rather than per
        policy because the per-policy form denied a correct solution that
        also declares an unrelated ops/alarms topic with its own policy --
        an executed RULING-3 false FAIL on the TF-shaped arms, mirrored here
        for parity. Clause (a) is likewise quantified only over policies
        attached to a wired topic.
        Both clauses join on LOGICAL ID and the target's Type, never on a
        physical name (RULING 1). The statement's Action/Effect/Principal
        ARE now read -- but only to decide WHICH statements must be scoped,
        never as an independent requirement, and every predicate errs
        towards "this statement grants". That is the same use the TF-shaped
        arms' mirror makes of them, so it opens no strictness asymmetry; it
        closes one. The `cfn_jsonpath` below is
        tier-1 DOCUMENTATION only (SCHEMA.md §4.2 -- a tier-"1" path is the
        spec FOR the hand-authored rule and is never executed as the graded
        check); it shows only the "a policy document exists at all" half,
        because a single flat jsonpath cannot express "resolves to a
        resource whose Type is AWS::S3::Bucket".
        `oracles/rego-cfn/s3-notification-authoritative-singleton/policy.rego`
        is what actually grades this (`oracle.awscdk_tier1_engine: rego`,
        SCHEMA.md §4.5). Falsified by the
        `hand-authored-topic-policy-not-scoped-to-bucket` and
        `hand-authored-topic-policy-bucket-named-only-in-the-sid`
        (clause a) and `hand-authored-topic-policy-attached-to-a-different-topic`
        and `hand-authored-topic-policy-attached-to-a-decoy-topic`
        (clause b) extra broken fixtures, all awscdk-only, all isolated
        at tier 1.
      tier: "1"
      applies_to: [awscdk]
      cfn_jsonpath: "$.Resources[?(@.Type=='AWS::SNS::TopicPolicy')].Properties.PolicyDocument"
      op: exists

    # audit-topic-events-cover-a-real-delete -- ADDED round 6 (this file's
    # own VERIFIER-REJECTION FIX PASS (round 6) header). A presence/OR
    # requirement `op: in` structurally cannot express: the whitelist above
    # (object-removed-notification-targets-a-topic) only bounds which
    # events are ALLOWED on the topic target, it cannot require that one of
    # a named subset is PRESENT. Adversarial-verifier-PROVEN false-accept:
    # a topic wired to `s3:LifecycleExpiration:*` alone (zero
    # `s3:ObjectRemoved:*`-family entries) passed the whitelist untouched
    # even though, per AWS's own docs (already cited at round 5), that
    # event family never fires for an ordinary user-initiated delete --
    # only for one S3's own Lifecycle engine performs. This scenario never
    # enables bucket versioning, so `s3:ObjectRemoved:DeleteMarkerCreated`
    # alone has the identical problem (a delete marker is never created on
    # an unversioned bucket). This assert requires that at least one of the
    # two forms that DO fire for a real delete here --
    # `s3:ObjectRemoved:*` or `s3:ObjectRemoved:Delete` -- is present among
    # the topic target's wired events; it does not forbid anything the
    # whitelist above already allows (a solution wiring the full
    # six-literal union, or ANY subset that includes one of these two
    # alongside other members, still passes both asserts). The
    # `tf_jsonpath`/`cfn_jsonpath` below are ILLUSTRATIVE/tier-1-
    # documentation ONLY (same convention as sns-topic-policy-allows-s3-
    # publish-tf above, SCHEMA.md §4.2: a tier-"1" path is the spec FOR the
    # hand-authored Rego, never executed directly) -- shown as an
    # `op: contains` check for ONE of the two accepted literals for
    # readability; the ACTUAL rule (both `oracles/rego/.../policy.rego`'s
    # `fires_for_a_real_delete` and `oracles/rego-cfn/.../policy.rego`'s
    # own `fires_for_a_real_delete`, the awscdk mirror -- it was
    # `oracles/cfn-guard/.../policy.guard`'s `audit_topic_covers_a_real_
    # delete` rule before the round-10 engine port) ORs both literals for
    # real,
    # and only fires (denies) when a topic notification is wired at all
    # (an entirely-missing topic notification is already caught by
    # object-removed-notification-targets-a-topic/sns-topic-exists above,
    # both tier 0 -- this assert never fires "no topic wired" itself).
    - name: audit-topic-events-cover-a-real-delete
      description: >
        The topic target's wired notification events include at least one
        of `s3:ObjectRemoved:*` / `s3:ObjectRemoved:Delete` -- the two
        forms that actually fire for an ordinary, user-initiated delete on
        this (unversioned) bucket. A topic wired ONLY to the
        `s3:LifecycleExpiration:*` family, or ONLY to
        `s3:ObjectRemoved:DeleteMarkerCreated` (which never fires without
        bucket versioning), satisfies the six-literal whitelist above but
        does not satisfy "when any object is deleted" -- this assert is
        what actually enforces that half of the ticket's own wording. Does
        not forbid ALSO wiring `s3:LifecycleExpiration:*` /
        `:DeleteMarkerCreated` alongside either accepted literal (this
        file's own "oracle must tolerate" point 4, round-5's union case) --
        only a subset containing NEITHER accepted literal fails.
      tier: "1"
      applies_to: [awscdk, hcl_raw, terraconstructs]
      cfn_jsonpath: "$.Resources[?(@.Type=='Custom::S3BucketNotifications')].Properties.NotificationConfiguration.TopicConfigurations[*].Events"
      tf_jsonpath: "$.planned_values.root_module.resources[?(@.type=='aws_s3_bucket_notification')].values.topic[*].events"
      op: contains
      expected: "s3:ObjectRemoved:*"


# specs/s3-notification-authoritative-singleton.yaml
#
# Design source: docs/design/batch-a-greenfield-blueprints.md §9 (authored
# 2026-08-20, "Batch A"). Cluster decision (blueprint's own, applied
# verbatim): `s3-notification-clobber` MERGES here (same dedupe family, same
# evidence base, same greenfield static shape -- one scenario);
# `singleton-child-resource-clobber` STAYS SEPARATE in the brownfield queue
# (it is graded on a change to code the agent did not write, this one is
# graded on authoring from empty -- different metric strata, per
# docs/adding-scenarios.md §8). This scenario builds the reusable
# "cardinality of an authoritative child resource per parent" pattern the
# blueprint says §10/§8/the brownfield clobber sibling all reuse --
# oracles/rego has no shared-module mechanism (confirmed: oracles/rego/
# has one self-contained policy.rego per scenario, no common/lib file), so
# "reuse" means "the same hand-authored PATTERN", not a literal import --
# see this file's own policy.rego header comment for the reusable shape.
#
# THE MECHANISM (operator-facing -- id names it, no agent-visible name
# does, per SCHEMA.md §0.1): the S3 PutBucketNotificationConfiguration API
# has exactly ONE notification configuration per bucket and no
# create/update distinction -- every call REPLACES the whole document.
# Terraform's `aws_s3_bucket_notification` is therefore authoritative per
# bucket by necessity, not design: two separate resources targeting the
# same bucket fight forever, each apply clobbering the other's half of the
# configuration, and `terraform plan`/`validate` never says a word (no
# resource-level uniqueness constraint is checked before a real API call).
# Evidence, re-verified 2026-08-20 (blueprint §9(d), six of seven SUPPORT,
# one partially): tfp-aws#501 (CLOSED/completed, 74 upvotes, 45 comments --
# the canonical thread), #1715 (apparentlymart's root-cause explanation:
# the S3 API has one notification configuration and Terraform cannot tell
# it is replacing one), #23951 ("Multiple aws_s3_bucket_notification
# resources flipflop and overwrite each other" -- the mechanism in the
# title), #5299 (maintainer: "all the notifications must be bundled
# together in a single resource configuration"), #22147 ("can be silently
# overwritten", folded into the provider-wide #14394), #48509 (OPEN,
# 2026-06-22 -- AWS still lacks per-rule/If-Match writes, i.e. the root
# cause is still live today). #38402 PARTIALLY (closed not-planned,
# bot-only thread) -- kept out of provenance below.
#
# BOTH TYPED ARMS HIDE THIS BY CONSTRUCTION (source-verified 2026-08-20,
# not assumed):
#   - aws-cdk-lib 2.263.0 (local clone commit a9e6639, the exact pinned
#     release): aws-s3/lib/bucket.ts `withNotifications()` (~line 1024)
#     lazily creates `BucketNotifications` `if (!this.notifications)` --
#     re-read directly at this commit -- and
#     notifications-resource/notifications-resource.ts:136-141's own
#     `createResourceOnce()` guards the SINGLE `Custom::S3BucketNotifications`
#     the same way. An agent calling `addEventNotification` twice against
#     the same bucket physically cannot produce two custom resources.
#   - terraconstructs 0.2.13 (pinned in
#     arms/terraconstructs/environment/app/package.json; re-verified
#     directly against the exact 0.2.13 package tree at authoring time):
#     lib/aws/storage/bucket-notifications.js's own `addNotification()`
#     calls the SAME `createResourceOnce()` pattern (`if (!this.resource)`)
#     and accumulates every lambda/queue/topic target into ONE
#     `aws_s3_bucket_notification` resource -- confirmed the `topic` field
#     IS wired end-to-end (`this.topicNotifications` ->
#     `s3BucketNotificationTopicToTerraform` -> the L1's own `topic` block),
#     so the compliance half is genuinely expressible at this arm's L2, not
#     just the product half.
# So an agent authoring both requirements in one HCL pass, from two
# tickets, is the realistic hcl_raw failure mode this scenario measures;
# it is structurally UNREACHABLE on either typed arm through ordinary use.
#
# A REAL, VERIFIED DEVIATION FROM THE BLUEPRINT'S OWN EFFORT NOTE:
# blueprint §9(f) says terraconstructs coverage includes "SNS/TOPIC
# destination types (lib/aws/storage/notification-targets/)" as if a
# premade `TopicDestination` class exists there the way `FunctionDestination`
# and `QueueDestination` do. VERIFIED FALSE by direct read of the pinned
# 0.2.13 package: `lib/aws/storage/notification-targets/` contains ONLY
# `function.js`/`function.d.ts` and `queue.js`/`queue.d.ts` (confirmed via
# `notification-targets/index.d.ts`'s own two-line re-export list) -- no
# `topic.{js,d.ts}` anywhere in the package. `BucketNotificationDestinationType.TOPIC`
# exists as an enum member (bucket-destination.d.ts) and `bucket-notifications.js`
# fully implements the TOPIC branch of its own internal switch, but nothing
# in the public API IMPLEMENTS `IBucketNotificationDestination` for a
# `notify.Topic` the way `s3n.SnsDestination` does on awscdk
# (aws-s3-notifications/lib/sns.ts, also re-read directly: `bind()`
# unconditionally calls `this.topic.addToResourcePolicy(...)` with a
# Principal=s3.amazonaws.com / Action=sns:Publish / Condition=ArnLike
# aws:SourceArn=<bucket arn> statement -- CDK's compliance half is
# therefore BOTH auto-wired AND auto-scoped, with no escape hatch an
# ordinary agent would reach for). This is the scenario's real "M effort"
# tax the blueprint predicted for a different reason: this arm's reference
# solution must hand-author a ~15-line `IBucketNotificationDestination`
# implementation (calling `topic.addToResourcePolicy()` itself, mirroring
# `QueueDestination.bind()`'s own SQS-side pattern one file over) to reach
# the SAME L2 surface (`storage.Bucket.addEventNotification` +
# `notify.Topic`) the blueprint's own arms.terraconstructs.reason below
# claims -- still a real, working L2 path, just missing one destination
# class the library ships for the two sibling target types.
#
# CORRECTION (2026-08-21, this authoring pass -- found by actually running
# the terraconstructs reference solution through a real `cdktn synth` +
# `terraform plan`, not assumed): the FIRST version of this spec's
# sns-topic-policy-allows-s3-publish-tf Rego rule checked
# `aws_sns_topic_policy.<addr>.expressions.policy.references` directly and
# FAILED the terraconstructs arm's own correct reference solution.
# Root cause: unlike this scenario's hand-written hcl_raw solution (a raw
# `jsonencode(...)` policy argument), terraconstructs' `TopicBase.
# addToResourcePolicy()` composes the policy via a
# `data "aws_iam_policy_document"` data source and sets `policy =
# data.aws_iam_policy_document.<name>.json` -- so the DIRECT
# `.expressions.policy.references` list contains only
# `data.aws_iam_policy_document.*`, never `aws_s3_bucket.*`, on this arm.
# This is the SAME one-hop-indirection idiom
# `specs/s3-bucket-hardening-decomposition.yaml`'s own
# `tls-deny-covers-objects-too-tf` comment documents for a bucket policy.
# Fixed in `oracles/rego/s3-notification-authoritative-singleton/policy.rego`
# (see that file's own header comment for the exact mechanism: a `walk()`
# -based helper follows any `data.aws_iam_policy_document.*` reference one
# hop further and searches its own `.expressions` tree for the bucket
# reference) -- re-verified directly: the terraconstructs reference
# solution now passes, and every existing broken-fixture behavior (hcl_raw
# and terraconstructs alike) is unchanged by the fix.
#
# CARRIED OVER FROM s3-lambda-log-retention (same library version, same
# bug, re-verified applies here too): `BucketNotifications.addNotification`
# (lib/aws/storage/bucket-notifications.js) only registers a target INSIDE
# its `for (const filter of filters)` loop -- calling `addEventNotification`
# with ZERO filter args silently registers NOTHING. This scenario's
# terraconstructs reference solution passes one all-optional-fields filter
# object (`{}`) to BOTH `addEventNotification` calls for the same reason.
#
# THE LOUD/SILENT DISTINCTION (blueprint §9(e), carried forward): unlike
# `s3-bucket-hardening-decomposition` (§1, a token-cost probe where every
# catch is loud by design), this is a genuine SILENT-FAILURE probe -- the
# headline broken shape (two-notification-resources-for-one-bucket) plans
# green, applies green, and silently drops half the requirement at
# runtime with no diagnostic anywhere. Its rows belong in the silent-catch
# statistics §1's own do not.


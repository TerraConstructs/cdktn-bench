id: s3-notification-authoritative-singleton
# workspace_id (SCHEMA.md §0.1.1): single-step greenfield, so this is
# optional -- set explicitly because `id` names the diagnosis
# ("authoritative-singleton"). Deny-list run against `media-ingest`: no
# match on any AGENT_MECHANISM_DENY_PATTERNS entry (`lifecycle`,
# `replace*`, `drift`, `in[ _-]?use`, `already exists`, `perpetual`,
# `flip-flop`, `re-create`, `explicitly named`, `stale`,
# `create-before-destroy`, plus the meta class `pitfall`/`gotcha`/`trap`/
# `latent`/`poisoned`/`brownfield`/`find the bug`/`fix the mistake`/
# `review this config`) or AGENT_FORESHADOW_DENY_PATTERNS entry
# (`re-deploy`, `re-apply`, `day 2`, `next step`, `change request`,
# `iteration`, `subsequent`, `follow-up`) -- clean.
workspace_id: media-ingest
# title (agent-visible header -- single-step greenfield, so `workspace_title`
# is FORBIDDEN per SCHEMA.md §0.1; stamped byte-for-byte into
# lib/scenario-stack.ts / bin/app.ts's CFN description / main.tf / main.ts).
# Names only the two things the ticket itself states (upload -> transcode,
# delete -> audit). Deny-list swept: `triggers`, `audits`, `uploads`,
# `deletes` match neither list -- clean.
title: "Media bucket that triggers processing on upload and audits deletes"
difficulty: 2
services: [s3, lambda, sns, iam]

arms:
  awscdk: true
  hcl_raw: true
  terraconstructs:
    enabled: true
    reason: >
      arms/terraconstructs/README.md §3 ("storage" module row: S3
      bucket/notifications) plus the s3-lambda-log-retention spec's own
      already-verified `storage.Bucket` + `bucket-notifications.js` LAMBDA
      path (re-confirmed directly against the pinned 0.2.13 package at
      this scenario's own authoring time) together establish the product
      half's coverage. The compliance half needs one further,
      independently-verified fact this reason states explicitly rather
      than assuming parity: `notification-targets/` (the directory the
      LAMBDA path's `FunctionDestination` lives in) has NO premade `Topic`
      destination class -- confirmed by reading
      `notification-targets/index.d.ts` directly (`export * from
      "./function"; export * from "./queue";`, nothing else) -- even
      though `bucket-notifications.js` itself fully implements the TOPIC
      branch internally and `notify.Topic` (lib/aws/notify/topic.d.ts) is
      a real, separate L2 SNS construct with its own `addToResourcePolicy`
      (topic-base.d.ts). Enabled anyway, at real (not contrived) L2 cost:
      this scenario's own reference solution hand-authors a ~15-line
      `IBucketNotificationDestination` for `notify.Topic` (mirroring
      `QueueDestination.bind()`'s own SQS pattern one file over in the
      same package -- both call the target's own `addToResourcePolicy`/
      `grantSendMessages`, the same shape this new class needs) and passes
      it to the SAME public `bucket.addEventNotification()` entry point
      the LAMBDA half uses -- a real, if partial, L2 surface, not an L1
      escape hatch. See this file's own header comment for the full
      verification trail (source-verified against `notify/topic.js`: the
      L1 it wraps is `@cdktn/provider-aws`'s `snsTopic.SnsTopic`, i.e.
      `aws_sns_topic`, and `addToResourcePolicy` provisions a real
      `snsTopicPolicy.SnsTopicPolicy` -> `aws_sns_topic_policy`).

instruction:
  shared_body: |
    The media bucket needs two things wired up.

    Product: when a file is uploaded, the ingest function must run so the
    asset is transcoded.

    Compliance: when any object is deleted, the audit topic must receive a
    notification so deletions show up in the quarterly review.

    Both signals need to come straight from the bucket itself, not through
    any shared notification or messaging layer other teams might also be
    plugged into.
  placeholders: []
  per_arm:
    awscdk:
      language_line: "Author this as an AWS CDK (TypeScript) app using aws-cdk-lib L2 constructs."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdk.out/ScenarioStack.template.json
        build_command: "npm run build"
        synth_command: "npx cdk synth --no-lookups --quiet -o cdk.out"
        json_fields: []
    hcl_raw:
      language_line: "Author this as hand-written Terraform HCL (no modules)."
      output_contract:
        entry_file: main.tf
        artifact_path: plan.json
        plan_command: >-
          terraform init && terraform validate && terraform plan -out=plan.tfplan
          && terraform show -json plan.tfplan > plan.json
        json_fields: []
    terraconstructs:
      language_line: "Author this using terraconstructs (TypeScript) L2 constructs, synthesized via cdktn."
      output_contract:
        entry_file: lib/scenario-stack.ts
        artifact_path: cdktf.out/stacks/media-ingest/plan.json
        synth_command: "npx cdktn synth"
        json_fields: []

# --- ORACLE MUST TOLERATE / DEFEND (operator-facing, adding-scenarios.md
# §1 item 3a -- never in prompt prose; blueprint §9(b)'s own analysis,
# expanded with this authoring pass's own findings) --------------------
#
# 1. Presenting the two requirements as two stakeholders' asks (Product /
#    Compliance) is deliberately what makes the two-call-site authoring
#    shape natural rather than telegraphed -- the graded evidence set asks
#    for exactly this framing. It is in-world ticket voice, not
#    oracle-defensive spec-ese: nothing about it forces a specific resource
#    count or call-site count, only that both requirements get met.
# 2. Shapes that satisfy the ticket, among shapes wired DIRECTLY off the
#    bucket's own notification configuration (the ticket's own "straight
#    from the bucket itself" sentence, round-4 -- see this file's own
#    ROUND-4 header below): ONE `aws_s3_bucket_notification` with both a
#    `lambda_function` and a `topic` block, or on the typed arms, two
#    `addEventNotification`/`addObjectRemovedNotification` calls against
#    the SAME bucket (which the typed arms' own `createResourceOnce()`
#    collapses into one resource regardless, per this file's header
#    comment). The oracle grades the OUTCOME within that direct-wiring
#    family -- both event types wired, at most one authoritative
#    notification resource per bucket -- never the number of call sites or
#    which `addEventNotification`/`addObjectRemovedNotification` spelling
#    was used.
#
#    NOT accepted, and NOT "the only correct TF shape" (that claim, present
#    in an earlier authoring pass, was FALSE and is corrected here --
#    round-4, see this file's own header): EventBridge fan-out
#    (`aws_s3_bucket_notification { eventbridge = true }` +
#    `aws_cloudwatch_event_rule`/`_target` per consumer) is a real,
#    provider-documented, provider-RECOMMENDED pattern for exactly this
#    two-independent-teams framing (website/docs/r/
#    s3_bucket_notification.html.markdown's own NOTE, and its worked
#    "Team A" / "Team B" example) -- rejected here not because it fails the
#    ticket's intent, but because the ticket's own added sentence ("Both
#    signals need to come straight from the bucket itself, not through any
#    shared notification or messaging layer other teams might also be
#    plugged into") states an in-world constraint this account's ticket
#    puts on THIS delivery, ruling out the shared-bus indirection. Same
#    reasoning rules out routing both events through one SNS topic with the
#    ingest Lambda subscribed to it (S3 -> SNS -> Lambda, an SNS-relay
#    shape) -- the Lambda would then run because of an SNS message, not
#    because S3 invoked it directly, which is exactly the "through a shared
#    messaging layer" indirection the same sentence forecloses. Both
#    alternatives are genuinely functional and would satisfy a DIFFERENT
#    ticket; they do not satisfy this one now that the sentence is present.
# 3. The SNS topic policy is part of "the topic must receive a
#    notification": S3 cannot publish to a topic with no resource policy
#    granting it `sns:Publish` (this is a functional fact about the SNS
#    API, not a style preference) -- graded as such, not as an add-on.
# 4. "when any object is deleted" is graded against `s3:ObjectRemoved:*`,
#    OR (round-2 fix, see this file's own VERIFIER-REJECTION FIX PASS
#    header) any subset of the enumerated per-cause forms
#    (`s3:ObjectRemoved:Delete`, `:DeleteMarkerCreated`) -- this scenario
#    does not require bucket versioning, so a solution is never penalized
#    for wiring only `:Delete` (the primary "a file is deleted" case);
#    wiring the fuller enumeration (both `:Delete` and
#    `:DeleteMarkerCreated`, the exhaustive non-wildcard equivalent of "any
#    object is deleted" once versioning IS in play) must ALSO pass, not
#    just the wildcard spelling. ROUND-5 FIX (this file's own
#    VERIFIER-REJECTION FIX PASS (round 5) header): `s3:ObjectRemoved:*`
#    does NOT cover deletes performed by an S3 Lifecycle rule -- AWS's own
#    S3 User Guide states this explicitly ("These event notifications
#    don't alert you for automatic deletes from lifecycle configurations")
#    -- so a solution that ALSO wires the separate `s3:LifecycleExpiration:*`
#    family (or its own `:Delete` / `:DeleteMarkerCreated` per-cause forms)
#    alongside `ObjectRemoved` is satisfying "when any object is deleted"
#    MORE completely, not incorrectly; `expected` below now lists all six
#    literals across both families for exactly this reason. `oracle.
#    structural_asserts` below uses `op: in` against the full six-literal
#    set (a resolved event outside BOTH families still fails outright,
#    e.g. an accidentally-wired `s3:ObjectCreated:*` on the topic target).
#    ROUND-6 CORRECTION (this file's own VERIFIER-REJECTION FIX PASS
#    (round 6) header -- superseding, not preserving, round 5's own "Any
#    non-empty subset of the six passes" claim): `op: in` bounds membership
#    but cannot REQUIRE it, so the six-literal whitelist alone let a
#    solution wire `s3:LifecycleExpiration:*` (or `:Delete`/
#    `:DeleteMarkerCreated`) ALONE, with zero `s3:ObjectRemoved:*`-family
#    entry anywhere -- a shape that, by this same point's own citation of
#    AWS's docs, never fires for an ordinary user-initiated delete on this
#    (unversioned, so `DeleteMarkerCreated` alone never fires either)
#    bucket. A SEPARATE tier-1 structural_assert,
#    `audit-topic-events-cover-a-real-delete` (declared below, alongside
#    the reused six-literal whitelist, not in place of it), now requires
#    that at least one of `s3:ObjectRemoved:*` / `s3:ObjectRemoved:Delete`
#    -- the two forms that actually fire for a real delete here -- is
#    present among the wired topic events. This is a presence/OR
#    requirement layered on top of the existing whitelist, not a
#    narrower one: every shape round 5 legalized that ALSO includes one of
#    those two still passes unchanged (the full six-literal union, in
#    particular, is unaffected); only a subset containing NEITHER of the
#    two -- LifecycleExpiration-only or DeleteMarkerCreated-only -- now
#    correctly fails.
# 5. "when a file is uploaded" is graded against `s3:ObjectCreated:*` or
#    ANY of the narrower, non-overlapping per-cause forms
#    (`:Put`, `:Post`, `:Copy`, `:CompleteMultipartUpload`) -- all five are
#    listed in `oracle.structural_asserts`' `op: in` `expected` set below
#    (round-3 fix: round-2 widened the original two-literal list to three
#    but still omitted `:Copy`, rejecting the fully-precise four-event
#    upload enumeration a careful agent might reach for -- e.g. via
#    aws-cdk-lib's own `EventType.OBJECT_CREATED_COPY`; see this file's
#    own VERIFIER-REJECTION FIX PASS (round 3) header) so a solution is
#    never penalized for being MORE precise than the wildcard, only for
#    wiring an event outside the ObjectCreated family entirely.
# 6. The SNS topic's resource policy (point 3) may take EITHER of the
#    provider's two documented shapes: a standalone `aws_sns_topic_policy`
#    resource (this scenario's own hcl_raw reference solution's choice), OR
#    a `policy` argument set directly on `aws_sns_topic` itself (the
#    provider's OTHER documented shape for the identical wiring -- in fact
#    the FIRST example on its own `aws_s3_bucket_notification` docs page).
#    Both are graded identically (scoped to this bucket, attached to this
#    topic) -- round-2 fix, see this file's own VERIFIER-REJECTION FIX PASS
#    header for why the first authoring pass rejected the second shape and
#    how the oracle now ORs them (in Rego, not in prompt prose -- nothing
#    about `shared_body` above names either shape).
# 7. ROUND-4 (see this file's own header below): `shared_body` states that
#    both signals must come "straight from the bucket itself, not through
#    any shared notification or messaging layer other teams might also be
#    plugged into" -- an in-world outcome constraint (docs/
#    adding-scenarios.md §1 item 3a option (b)), not a resource-shape
#    directive. It names no API, no resource type, no provider. Its effect
#    is that EventBridge fan-out and an SNS-relay-to-Lambda shape (point 2
#    above) are excluded BY THE TICKET, not by an undisclosed oracle
#    preference -- both remain real, working architectures for a ticket
#    that does not carry this sentence, and this file says so rather than
#    pretending they are wrong in general.
# 8. ROUND-8, CORRECTED AND MADE PRECISE AT ROUND 9 (see this file's own
#    headers below). Hoisting a value into a Terraform `locals` block --
#    or into a `var`, or into a TS `const` on either TypeScript arm -- is
#    ordinary DRY authoring, and a correct solution that does it is graded
#    identically to one that writes the reference inline, on EVERY arm.
#    This scenario invites the hoist: on the TF-shaped arms the bucket ARN
#    is referenced twice (the invoke permission's `source_arn` and the
#    topic policy's `aws:SourceArn` condition) and the topic ARN three
#    times (the topic policy's own `arn`, that policy's `Resource`, and
#    the notification's `topic_arn`). The hcl_raw reference solution is
#    authored with BOTH hoisted, so `make falsifiability` re-proves the
#    acceptance on every run.
#
#    What the round-8 wording got wrong, and round 9 fixes, is the claim
#    that this works by accepting a `^(local|var)\.` reference wherever
#    one appears. That is true only in a DEDICATED SINGLE-ARN ARGUMENT
#    SLOT -- an argument whose entire value IS the ARN under test
#    (`source_arn`, `aws_sns_topic_policy.arn`) -- where `.references`
#    says exactly what the argument was set to. It is NOT true inside a
#    policy DOCUMENT: `terraform show -json` emits one flat `references`
#    list for a whole `jsonencode(...)` expression, so a bare `local.x`
#    entry there could be the `aws:SourceArn` condition value, the
#    statement's `Resource`, or anything else -- and round 8's blanket
#    acceptance let an unscoped policy pass merely because it mentioned
#    the TOPIC's own ARN through a local. In a policy document the
#    tolerance is therefore scoped by PROVENANCE: only a symbol this
#    configuration itself uses as the BUCKET ARN (i.e. one sitting in an
#    s3.amazonaws.com invoke permission's `source_arn` slot) counts.
#
#    ROUND-10 CORRECTION, in two parts, superseding the round-8/9 wording
#    that stood here (this file's own VERIFIER-REJECTION FIX PASS (round
#    10) header).
#
#    (a) The cost claim was WRONG FOR THIS SCENARIO. Round 8/9 said the
#    residual -- an unrelated ARN laundered through a local and used in an
#    ARN slot -- "is strictly more work than writing the literal inline".
#    Not here: this scenario's own reference solution already hoists
#    `local.audit_topic_arn`, so `source_arn = local.audit_topic_arn` is
#    ONE TOKEN off the correct `local.media_bucket_arn` and costs nothing
#    extra at all. An adversarial verifier PROVED by execution that this
#    artifact scored reward 1.0 on hcl_raw while the byte-for-byte
#    equivalent awscdk decision (`sourceArn: auditTopic.topicArn`) scored
#    0.0. The rule is therefore NARROWED by provenance, using round 9's own
#    technique one level down: an unresolvable `local.`/`var.` symbol still
#    stands in for an ARN, but not when this configuration also uses that
#    same symbol as a DIFFERENT ARN (a symbol in an
#    `aws_sns_topic_policy.arn` slot can no longer denote the bucket in a
#    `source_arn` slot, and vice versa -- `policy.rego`'s
#    `slot_provenance_conflict`). Every correct solution is unaffected: a
#    hoist that uses one symbol for one ARN, which is what a DRY hoist IS,
#    never conflicts. Falsified by the new
#    `second-lambda-permission-scoped-to-the-topic` broken fixture on both
#    TF-shaped-and-awscdk sides.
#
#    (b) The SYMMETRY claim is no longer true. "The equivalent leniency on
#    awscdk is `Fn::Sub`-composed SourceArns" held only while that arm was
#    graded by cfn-guard; round 10 ported it to Rego, which parses Sub
#    tokens, so awscdk now resolves every indirection its artifact can
#    express. What genuinely remains is ONE-SIDED and narrower than before:

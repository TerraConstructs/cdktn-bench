    - "docs/design/conftest-hcl-traversal-spike.md (LANDED 2026-08-23, its §0.0) -- the timeboxed spike this file's ROUND 13 implements: adopt `hcl2json` (4.1 MB, pinned + sha256-verified, offline) NOT conftest (68 MB, the byte-identically same parser, and adopting it as the ENGINE would reshape `input` for every existing Rego rule in the repo); keep `opa 1.19.0` and the `deny == []` reward contract unchanged; merge the parsed .tf under one reserved key `_hcl`; glob in the shell because a Rego policy can neither glob nor list a directory and `parse_config_file` on a missing file is UNDEFINED rather than an error (i.e. fails OPEN). Its three executed defects in the prototype's OWN safety contract are the reason `oracles/rego/lib/hcl_traversal.rego` is shaped as it is -- a missing arity gate on one of two twin slots (silent PASS), a `verdict` that went undefined past a hand-unrolled 4-hop ceiling (silent PASS), and a dot-joined rule key that raised eval_conflict_error and ABORTED evaluation, scoring a CORRECT solution 0.0 with no deny message (silent FAIL). Two further corrections were found at landing and applied to the memo in place: a §4 coverage claim that overstated by one fixture, and a §5.3 residual that read as a prototype limitation when NEITHER the prototype NOR the shipped policy covered it on ANY arm"
    - "This file's own ROUND-14 correction (2026-08-24) -- an adversarial verifier REJECTED round 13 and proved, by execution in the real hcl_raw image under `--network none`, that its headline new capability was DISABLED by an ordinary spelling of the notification's own `bucket` argument. `slot_names_arn_of` had a SECOND clause accepting on resource TYPE alone whenever `count(anchors) != 1`, and the anchors came from the notification's own slot -- so `bucket = \"cdktn-bench-media-ingest-media\"` (a plain bucket name, which is what that argument takes), `bucket = var.x`, or any opaque `local.` emptied the anchor set and re-opened same-type/wrong-instance. Executed: two buckets, the invoke permission and the topic-policy condition scoped to the DECOY, `tier0_pass=1 tier1_status=PASS`, deny `[]`, REWARD 1.0 on an artifact where S3 can never invoke the Lambda; reproduced twice more (an opaque `local.` on the bucket half, and the topic half via an opaque `topic_arn` plus a decoy-attached `aws_sns_topic_policy`). The stated mitigation -- 'every artifact that reaches that fallback is already denied at tier 0' -- was FALSE and stood in three operator-facing places (policy.rego, rego-cfn/policy.rego, the spike memo sect 5.3); tier 0 counts notification resources and whitelists event strings and passed in all three reproductions. FIXED by DELETING the fallback on both policy files: the anchor is now established POSITIVELY, by reference OR (bucket half only) by matching the notification's plan-time-known `bucket` value against exactly one created bucket's own `bucket` name, and DENIES when neither route identifies one instance. The plan-value route is what keeps the ordinary literal spelling a PASS rather than trading a silent pass for a false fail. Three new hcl_raw fixtures; the positive twin lives in oracles/tests/test_hcl_traversal.py. SEPARATELY, the same verifier proved the advertised `*.tf.json` glob produced a FALSE FAIL with a message the artifact contradicted (terraform's JSON syntax spells `locals` as an OBJECT, hcl2json as a LIST; only the list spelling was read, so every local was silently dropped) -- both spellings are read now, with a regression test per spelling"
    - "This file's own ROUND-13 correction (2026-08-23) -- the fifth consecutive round in which \"oracle must tolerate/defend\" point 8 named a mechanism, declared the class closed, and was falsified. What differs this time is that the mechanism changed KIND rather than gaining another epicycle: rounds 8-12 reasoned about a SYMBOL because `terraform show -json` emits no `locals`; round 13 reads the REFERENT. Three things landed with it, each PROVEN by execution against the round-12 policy and the round-13 policy on the same planned artifact. (1) The residual four rounds called IRREDUCIBLE -- a bucket ARN reached through ONE symbol while a different resource's ARN is laundered through a SECOND symbol into `source_arn` -- was never irreducible, only irreducible from plan.json: round 12 deny set EMPTY (reward 1.0), round 13 DENY, fixture `lambda-permission-scoped-to-a-second-symbol-holding-the-lambda-arn`. (2) A hole NO round had recorded on ANY arm, in EITHER direction: SAME-TYPE / WRONG-INSTANCE. Every acceptance test in `oracles/rego/` AND in `oracles/rego-cfn/` was a TYPE test that cannot tell two buckets apart, so a `source_arn` scoped to a bucket the notification does not wire -- S3 can never invoke the function -- scored 1.0 everywhere, laundered or written directly; likewise a topic policy attached to a decoy topic. Closed on all three arms by joining on the resource INSTANCE the configuration's own notification resource wires (plan address on the TF arms, logical id on awscdk), with six new fixtures. (3) The ARITY GATE, which round 12 had on `source_arn` and not on `aws_sns_topic_policy.arn`: an ambiguity written in the open (`arn = var.flip ? A : B`) was silently accepted; the gate now lives in the shared library so neither slot can be written without it. Also landed: `ENGINE_ERROR` as a distinct, run-invalidating tier-1 status so an oracle that CRASHES is no longer scored as the agent's failure -- scoped to this scenario, which is itself recorded as a residual"
    - "generator/check_tier1_coverage.py -- the mechanical floor that required adding the two non-blueprint catches (lambda-permission-not-scoped-to-bucket, sns-topic-policy-not-scoped-to-bucket) documented in this file's own catches[] header comment"
    - "This file's own VERIFIER-REJECTION FIX PASS header (2026-08-21, round 2) -- an adversarial verifier's three PROVEN findings (inline aws_sns_topic.policy shape scoring 0.0, both notification-event whitelists rejecting more-precise correct wirings, the hcl_raw arm's unrecorded hashicorp/archive mirror gap) and the fixes applied for each, in place, without restarting the scenario"
    - "This file's own VERIFIER-REJECTION FIX PASS (round 3) header (2026-08-21) -- an adversarial verifier's PROVEN finding that round 2's fix to object-created-notification-targets-a-lambda was narrowed, not closed (s3:ObjectCreated:Copy still missing from `expected`, reachable via aws-cdk-lib's own EventType.OBJECT_CREATED_COPY), and the fix applied in place"
    - "This file's own VERIFIER-REJECTION FIX PASS (round 4) header (2026-08-22) -- an adversarial verifier's PROVEN-by-execution finding that the EventBridge fan-out shape (provider-documented and provider-recommended for this exact two-team framing) and an S3->SNS-relay-to-Lambda shape both score 0.0 while the spec falsely called the native one-resource shape 'the only correct TF shape'; fixed via docs/adding-scenarios.md §1 item 3a option (b) -- one in-world outcome sentence added to `shared_body`, the false claim corrected in place, oracle.intent and 'oracle must tolerate/defend' updated to match, no structural_assert/catch/policy change"
    - "This file's own VERIFIER-REJECTION FIX PASS (round 5) header (2026-08-22) -- an adversarial verifier's PROVEN-by-execution finding that object-created-notification-targets-a-lambda's sibling assert (object-removed-notification-targets-a-topic) still whitelisted only the ObjectRemoved family while AWS's own docs list a separate, non-overlapping LifecycleExpiration family that also constitutes 'any object is deleted'; fixed by widening `expected` to the six-literal union of both families"
